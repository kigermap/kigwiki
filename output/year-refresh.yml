2025:
  intro: 2025 年重点记录专门活动、入门制面工作坊、Doll Weekend 跨境合作与大型庆典，并补入年底制作者目录版本。活动、规则与资料出版各自保留发生时间和来源。
  highlights: |
    - **2 月东京**：第 3 回きぐるみパーティ的场地与摄影安排。
    - **5 月多伦多**：Kigurumi Online 的入门制面工作坊；同月 DW 与 First Klass 在日本合作。
    - **8 月河源**：DW12 的节目、展商与主办方规模记录。
    - **12 月 10 日**：Celes Halcyon 公布本年版本的面具制作者目录。[^maker-list]
  drop: [1 月：术语, 11 月下旬：匿名论坛, 9—10 月：, 7 月：Japan Expo, 6 月 17 日, 8 月 1—3 日：Lagucos, 12 月：年末]
  events:
    - title: 5 月 23 日工作坊安排：部件选择、组装与佩戴适配
      replace_event: 5 月 23 日
      body: |
        工作坊官方页面在 4 月 25 日更新，写明本年场次为 5 月 23 日 19:00。课程先介绍 animegao 历史、制作者及制作方法；付费动手参加者在志愿者协助下选择眼形、眼色、眉毛、睫毛和假发，并通过内部填充调整佩戴。旁听不收费。[^kig-o]

        ![Kigurumi 工作坊中面具部件选择与佩戴适配的说明图](../../../assets/images/years/2025-mask-workshop-explainer.webp)

        *AI 说明图，依据工作坊文字概括部件关系；不是当届活动实拍、实际商品照片或制作方图纸。*

        官网把报名与动手制作作为不同参与方式，并提供当年售票入口。未取得当年价目和最终完成人数，本文不补写费用或教学成果统计。
    - title: 12 月 10 日：Kigurumi Mask Makers List 公布本年版本
      body: |
        Celes Halcyon 整理的公开制作者目录明确写明，当前版本于 2025 年 12 月 10 日发布，主要资料在 9–10 月逐步更新，11 月及 12 月初又作修订。[^maker-list]

        目录将专业制作者与爱好者制作者共同列入，并保留部分可能已不活跃的制作方。编者同时说明，目录不保证信息准确性，也不为质量或信誉背书。这是一项本年的社群资料出版记录，不是所有工房均在该日开业或营业的证明。
  sources: |
    [^maker-list]: Celes Halcyon，《Kigurumi Mask Makers List》，版本发布日 2025-12-10，<https://makers.kig-o.com/>。
  summary: 本年重点既包括大型线下庆典和跨境活动，也包括降低制作入门门槛与整理供应信息的工作。主办方宣传规模、课程安排和目录版本各有统计或时间边界；未能确认日期的商业通知与传闻不列入年度事件。
