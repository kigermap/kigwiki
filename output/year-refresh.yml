1997:
  intro: 1997 年现存可核对的资料主要是综合游戏展的公共背景。本卷保留东京电玩展春、秋两届的独立记录；目前尚未取得能明确归入本年的 animegao 制作或同好活动资料。
  highlights: |
    - **春秋两届**：4 月与 9 月分别举行，主办方记载本年开始采用一年两届的安排。
    - **分别建档**：春季主题为「みんな集まれゲームの新学期！」，秋季主题为「The Entertainment of Your Life」。
    - **人数口径**：121,172 与 140,630 均为整届展会来场统计，不是 kigurumi 参与人数。[^tgs-history]
  drop: [后续专题站]
  events:
    - title: 年度档案：两届展会的主题与统计对象
      body: |
        主办方将春季列为第 2 届、秋季列为第 3 届，并分别保留主题、海报和会期。春季以「游戏的新学期」为主题，秋季采用英文「The Entertainment of Your Life」。两个条目对应不同会期，适合分别查找现场节目、展商资料和当届参与记录。[^tgs-history]

        海报和会场图片可在主办方历史页查看；该页没有逐一识别其中的面具角色，因此这里仅把它们作为当届展会的图像资料入口。
  summary: 本年的确定节点是春、秋两场综合展会及其举办频次变化。专题实践仍有资料缺口，暂不将未注明身份的展会人物照片归作 animegao 记录。
1998:
  intro: 1998 年卷记录东京电玩展两次会期和主办方对春季入场安排的回顾。该批档案属于公共展会背景，可用于定位同期资料，但不能单独确认 kigurumi 到场。
  highlights: |
    - **春季会期**：3 月 20–22 日，主题「ゲームは無限のエネルギー。」。
    - **秋季会期**：10 月 9–11 日，主题「ゲームパワー、見せてあげる。」。
    - **当年特色**：主办方记载春季向排队最前方的一组入场者赠送纪念品。[^tgs-history]
  drop: [后续专题站]
  events:
    - title: 年度档案：春季入场安排与两届主题
      body: |
        春季第 4 届与秋季第 5 届分别以「游戏是无限的能量」和「展现游戏的力量」为宣传主题。官方为两届分别保留海报、日期与来场统计，使同一年内的两组素材可以依据会期辨认。[^tgs-history]

        春季的排队纪念品是具体的入场运营记录；原文没有交代礼品种类、领取人数，也没有把获赠者称为 cosplayer 或 kigurumi 表演者。
  summary: 本年材料能说明展会以两次会期开展公众活动，并留下入场服务的细节。尚无足够的专题来源支持面具制作、同好聚会或人数方面的进一步判断。
1999:
  intro: 1999 年的资料已能落到具体制作团队和面具角色摄影。SIGMA 官网的创立记载及带日期图集，为本年提供了直接的 kigurumi 来源；东京电玩展作为同期公共背景另行记录。
  highlights: |
    - **制作团队**：造型工房 SIGMA 自述始于 1999 年。
    - **表情与附件**：10 月的 Multi 图集记录用眼睑、手腕附件还原角色状态。
    - **作品传播**：另一组图集以角色广告插画为摄影参照。[^sigma-home][^sigma-charge][^sigma-multi]
  drop: [后续专题站]
  events:
    - title: 年内：造型工房 SIGMA 的创立记载
      before: 3 月
      body: |
        SIGMA 官方首页标注「BUILD UP STUDIO SIGMA since 1999」，并将业务说明为着ぐるみ面具、服装及道具制作。这个年份来自制作方的自述，适合记录为团队的创立年份；资料没有给出本年首笔订单、首个公开活动或精确开业日。[^sigma-home]
    - title: 10 月 12–17 日图集日期：Multi 的闭眼与充电状态
      body: |
        《MULTI GALLERY-7》说明，团队为再现《To Heart》中 Multi 的充电情节，使用了眼睑与手腕附件，并围绕相对固定的姿势从不同角度拍摄。图集保留 10 月 12 日和 17 日的日期标注。[^sigma-charge]

        这是一条具体的表演造型记录：角色状态由附件、姿势和取景共同构成。页面讲述的是对虚构情节的摄影再现，不能把图中故事当成现实事件。
    - title: 10 月 14 日图集日期：以广告插画为参照的角色摄影
      body: |
        《MULTI GALLERY-6》的本年条目以《To Heart》宣传插画为参照，分别展示全身与上半身构图，并注明装演署名。页面说明其目标是再现插画形象，展示了从平面角色到面具造型、服装与摄影构图的转换。[^sigma-multi]

        本条仅对应图集内标注为 1999 年 10 月 14 日的照片条目；图集后续追加内容不计入本年。图集日期不是拍摄日的独立证明。
  sources: |
    [^sigma-home]: 造型工房 SIGMA，官方首页的「since 1999」及业务介绍，访问于 2026-09-09，<https://www.buildupstudiosigma.com/>。
    [^sigma-charge]: SIGMA，《MULTI GALLERY-7》，1999-10-12、10-17 图集标注，<https://www.buildupstudiosigma.com/archive/multi/multi70.htm>。
    [^sigma-multi]: SIGMA，《MULTI GALLERY-6》，1999-10-14 条目，<https://www.buildupstudiosigma.com/archive/multi/multi60.htm>。
  summary: 制作团队的成立、眼睑与手腕附件的使用、参照插画的摄影实践，使本年记录从综合展会背景延伸到可识别的角色制作与作品展示。现有图集不能推算整个社群或市场规模。
2000:
  intro: 2000 年的重点是角色制作和面具表情的具体实践。SIGMA 图集明确提到制作月份、替换部件及摄影方法，能够补充单纯展会年表无法呈现的工艺内容。
  highlights: |
    - **2 月制作**：双叶萤的角色造型，随后在 6 月图集中展示。
    - **2–5 月图集**：Multi 使用两只面具、闭眼眼睑与无高光眼片表现角色状态。
    - **3 月制作**：来栖川绫香的制作月份由制作方图集序言明确记载。[^sigma-hotaru][^sigma-reboot][^sigma-ayaka]
  drop: [后续专题站]
  events:
    - title: 2 月制作、6 月展示：双叶萤角色造型
      before: 3 月
      body: |
        《HOTARU GALLERY-1》直接说明角色于 2000 年 2 月制作，图集条目标注 6 月 4–5 日。制作者展示迎敌姿势、普通站姿与胜利手势，并说明发辫、缎带及翘发让整体造型较大。[^sigma-hotaru]

        这里可以分别确认作品制作月份与图集标注日期；没有材料将它们指向某场公开展会。造型尺寸与姿势选择共同影响角色呈现，是这一制作记录中可保留的具体信息。
    - title: 2–5 月图集日期：用可替换眼部部件组织表情
      before: 3 月
      body: |
        《MULTI GALLERY-8》记录，为表现角色「再起动」情节，团队使用两只面具、闭眼用眼睑和没有高光的眼片。相关条目标注 2 月 18 日、3 月 19 日与 5 月 18 日。[^sigma-reboot]

        它说明固定面容的角色摄影也可以通过更换部件组织状态变化。原文能够支持这些部件的使用，但不支持自动机械表情、电子控制或当年行业普及程度的推断。

        ![以不同眼片和眼睑表现面具状态的原理示意](../../../assets/images/years/2000-expression-parts-explainer.webp)

        *AI 原理示意图，用于解释替换眼部部件的思路；不是 SIGMA 原作品复原或历史现场照片。*
    - title: 3 月：来栖川绫香的角色制作
      before: 3 月 31
      body: |
        SIGMA 的绫香图集序言明确写道，来栖川绫香于 2000 年 3 月制作。这个日期指向制作本身，值得作为独立作品节点保留。[^sigma-ayaka] 现有资料没有提供当时工期、价格或生产数量。
  sources: |
    [^sigma-hotaru]: SIGMA，《HOTARU GALLERY-1》，制作月份与 2000-06-04、06-05 图集条目，<https://www.buildupstudiosigma.com/archive/hotaru/hotaru00.htm>。
    [^sigma-reboot]: SIGMA，《MULTI GALLERY-8》，2000 年图集与部件说明，<https://www.buildupstudiosigma.com/archive/multi/multi80.htm>。
    [^sigma-ayaka]: SIGMA，《AYAKA GALLERY-1》，序言明确记录 2000 年 3 月制作，<https://www.buildupstudiosigma.com/archive/ayaka/ayaka00.htm>。
  summary: 本年最有价值的是可以具体描述的制作与摄影方法：发型影响造型体积，姿势塑造角色，眼睑和眼片能够改变画面中的角色状态。制作时间、照片条目日期与展会日期分别记录。
2001:
  intro: 2001 年保留下来的 SIGMA 图集涵盖校园叙事、舞台式灯光和户外角色摄影。它们是具体作品的公开档案，补足了本年原先只有综合展会背景的情况。
  highlights: |
    - **3–4 月**：来栖川芹香两组图集采用不同场景和灯光。
    - **5 月**：Multi 公园摄影说明季节、天气与装演协作。
    - **10–12 月**：绫香与成濑川奈留的图集留有明确日期。[^serika][^serika-night][^multi-park][^ayaka-gallery][^naru]
  drop: [后续专题站]
  events:
    - title: 3 月 23 日、4 月 21 日图集日期：芹香的两种场景
      before: 3 月 30
      body: |
        《SERIKA GALLERY-1》以重现游戏中的气氛为制作说明，图集标注 3 月 23 日；《SERIKA GALLERY-2》标注 4 月 21 日，以夜间情节为题材，制作方明确解释了灯光和氛围的安排，也坦承一件帽子道具未能及时完成。[^serika][^serika-night]

        两组图集是同一角色的不同作品，合并记录可以看到场景、灯光与道具如何参与角色表达，避免将每一张照片拆成一次活动。
    - title: 5 月 29 日图集日期：Multi 的公园摄影
      before: 10 月
      body: |
        《MULTI GALLERY-9》以春日公园为主题，说明拍摄时天气良好、场地适合，并为装演者署名。[^multi-park] 这是一组户外角色摄影记录，能够证明作品内容与协作方式；图集没有提供可进一步核对的公开活动名称或实际拍摄日。
    - title: 10 月 20 日图集日期：绫香的场景再现
      body: |
        绫香图集在本年 10 月 20 日标注了多个照片条目，部分作品明确注明 CG 加工及相关署名。[^ayaka-gallery] 本年记录的是图集展示和影像加工方式，不再次登记为一项新制作。
    - title: 12 月 31 日图集日期：成濑川奈留的角色摄影
      body: |
        《NARU GALLERY-1》以《Love Hina》的成濑川奈留为对象，保留角色说明、装演署名与多组照片标题，日期统一标注为 12 月 31 日。[^naru] 这些条目可归为同一批角色作品资料，照片中的「日向庄」属于作品叙事，不应据此创建现实地点档案。
  sources: |
    [^serika]: SIGMA，《SERIKA GALLERY-1》，<https://www.buildupstudiosigma.com/archive/serika/serika00.htm>。
    [^serika-night]: SIGMA，《SERIKA GALLERY-2》，<https://www.buildupstudiosigma.com/archive/serika/serika10.htm>。
    [^multi-park]: SIGMA，《MULTI GALLERY-9》，<https://www.buildupstudiosigma.com/archive/multi/multi90.htm>。
    [^ayaka-gallery]: SIGMA，《AYAKA GALLERY-1》，2001-10-20 图集条目，<https://www.buildupstudiosigma.com/archive/ayaka/ayaka00.htm>。
    [^naru]: SIGMA，《NARU GALLERY-1》，<https://www.buildupstudiosigma.com/archive/naru/naru00.htm>。
  summary: 本年专题资料的重点是同一角色在不同场景中的呈现，以及装演、灯光、道具和影像加工之间的协作。照片条目按作品批次归并，既保留细节，也不把一组图集夸大为多次社群活动。
2002:
  intro: 2002 年已能确认新的角色制作、系列摄影与综合展会的实际结果。以下将制作方图集标注与主办方回顾分别归类，替换原先只有计划日程的单薄记录。
  highlights: |
    - **2 月**：明日香图集记载从原型重新制作，并标明服装协作来源。
    - **5–11 月**：前原忍与御剑凉子的角色图集。
    - **9 月**：东京电玩展实际举办记录及 134,042 人的整体来场统计。[^asuka][^shinobu][^ryoko][^tgs-history]
  drop: [同期资料, 专题站起点]
  events:
    - title: 2 月 23–25 日图集日期：明日香的新原型与服装协作
      before: 9 月
      body: |
        SIGMA 将明日香称为本年的第一件作品，说明从原型开始重新制作，并借用「綾波堂」こにししのぶ制作的驾驶服。图集保留 2 月 23 日、25 日的日期标注。[^asuka]

        该记录把面具原型与配套服装的制作分工写得较清楚，能够作为角色定制与协作实践的资料；原文没有将作品发布称为商业 IP 官方演出。
    - title: 5 月 8 日图集日期：前原忍制服摄影
      before: 9 月
      body: |
        《SHINOBU GALLERY-1》展示《Love Hina》前原忍的制服篇，并注明装演者及图集日期。[^shinobu] 这一组资料属于制作团队对角色系列的影像展示，不能由制服场景推定现实学校活动。
    - title: 9 月 20–22 日：主办方回顾确认实际举办结果
      body: |
        东京电玩展官方历史将本届列为第 12 届，主题为「遊びは人類のDNA。」，确认 9 月 20–22 日举行并记录 134,042 人来场。[^tgs-history] 这补齐了原先概要页仅能证明计划日程的缺口。统计对象是整届综合游戏展。
    - title: 11 月 4 日图集日期：御剑凉子的角色造型
      body: |
        《RYOKO GALLERY-1》以《Real Bout High School》的御剑凉子为对象，明确说明制作该角色并展示剑术相关的姿势与叙事。[^ryoko] 图集日期落在 11 月 4 日，适合归为当年角色作品的公开记录，而非另一个未经证实的漫展登场。
  sources: |
    [^asuka]: SIGMA，《ASUKA GALLERY-1》，<https://www.buildupstudiosigma.com/archive/asuka/asuka00.htm>。
    [^shinobu]: SIGMA，《SHINOBU GALLERY-1》，<https://www.buildupstudiosigma.com/archive/shinobu/shinobu00.htm>。
    [^ryoko]: SIGMA，《RYOKO GALLERY-1》，<https://www.buildupstudiosigma.com/archive/ryoko/ryoko00.htm>。
    [^tgs-history]: TGS / CESA，官方三十周年历史的 2002 年条目，<https://tgs.cesa.or.jp/2026/30th>。
  summary: 本年的直接专题材料包括新原型制作、服装协作和角色摄影。东京电玩展已经能够确认实际结果，但不将全场统计与这些作品档案拼接成 kigurumi 参展规模。
2003:
  intro: 2003 年同时留下角色制作图集与专题网络出版记录。制作方档案提供发型、服装和摄影细节；Inside Doll 则提供网站编辑与投稿活动的日期，两者分别整理。
  highlights: |
    - **1 月**：水原历角色图集。
    - **7 月**：爱泽友美与桃宫莓的角色展示。
    - **10 月**：风见瑞穗使用两只同型面具配合不同发型。
    - **网络出版**：Inside Doll 在 4 月已公开活跃，起始日有来源冲突。[^yomi][^tomomi][^ichigo][^mizuho]
  events:
    - title: 1 月 28 日图集日期：水原历的角色展示
      before: 4 月
      body: |
        SIGMA 的《YOMI GALLERY-1》记录《阿滋漫画大王》水原历的角色造型、装演署名及照片标题，图集标注 1 月 28 日。[^yomi] 它为本年提供了具体面具角色的作品记录，不能从漫画情节推断表演者的日常生活。
    - title: 7 月 13 日、26 日图集日期：爱泽友美与桃宫莓
      before: 7-12 月
      body: |
        爱泽友美图集说明采用《Pia Carrot 3》的角色与服装方案；桃宫莓图集则呈现《东京猫猫》的变身角色。两组作品分别标注 7 月 13 日与 26 日，并保留装演署名。[^tomomi][^ichigo]

        这两批资料反映了不同作品的面具、服装与标志性装饰如何组合为角色造型。它们作为作品记录合并概述，实际拍摄地点和参展经历不作推断。
    - title: 10 月 5 日图集日期：风见瑞穗的双发型方案
      body: |
        《MIZUHO GALLERY-1》明确说明，为表现《拜托了老师》的风见瑞穗，团队制作了两只相同面具，分别采用盘发与披发方案。[^mizuho] 这条说明比仅列角色名称更具体，记录了通过配套发型改变角色场景表现的实际方法。
  sources: |
    [^yomi]: SIGMA，《YOMI GALLERY-1》，<https://www.buildupstudiosigma.com/archive/yomi/yomi00.htm>。
    [^tomomi]: SIGMA，《TOMOMI GALLERY-1》，<https://www.buildupstudiosigma.com/archive/tomomi/tomomi00.htm>。
    [^ichigo]: SIGMA，《ICHIGO GALLERY-1》，<https://www.buildupstudiosigma.com/archive/ichigo/ichigo00.htm>。
    [^mizuho]: SIGMA，《MIZUHO GALLERY-1》，<https://www.buildupstudiosigma.com/archive/mizuho/mizuho00.htm>。
  summary: 本年可见的资料形式包括角色图集、制作说明、投稿与站务日志。面具实物及摄影记录与幻想作品分别归类，作品中的情节不当作现实纪事。Inside Doll 两处起始日不同，仍以“4 月已活跃”作为可确认的结论。
2004:
  intro: 2004 年将角色作品与公共活动规则放在同一年度观察：制作方图集涵盖动作摄影和男性角色，东京电玩展则保存了直接提到大型着ぐるみ的参与条款。
  highlights: |
    - **2 月**：春丽动作篇图集。
    - **4 月与 10 月**：国分寺小依、爱德华·艾尔利克作品展示。
    - **9 月**：东京电玩展的大型服装、更衣与摄影规则。[^chunli][^koyori][^edward]
  events:
    - title: 2 月 23 日图集日期：春丽动作摄影
      before: 9 月
      body: |
        SIGMA 将《CHUN-LI GALLERY-1》标为动作篇，并在 2 月 23 日条目中展示格斗姿势及相应取景。[^chunli] 本年的节点是动作图集的展示；页面不将该日期称为角色制作完成日。
    - title: 4 月 20 日图集日期：国分寺小依角色作品
      before: 9 月
      body: |
        《KOYORI GALLERY-1》以《护士小魔女》中的国分寺小依为对象，提供角色说明、装演署名与统一日期的图集条目。[^koyori] 它是本年可识别的动漫角色面具作品档案。
    - title: 10 月 23 日图集日期：爱德华·艾尔利克的男性角色造型
      body: |
        《EDWARD GALLERY-1》展示《钢之炼金术师》主人公爱德华·艾尔利克，图集标注 10 月 23 日。[^edward] 该来源直接记录了男性角色的着ぐるみ表现，说明本年的作品资料并不限于女性角色；角色性别不用于推断装演者身份。
  sources: |
    [^chunli]: SIGMA，《CHUN-LI GALLERY-1》，<https://www.buildupstudiosigma.com/archive/chun-li/chun-li00.htm>。
    [^koyori]: SIGMA，《KOYORI GALLERY-1》，<https://www.buildupstudiosigma.com/archive/koyori/koyori00.htm>。
    [^edward]: SIGMA，《EDWARD GALLERY-1》，<https://www.buildupstudiosigma.com/archive/edward/edward00.htm>。
  summary: 作品资料呈现出动作摄影与角色类型的多样性，公共展会资料则明确了大型服装和摄影的参与边界。两类资料各有来源，不以作品图集推定同年在东京电玩展登场。
2005:
  intro: 2005 年补入了成对角色制作与系列图集，并依据主办方历史补齐东京电玩展的实际举办结果。作品展示日期、制作月份和展会日期分别标注。
  highlights: |
    - **1–3 月**：琥珀、翡翠的成对制作与展示；《拜托了双子星》双角色图集。
    - **6 月**：希耶尔图集延展《月姬》角色系列。
    - **9 月**：东京电玩展完成记录为 176,056 人来场。
    - **12 月**：美滨千代图集。[^ciel][^kohaku][^twins][^chiyo][^tgs-history]
  drop: [官方计划窗口]
  events:
    - title: 1 月制作、3 月 5 日图集日期：琥珀与翡翠
      before: 5 月
      body: |
        SIGMA 的希耶尔图集序言明确回顾，琥珀与翡翠于本年 1 月制作；两人的独立图集标注 3 月 5 日，并说明分别采用和服与女仆服来表现两名角色。[^ciel][^kohaku]

        成对作品便于观察同一原作中不同服装、表情与角色关系的设计。这里把制作和随后展示合为一条作品纪事，不将两名角色或多张照片各算作一次活动。
    - title: 1 月 14 日图集日期：《拜托了双子星》双角色展示
      before: 5 月
      body: |
        《TWINS GALLERY-1》展示宫藤深衣奈与小野寺桦恋，并保留两名装演者署名。[^twins] 图集日期为 1 月 14 日，能够确认这一批作品资料在本年的记录位置；角色故事中的时间线不作为现实年表依据。
    - title: 6 月 23 日图集日期：希耶尔角色展示
      body: |
        SIGMA 以《CIEL GALLERY-1》展示《月姬》的希耶尔，图集标注 6 月 23 日。[^ciel] 这是一组独立角色作品，与琥珀、翡翠的成对图集共同组成当年该原作的制作展示资料。
    - title: 9 月 16–18 日：东京电玩展的实际举办结果
      body: |
        主办方官方历史确认第 15 届东京电玩展于 9 月 16–18 日举行，总来场为 176,056 人。[^tgs-history] 这属于实际结果，与 5 月新闻稿中 15 万人的目标值是不同统计字段。现有资料仍未单独统计 kigurumi 或 animegao 参与者。
    - title: 12 月 10 日图集日期：美滨千代角色展示
      body: |
        《CHIYO-CHAN GALLERY-1》保留《阿滋漫画大王》美滨千代的角色说明、装演署名与 12 月 10 日照片条目。[^chiyo] 本条登记为年底作品展示，不将造型所扮演的角色年龄用于推断表演者年龄。
  sources: |
    [^ciel]: SIGMA，《CIEL GALLERY-1》，<https://www.buildupstudiosigma.com/archive/ciel/ciel00.htm>。
    [^kohaku]: SIGMA，《KOHAKU & HISUI GALLERY-1》，<https://www.buildupstudiosigma.com/archive/kohakuhisui/kohakuhisui00.htm>。
    [^twins]: SIGMA，《TWINS GALLERY-1》，<https://www.buildupstudiosigma.com/archive/twins/twins00.htm>。
    [^chiyo]: SIGMA，《CHIYO-CHAN GALLERY-1》，<https://www.buildupstudiosigma.com/archive/chiyo/chiyo00.htm>。
    [^tgs-history]: TGS / CESA，官方三十周年历史的 2005 年条目，<https://tgs.cesa.or.jp/2026/30th>。
  summary: 本年作品档案能够呈现成对角色与同一原作系列的制作展示；主办方回顾也解决了展会完成结果的资料缺口。工房产量和 kigurumi 参展人数仍无可独立引用的统计。
2006:
  intro: 2006 年新增《圣母在上》双角色制作的日期线索，并记录东京电玩展本届规则和闭幕结果。制作月份来自制作方后续图集的明确回顾，不由作品动画播出年份反推。
  highlights: |
    - **3 月**：SIGMA 白蔷薇姐妹角色制作记录。
    - **9 月 22–24 日**：东京电玩展会期，整体来场 192,411 人。
    - **公共参与**：本届规则涉及大型服装、换装寄存和摄影许可。[^sigma-white][^sigma-red][^tgs-history]
  events:
    - title: 3 月：白蔷薇姐妹的成对角色制作
      before: 9 月
      body: |
        SIGMA《白薔薇姉妹》图集说明制作了藤堂志摩子与二条乃梨子；《紅薔薇姉妹》序言进一步明确将前一组作品记为 2006 年 3 月。[^sigma-white][^sigma-red]

        两个第一方页面相互补足角色名称与月份，能够建立本年的制作节点。红蔷薇姐妹自身没有在所见页面注明日期，因此本年仅记录白蔷薇这组作品。
    - title: 9 月 22–24 日：展会主题与闭幕统计
      body: |
        东京电玩展官方历史将本届列为第 16 届，主题为「新興奮。新感動。新時代。」，总来场人数为 192,411。[^tgs-history] 该数据用于说明本届公共场域的规模，不与 SIGMA 的作品制作或个别装演者挂接。
  sources: |
    [^sigma-white]: SIGMA，《白薔薇姉妹》，角色制作说明，<https://www.buildupstudiosigma.com/archive/r-giga/r-giga01.htm>。
    [^sigma-red]: SIGMA，《紅薔薇姉妹》，对 2006 年 3 月白蔷薇作品的回顾，<https://www.buildupstudiosigma.com/archive/r-chine/r-chine01.htm>。
    [^tgs-history]: TGS / CESA，官方历史的 2006 年条目，<https://tgs.cesa.or.jp/2026/30th>。
  summary: 本年新增一项可以交叉确认月份的成对角色制作记录。公共展会条款可说明参与条件，不能由此断定某件作品或某位装演者在现场出现。
2007:
  intro: 2007 年本卷集中记录东京电玩展的四日会期、公众开放流程和闭幕结果。目前本年直接指向 animegao 专门聚会或制作发布的可靠材料仍较少。
  highlights: |
    - **商务与公众分流**：9 月 20–21 日商务日，22–23 日公众日。
    - **四日会期**：本届整体来场为 193,040 人。
    - **参与条件**：公开规则将大体积服装、道具、寄存和摄影纳入同一流程。[^tgs-overview][^tgs-rules][^tgs-history]
  replace:
    "9 月 22-23 日：公开 cosplay 流程延续": "9 月 22–23 日：本届 cosplay 参与流程"
  events:
    - title: 9 月 20–23 日：四日会期的公共展会安排
      before: 9 月 23
      body: |
        本届主题为「つながって、ひろがって、世界へ。」，主办方概要将商务日与两个公众开放日分别列明，官方历史记录四日整体来场 193,040 人。[^tgs-overview][^tgs-history]

        查找当届公众 cosplay 资料时，应定位 22–23 日的访客规则，不能把商务日活动、展位工作人员或全场观众一并计作社群参与。
    - title: 当届规则：服装检查、寄存与摄影许可
      body: |
        主办方规则限制会妨碍周围人的大型着ぐるみ及超出尺寸要求的道具；指定更衣室收费 500 日元并含寄存，离开更衣室前要接受服装检查。摄影限于指定区域，拍摄和个人网站发表分别涉及被摄者同意。[^tgs-rules]

        这一条用于说明本届实际公开的参与条件，不把沿用条款命名为新制度。
  sources: |
    [^tgs-history]: TGS / CESA，官方历史的 2007 年条目，<https://tgs.cesa.or.jp/2026/30th>。
  summary: 本年可核对的特色是四日会期与商务、公众分流。规则页与闭幕公告可以相互补充，但尚不足以生成独立的 animegao 活动清单。
2008:
  intro: 2008 年可稳定引用的材料是东京电玩展主办方概要、会场档案及闭幕后报告。本卷将日期、逐日人数与资料入口整理在一起；专题制作和同好活动仍待补证。
  highlights: |
    - **10 月会期**：9–10 日为商务日，11–12 日为公众日。
    - **闭幕结果**：四日合计 194,288 人；两个公众日分别为 71,639 与 71,166 人。
    - **档案入口**：当年场地图、参展商与交通资料可供进一步定位。[^tgs-overview][^tgs-report][^tgs-map]
  drop: [公开访客档案]
  events:
    - title: 当届档案：会期、主题与人数应如何对应
      body: |
        本届为第 18 届，主题「さあ、行こう！GAMEの時間です。」。主办方保留概要、会场地图及 10 月 12 日的举办结果报告。[^tgs-history][^tgs-report] 两个公众日来场数与四日总数统计范围不同，应随同日期一起引用。

        查找照片或活动报道时，可用当年的会期和场地图确认记录位置。由于现存来源没有逐项识别 animegao 角色，不能单凭一张展位人物图片完成专题归类。
  sources: |
    [^tgs-history]: TGS / CESA，官方历史的 2008 年条目，<https://tgs.cesa.or.jp/2026/30th>。
  summary: 本卷补足的是本届资料的可查字段与统计口径。直接专题资料仍有限，不以相邻年份的作品、规则或聚会填充本年。
2009:
  intro: 2009 年的主要记录落在公共展会的入场安全与现场维护条件：行李检查、缝纫工具借用和更衣办理时限都有当届来源。
  highlights: |
    - **入场**：9 月 26–27 日公众开放日公布行李检查。
    - **现场维护**：可借用缝纫工具，更衣室办理须注意 16:00 时限。
    - **闭幕**：9 月 27 日发布结果；全展四日来场 185,030 人。[^tgs-rules][^tgs-report][^tgs-history]
  replace:
    "9 月 26-27 日：共同规则延续，新增现场缝纫工具与办理时限": "9 月 26–27 日：现场缝纫工具与更衣办理时限"
  events:
    - title: 本届参与资料：装备、应急修补与离场安排
      body: |
        本届主办方将携带物检查、服装限制、更衣服务与摄影要求放在访客注意事项中。对于需要携带头壳、假发和服装附件的参与者，入场检查与现场修补服务分别对应行李准备和装备临时维护两个环节。[^tgs-rules]

        官方历史确认本届会期为 9 月 24–27 日，主题「GAMEは、元気です。」，整体来场为 185,030 人。[^tgs-history] 这些字段可定位当年现场资料，但不能证明某项着ぐるみ制作课程或某类参与人数。
  sources: |
    [^tgs-history]: TGS / CESA，官方历史的 2009 年条目，<https://tgs.cesa.or.jp/2026/30th>。
  summary: 本年的具体资料价值在于把装备搬运、安全检查和临时修补放进同一参与流程。工具借用是展会服务，不能把它扩写成一次面具制作工作坊。
2010:
  intro: 2010 年新增秋叶原美少女着ぐるみ咖啡活动的同期报道。它与东京电玩展的舞会、摄影和早间更衣安排共同呈现了不同类型的公共参与场景。
  highlights: |
    - **2 月活动预告**：喫茶青风亭以手势、留言板和辅助人员组织服务。
    - **9 月综合展会**：TGS 推出成套 cosplay 企划。
    - **夜间安排**：Dance Night 配套延长更衣服务。[^cafe][^tgs-cosplay][^tgs-night]
  events:
    - title: 2 月 2 日报道、6 日预定活动：秋叶原「喫茶 青風亭」
      before: 9 月
      body: |
        《秋叶原经济新闻》2 月 2 日报道，美少女着ぐるみ咖啡活动计划于 2 月 6 日在秋叶原出租咖啡吧 DiCE! 举办，营业时间 10:00–16:00，预计以两小时为周期安排共 10 名角色登场。[^cafe]

        报道具体说明：角色以手势和留言板与来客沟通，场内辅助人员协助回答菜单、服务问题及给餐；同时提供双人拍立得等互动项目。这是本年直接涉及面具角色、非语言沟通与服务协作的资料。

        来源是活动前报道，因此本条标为**当年活动预告**，不把预定人数与项目写成已核实的最终执行结果。报道中店名有一处异写，本文依标题关联链接及主要正文采用「青風亭」。
  sources: |
    [^cafe]: アキバ経済新聞，2010-02-02，《秋葉原に「美少女着ぐるみカフェ」》，<https://akiba.keizai.biz/headline/1810/>。
  summary: 咖啡活动预告提供了手势、留言板与辅助人员配合的具体案例；TGS 的日间摄影、舞会和更衣安排则记录综合活动的服务延展。二者分别归为专门主题活动预告和公共展会记录。
2011:
  intro: 2011 年的记录集中在东京电玩展当届空间分配、公众摄影区域与整体举办结果。原先穿插的其他年度更衣室迁移说明已移除，本卷直接说明这一年的现场条件。
  highlights: |
    - **9 月 17–18 日**：公众开放日，更衣与寄存设在 2 号馆。
    - **摄影区域**：指定部分「やすらぎのモール」及事务局划定区域。
    - **整体规模**：9 月 15–18 日四日展会来场 222,668 人。[^tgs-rules][^tgs-history]
  replace:
    "9 月 17-18 日：大型着ぐるみ规则延续 2004 年边界": "9 月 17–18 日：大型服装与移动要求"
    "9 月 17-18 日：更衣与寄存从 2010 年的 7 号馆迁至 2 号馆": "9 月 17–18 日：2 号馆更衣与寄存安排"
  events:
    - title: 本届设施：2 号馆更衣服务与夜间活动入口
      body: |
        当年更衣与寄存设在 2 号馆；主办方另行开设 Cosplay Collection Night 活动页，以 cosplay 展示和舞会为节目形式。[^tgs-rules][^tgs-event] 该节目页未单独指认 animegao 表演，不将其列为专门 kigurumi 演出。

        官方历史确认本届主题「心が躍れば、それはGAMEです。」，会期 9 月 15–18 日，整体来场 222,668 人。[^tgs-history] 空间、节目和人数分别描述本届展会的不同层面。
  sources: |
    [^tgs-history]: TGS / CESA，官方历史的 2011 年条目，<https://tgs.cesa.or.jp/2026/30th>。
  summary: 本年资料可具体说明更衣、摄影和公开节目的空间关系。公共活动场域与专门社群的参与仍需分别核实，不能把全展规模写成 kigurumi 人数。
2012:
  intro: 2012 年保留东京电玩展当届更衣、海侧摄影区及影像使用要求，并补入场地与闭幕统计，形成可以直接查阅的年度参与资料。
  highlights: |
    - **更衣设施**：7 号馆南侧，更衣与寄存收费 500 日元。
    - **摄影空间**：指定室内区域与会场南侧临海室外区。
    - **传播限制**：拍照、视频及个人网站发布分别受规则约束。[^tgs-rules]
  events:
    - title: 本届会期与服务节点汇总
      body: |
        主办方概要区分 9 月 20–21 日商务日和 22–23 日公众日；官方历史记录四日整体来场 223,753 人。[^tgs-overview][^tgs-history]

        | 环节 | 当届公开安排 |
        | --- | --- |
        | 换装 | 7 号馆南侧指定更衣室，提供早间换装时段 |
        | 行李 | 500 日元服务包含寄存 |
        | 返场 | 注意 16:00 更衣室时限 |
        | 拍摄 | 指定室内与临海室外区；取得被摄者许可 |
        | 发布 | 个人网站发表亦须取得相关人员同意 |

        上表合并本届规则的服务信息，不能直接视为所有 cosplay 场地的通用规则。[^tgs-rules]
  sources: |
    [^tgs-history]: TGS / CESA，官方历史的 2012 年条目，<https://tgs.cesa.or.jp/2026/30th>。
  summary: 本年公开条款将换装、寄存、临海摄影区与影像发布放在同一参与流程。规则记录保留当届适用范围，不外推至私人摄影会或其他主办方活动。
2013:
  intro: 2013 年加入河妖开始制作 kigurumi 头壳的工房自述，并记录东京电玩展本届空间安排。制作实践与公共参与条件分别构成本年的两条资料线。
  highlights: |
    - **中文制作记录**：河妖官网明确自述自 2013 年开始制作头壳。
    - **9 月公众日**：TGS 更衣设在 9 号馆。
    - **场地治理**：大型服装、指定摄影区和图片发表同意有当届公开条款。[^heyao][^tgs-rules]
  events:
    - title: 年内：河妖开始制作 kigurumi 头壳
      before: 9 月
      body: |
        河妖工房官方网站的中英文品牌介绍均写明，创始人河妖自 2013 年开始制作 kigurumi 头壳。[^heyao] 这是一条直接指向中文制作实践的年份记录，来源性质为制作方后来的自述。

        本条只确认“开始制作”的年份。官网当前展示的型号、价格、团队服务及产能不能自动归入本年，也不能由个人制作起点推定公司注册日期。
  sources: |
    [^heyao]: HEYAOHEYAO 官网，品牌介绍「河妖工房创始人河妖自2013年开始制作kigurumi头壳」，访问于 2026-09-09，<https://heyaoheyao.com/>。
  summary: 本年新增的工房自述为中文头壳制作提供了可引用的时间起点。公共展会的空间规则另有当届来源，两者不合并为某场未经证实的参展经历。
2014:
  intro: 2014 年的材料从公共动漫展扩展到艺术摄影。Laurie Simmons 的作品档案明确以 Kigurumi、Dollers 为系列题目；AnimeJapan 则记录官方角色互动与公共摄影设施。
  highlights: |
    - **艺术摄影**：Laurie Simmons 的《Kigurumi, Dollers and How We See》标为 2014 年。
    - **3 月 22–23 日**：AnimeJapan Family Park 安排角色着ぐるみ互动。
    - **公共摄影**：室内布景、室外摄影区和服装租赁实际运行。[^simmons][^aj-report]
  events:
    - title: 年内作品：Laurie Simmons 的 Kigurumi / Dollers 摄影系列
      body: |
        艺术家官网将《Kigurumi, Dollers and How We See》归为 2014 年，并分别列出《Yellow Hair/Red Coat/Umbrella/Snow》《Orange Hair/Snow/Close Up》等照片，以及同名展示的现场视图。[^simmons]

        该系列将角色面貌、假发色彩、服装、身体姿态及室内外场景用于艺术摄影。它属于艺术家的作品与展示档案，不能当作爱好者聚会报道；同一系列的多张照片合并为一项年度作品记录。

        原图和展示视图可从艺术家官网查看。该站并未授予本站开放转载许可，因此本卷提供原始作品入口。
  sources: |
    [^simmons]: Laurie Simmons，官方作品档案《Kigurumi, Dollers and How We See》，2014，<https://www.lauriesimmons.net/artwork/kigurumi-dollers-and-how-we-see>。
  summary: 本年展示了两种不同的公开呈现：官方角色在动漫展面向观众互动，Kigurumi / Dollers 也成为艺术摄影题材。艺术系列、商业角色与普通 cosplay 场域分别记录，保留各自的来源和性质。
2015:
  intro: 2015 年补入香港定制工房与东京面具创作团队的成立记录。它们与 AnimeJapan 当年的摄影、更衣和移动规则共同构成本年的制作与活动资料。
  highlights: |
    - **香港制作**：Teitoku Workshop 官网明确自述于本年成立。
    - **秋季起点**：Hyokkame 从本年秋季开始在东京活动。
    - **3 月公共设施**：AnimeJapan 扩大更衣室与室外摄影区，记录移动协助条件。[^teitoku][^hyokkame][^aj-cosplay]
  events:
    - title: 年内：Teitoku Workshop 在香港成立
      before: 3 月
      body: |
        Teitoku Workshop 的官方英文介绍写明，它是一家于 2015 年成立、以香港为基地的全定制 kigurumi 面具工房。[^teitoku] 这为本年的制作服务提供了明确的第一方年份记录。

        本条只记录成立年份、所在地与业务类型。当前官网的价格、接单周期、材料说明及重量范围未标为本年数据，因此不将这些现行规格写成成立时的产品状况。
    - title: 秋季：Hyokkame 在东京开始面具创作活动
      body: |
        Mograg Gallery 的艺术家档案明确记载，Hyokkame 自 2015 年秋季起以东京为基地活动。介绍强调面具作为佩戴者自身表达的一部分，并关注面部各部件的选择如何形成角色身份。[^hyokkame]

        这是画廊对创作团队起点的回顾资料。它能够确认活动开始的年份与季节，不能据此推定本年已经举办个展或推出了后来展示的具体型号。
  sources: |
    [^teitoku]: Teitoku Workshop，官方 About 页面，<https://www.teitokuworkshop.com/en/about-us>。
    [^hyokkame]: Mograg Gallery，HYOKKAME 艺术家介绍，明确记载「2015年秋」起点，<https://www.mograg.com/artist2001.html>。
  summary: 本年的新增材料使制作史不再局限于展会规则：香港的定制服务与东京的面具创作各有可引用的起点。成立记录与当前营业、产品状态分别处理。
2016:
  intro: 2016 年重点整理 AnimeJapan 对遮面服装的区域要求、摄影设施和寄存服务。主办方闭幕后报告为这些安排的实际运行提供依据。
  highlights: |
    - **3 月 26–27 日**：公众开放日使用东京 Big Sight 东 1–6 Hall。
    - **临时室外区**：主办方报告确认这是本届的新设施。
    - **服务整合**：每日 1,000 日元登记包含更衣与寄存；早间更衣不开放寄存。[^aj-outline][^aj-cosplay][^aj-report]
  events:
    - title: 当届资料汇总：从早间换装到摄影区域
      body: |
        | 时间或区域 | 本届安排 |
        | --- | --- |
        | 7:00–9:00 | 早间更衣；此时不开放寄存 |
        | 10:00–17:00 | 常规更衣服务 |
        | 至 16:30 | 寄存服务 |
        | 指定 cosplay 区 | 视野受限的覆面、面具，以及行动困难的大型着ぐるみ的穿着范围 |
        | 临时室外区 | 闭幕后报告确认实际使用，午后聚集 cosplay 与摄影参与者 |

        服务时间来自当届规则，区域使用情况来自闭幕后报告。[^aj-cosplay][^aj-report] 两者结合能够说明头壳、服装与摄影装备进入公共场域时所依赖的设施，尚不能识别其中每一位 animegao 参与者。
  summary: 本年可核验的重点是临时室外区及整合后的更衣、寄存服务。专题工房发布和同好聚会资料仍有缺口，本卷不以全场人数或未注明身份的照片代替。
2017:
  intro: 2017 年除社群调查与公共场地资料外，还补入 FGO 二周年的着ぐるみ舞台、SIGMA 专题作品图库的公开公告。本年材料涵盖调查、官方角色展示和制作方出版。
  highlights: |
    - **7 月 29–30 日**：FGO Fes. 二周年在 10 号馆明列着ぐるみ舞台。
    - **10 月调查**：221 份回答中 220 份有效，属于社群便利样本。
    - **12 月 23 日**：SIGMA 公布 Twin Angel 专题图库。[^fgo-stage][^fgo-about][^census][^sigma-news]
  replace:
    "展会整体比 2016 年多使用一个 Hall。": "本届使用东 1–7 Hall。"
  events:
    - title: 7 月 29–30 日：FGO 二周年的独立着ぐるみ舞台
      before: 10 月
      body: |
        FGO Fes. 2017 官方概要列出幕张 Messe 9、10 号馆与 7 月 29–30 日会期。内容页在 10 号馆明确安排「着ぐるみステージ」，并提供登场时间表入口；9 号馆则另设官方 cosplayer 区域。[^fgo-about][^fgo-stage]

        这两种表演安排在官网中分开列示，因此本条可具体记录为官方角色着ぐるみ舞台，不能把真人 cosplayer 也计作面具角色。页面未提供可引用的独立着ぐるみ数量。
    - title: 12 月 23 日：SIGMA 公布 Twin Angel 专题图库
      body: |
        SIGMA 官方新闻在 12 月 23 日写明公开「ツインエンジェルギャラリー」，官网业务介绍同时列有相关角色着ぐるみ制作与操演实绩。[^sigma-news][^sigma-about]

        本年的确定节点是专题图库公开。实绩介绍没有逐项列出原始委托年份，因此不把图库中全部角色都写成本年首次制作。
  sources: |
    [^fgo-stage]: FGO Fes. 2017，官方内容页的「着ぐるみステージ」，<https://fes.fate-go.jp/2017/attraction/>。
    [^fgo-about]: FGO Fes. 2017，官方会期与场地，<https://fes.fate-go.jp/2017/about/>。
    [^sigma-news]: SIGMA 官方新闻，2017-12-23 条目，<https://www.buildupstudiosigma.com/>。
    [^sigma-about]: SIGMA，官方制作实绩介绍，<https://www.buildupstudiosigma.com/about/>。
  summary: 本年既有可量化但不能外推的社群调查，也有官方 IP 舞台与制作方图库公告。调查人数、活动角色数量和作品数量的统计对象各不相同，分别引用。
2018:
  intro: 2018 年新增 SIGMA 展会发布、量产决定与正式受注公告，补足制作产业线。年度资料同时包括公共巡游陪同要求和 animegao 面具制作匹配服务的学位研究。
  highlights: |
    - **2 月公告**：SIGMA 发布 Wonder Festival 冬季展位与新面具方案。
    - **8 月 1 日、11 月 30 日**：ゆるふわちゃん、あみこみちゃん分别进入量产公告和受注阶段。
    - **知识记录**：庆应机构库收录面具制作匹配服务的学位论文。[^sigma-wf][^sigma-news][^keio]
  events:
    - title: 2 月 12 日公告：SIGMA 的 Wonder Festival 冬季新作
      before: 3 月
      body: |
        SIGMA 在 2 月 12 日发布 WF2018 冬季出展信息，列出展位 4-14-01。页面介绍两种全新原创角色面具，角色设计由漫画家「あり」参与，注明从原型开始新造，并列出每种一体、125,000 日元含税的会场特别价格。[^sigma-news][^sigma-wf]

        这条资料同时保留设计协作、原型新造、展位与发布批次。报价属于本届公告，不作为持续售价；发布计划也不能证明每件商品均实际成交。
    - title: 8 月 1 日、11 月 30 日：原创面型的量产与受注公告
      before: 2018 学年度
      body: |
        SIGMA 官方新闻先在 8 月 1 日公布「ゆるふわちゃん＆あみこみちゃん量産化決定」，再于 11 月 30 日宣布开始受注。[^sigma-news]

        两条消息对应同一产品线的不同阶段，合并为一项年度进展：从量产决定推进到可提交订单。页面没有公开实际产量、交付人数或市场份额，不能据此扩写销售成果。
  sources: |
    [^sigma-wf]: SIGMA，WF2018 冬季出展与商品公告，<https://www.buildupstudiosigma.com/event/wf2018w/>。
    [^sigma-news]: SIGMA 官方新闻，2018-02-12、08-01、11-30 条目，<https://www.buildupstudiosigma.com/>。
  summary: 本年的制作资料能够串起设计协作、原型、展会发布、量产决定与受注启动；学位论文则把面具制作供需纳入服务设计研究。公开公告、实际交付与研究成效应分别判断。
2019:
  intro: 2019 年保留 FGO 的展位着ぐるみ安排，并补入 SIGMA 的创立二十周年公告。前者是本届官方角色活动，后者是制作团队当年的纪念与公开传播节点。
  highlights: |
    - **3 月 23–24 日**：FGO 在 AnimeJapan 东 6 Hall J73 安排着ぐるみ与官方 cosplayer。
    - **8 月 15 日**：SIGMA 公布创立二十周年消息。
    - **公共摄影**：Cosplayers World 继续提供当届参与场域。[^fgo-aj][^sigma-anniversary]
  events:
    - title: 8 月 15 日：SIGMA 创立二十周年公告
      body: |
        SIGMA 官方新闻以 2019 年 8 月 15 日为日期，公布「造型工房SIGMAは創立20周年を迎えました」，并链接相关官方社交消息。[^sigma-anniversary]

        本条记录当年的纪念公告，不重复登记一次工房成立。公告可以说明团队持续公开经营与维护品牌记录，但周年数字不是出货量或活跃用户统计。
  sources: |
    [^sigma-anniversary]: SIGMA 官方首页新闻，2019-08-15 创立二十周年公告，<https://www.buildupstudiosigma.com/>。
  summary: 本年资料一端连接大型 IP 的现场角色节目，一端连接制作工房的长期品牌记录。两类节点分别体现公开活动与制作组织的持续性。
2020:
  intro: 2020 年补入年初 Hyokkame 面具个展与专题对谈。此后 AnimeJapan 取消、WCS 转向线上，构成这一年从实体展示到远程参与的不同阶段。
  highlights: |
    - **1 月 11–26 日**：东京 Mograg Gallery 举办《KAWAII × KIGMASK》。
    - **1 月 17 日**：面具与佩戴者主题对谈。
    - **2 月取消、8 月线上**：FGO 原定展位互动随 AnimeJapan 取消；WCS 采用在线活动。[^hyokkame-show][^grape][^animejapan][^wcs2020]
  drop: [制作与手工]
  events:
    - title: 1 月 11–26 日：Hyokkame《KAWAII × KIGMASK》个展
      before: 1 月 27
      body: |
        Mograg Gallery 保存的展览页确认会期为 1 月 11–26 日，开放时间 13:00–20:00、周一休馆。画廊介绍将重点放在“佩戴面具的人存在于现场”的体验，而不仅是陈列一个物件。[^hyokkame-show]

        1 月 11 日的 grape Japan 报道进一步介绍可更换眼部、以魔术贴固定的可拆假发、可拆洗内衬，以及将眼部作品装框展示的安排。[^grape] 这些是当年报道中的设计与展陈说明，不能外推成所有面具品牌的结构。
    - title: 1 月 17 日：关于面具与佩戴者的对谈
      before: 1 月 27
      body: |
        同期企划安排 Hyokkame 与舞踏家、面具店经营者大川原脩平进行「マスクとその“中の人”考」对谈，画廊页写明 19:00–21:00、限 20 名、1,200 日元含一杯饮品。[^hyokkame-show]

        媒体稿对起始时间有不同写法，本卷采用主办画廊的 19:00。该条是公开节目安排；未取得逐字稿，不替参与者编写具体讨论结论。
  sources: |
    [^hyokkame-show]: Mograg Gallery，Hyokkame 个展与 2020-01-17 对谈，<https://www.mograg.com/artist2001.html>。
    [^grape]: grape Japan，2020-01-11，Hyokkame 个展报道，<https://grapee.jp/en/129757>。
  summary: 本年不只有活动取消：年初面具展留下了部件、可维护性和佩戴表达的记录；疫情期间的取消公告与远程活动则改变了公共交流形式。各阶段均依当年来源记录。
2021:
  intro: 2021 年以线上线下混合活动和两日酒店型 kigurumi 活动为重点。无日期的活动线索已移至来源目录，本卷只展示能够确认归属本年的记录。
  highlights: |
    - **5 月 22 日**：WCS 公布线上与现场并行的结构。
    - **8 月 7–8 日**：混合形式实施，官方手册随后公开。
    - **10 月 23–24 日**：第 18 回キグルミwasshoi! 的两日酒店活动。[^wcs2021][^jnto][^wasshoi18]
  events:
    - title: 第 18 回活动资料：空间与参与方式汇总
      body: |
        | 活动环节 | 主办方归档中的安排 |
        | --- | --- |
        | 换装与住宿 | 住宿套餐允许在客房换装后进入活动 |
        | 展示与交流 | 宴会厅、酒廊与舞台等分区 |
        | 摄影 | 教堂、泳池周边等场景；部分服务预约 |
        | 同人展示 | 着ぐるみ及被り物相关展示贩售 |
        | 餐饮 | 受当时聚餐限制影响，调整为软饮 |

        这些内容共同构成当届的酒店参与方案。[^wasshoi18] 原主办方域名在本轮复核时显示到期，以上依本站此前保存的来源整理保留；新一轮未能重读原文，不补写现场人数或执行结果。
  summary: 本年体现了两种具体组织方案：综合大会采用混合传播，专门活动将住宿、更衣、分区摄影和交流组合起来。日期未定的旧活动不再占据本年年表。
2022:
  intro: 2022 年记录线下专门活动、官方角色节目和制作教学资料。Doll Weekend 的影像发表日与活动日分别标注，避免以视频上线时间代替举办日期。
  highlights: |
    - **酒店交流**：第 19 回キグルミwasshoi!。
    - **新人入口**：着ぐFesta 首回与 Kigurumi Online 的本年入门面具设计。
    - **中国活动**：DW5–8 的主题、场地与展商参与资料。
    - **官方舞台**：FGO 周年线下活动与 WCS Stage Division。[^workshop]
  drop: [1—2 月]
  events:
    - title: 年内作品资料：Kigurumi Online 的入门面具设计
      body: |
        Kigurumi Online 的工作坊介绍明确将一幅往届设计示例标注为「previous 2022 design」。[^workshop] 因此本卷新增一项可以归入本年的教学用面具设计记录。

        页面能够证明存在一版与本年对应的入门面具设计，但没有在该段提供当届工作坊的准确日期、报名费用或实际参与人数。这里按设计资料收录，不直接套用当前工作坊安排。
  sources: |
    [^workshop]: Kigurumi Online，《Kigurumi Workshop》，明确标注 2022 设计示例，页面更新于 2025-04-25，<https://kig-o.com/index.php/kigurumi-workshop/>。
  summary: 本年的资料重点是线下活动组织、新人交流和教学设计。公开报名数、主办方规模说明、视频发表日与活动完成记录分别标示；对精确日期尚不足的 DW 资料保留原有时间界限。
2023:
  intro: 2023 年的重点是着ぐFesta 在一年内的不同活动形态、DW 舞台化与国际参与，以及官方角色在动漫展和玩具展的公开节目。连续活动按当届实际差异汇总。
  highlights: |
    - **着ぐFesta**：4 月试戴与交流、8 月常规回、11 月夜间场、12 月摄影讲习。
    - **DW10**：12 月佛山，主办方记录 400+ 参与规模与海外参加者。
    - **官方角色**：FGO 八周年及 hololive 东京玩具展 greeting。
    - **资料性质**：报名页人数不是最终到场统计，宣传发布时间不是举办日。
  drop: [夏季阶段]
  events:
    - title: 当年系列汇总：着ぐFesta 的四种参与场景
      body: |
        | 当届日期 | 资料中可见的重点 |
        | --- | --- |
        | 4 月 8 日 | 面具展示、试戴与制作者咨询；公开报名页显示 60 人 |
        | 8 月 26 日 | 新人交流与面具状态下难以口头表达的问题 |
        | 11 月 4–5 日 | 夜间 studio 场、预约与场地使用条件 |
        | 12 月 9 日 | 摄影讲习、dealer 参加及拍摄与接触规则 |

        四次活动属于同一系列，但时间、场地使用方式与服务各有差异。本表按当届资料合并比较，详细来源见上方对应纪事。<sup>[[S4]](#s4)</sup><sup>[[S17]](#s17)</sup><sup>[[S18]](#s18)</sup><sup>[[S19]](#s19)</sup>
  summary: 本年活动材料已经能够说明试戴、摄影、舞台与新人交流的不同需求。DW10 的国际参与记录、专门活动的具体服务与官方 greeting 分别形成年度主线。未能确定年份的 SP2 资料另列来源目录，暂不计入本年。
2024:
  intro: 2024 年围绕新专门活动、工坊面具版本、舞台影像与社群写作展开。本次进一步展开 Advent Calendar 中有日期的运输、摄影与交流文章，让年度知识记录能够直接追到原文。
  highlights: |
    - **新活动**：东京きぐるみパーティ、北九州着ぐるみ大行進、川崎 kig_Doll。
    - **制作教学**：Kigurumi Online 在 Anime North 发布新的入门面具设计。
    - **中文舞台**：DW11 在佛山记录才艺与专业影像。
    - **12 月写作**：运输、视频摄影、跨语言交流与问卷资料集中发布。[^calendar]
