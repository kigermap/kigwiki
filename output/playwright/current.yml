                        - text: 头同一经营主体下的角色定制与量产头壳品牌，提供 PHT 系列和一对一角色定制。 地区中国大陆 类型量产成品 / 全定制 价格CNY 998 起（量产） 公开销售
                      - listitem [ref=f15e66]: 河妖工房 HEYAOHEYAO提供角色头壳定制及命名型号现货，官网自述从 2013 年开始制作头壳。 地区中国大陆 类型现货成品 / 全定制 价格USD 1180 起（所录现货） 公开销售
                      - listitem [ref=f15e67]: 不还原人形 BHY提供动漫角色全定制，官网公开约 150 个自然日工期及分阶段付款流程。 地区中国大陆 类型全定制 价格整头询价；USD 400 起订金 接受询价
                      - listitem [ref=f15e68]: 玄猫物語 BlackCatKig上海的动漫人脸头壳工作室，提供 SLA 树脂打印、角色定制、现货与订单查询。 地区中国大陆 类型现货成品 / 全定制 价格USD 835（定制入口标价） 公开销售
                      - listitem [ref=f15e69]: HiDolls / Dreammask StudioDreammask 旗下的头壳产品线，提供 YumeFace 人脸模块化头壳与动漫角色定制。 地区中国大陆 类型量产成品 / 全定制 价格USD 1045.80（HD-T1 活动价） 公开销售
                      - listitem [ref=f15e70]: 暂无图标偶域 Kig.Land提供角色定制、现货、半成品、假发与道具，主站公开 M.A.G.I.C 头壳产品线。 地区中国大陆 类型现货成品 / 全定制 价格官网未公开具体型号价格 接受询价
                      - listitem [ref=f15e71]: 豪華王 GKO提供 GPM 系列半定制头壳、FRP DIY 素体与成品，公开分项价格。 地区中国台湾 类型半定制 / 素体 价格USD 300 素体 / USD 960 本体 公开销售
                      - listitem [ref=f15e72]: 暂无图标造型工房 SIGMA1999 年成立的人型着ぐるみ造型团队，提供 ENA 等原创面型和角色定制。 地区日本 类型半定制 / 全定制 价格JPY 104500 起（ENA） 接受询价
                      - listitem [ref=f15e73]: むにむに製作所 MuniMuni提供 PVC 与 FRP 人脸面具、化妆套装和 DIY 零件，产品线覆盖 KAWAII、IDOL 等系列。 地区日本 类型量产成品 / 素体 价格JPY 19800（所录套装） 公开销售
                      - listitem [ref=f15e74]: DAME Kigurumi英国制作的可配置 animegao 头壳，Gen 3 支持可拆假发、可换眼片和全头后壳选配。 地区英国 类型半定制 / 素体 价格GBP 605 起（Ami Gen 3） 公开销售
                      - listitem [ref=f15e75]: 提督工房 Teitoku Workshop2015 年成立于香港的全定制工房，以周期申请方式承接头壳制作。 地区中国香港 类型全定制 / 修复 价格HKD 10000 起 周期抽选
                      - listitem [ref=f15e76]: 暂无图标THE KAGA提供 FRP 角色头壳定制，官网 FAQ 公开起价、工期与配送费用。 地区中国香港 类型全定制 价格USD 800 起 接受询价
                      - listitem [ref=f15e77]: KigCos / Wyu提供多款可配置人脸头壳，部分型号可增加机械眨眼和可替换假发。 地区澳大利亚 / 新加坡 类型半定制 / 配件 价格USD 860 起（所录整头） 接受询价
                      - listitem [ref=f15e78]: MidDreamKigu（原 KigLover）官网已从 KigLover 更名为 MidDreamKigu，提供 animegao 角色头壳定制咨询。 地区地区待核实 类型全定制 价格整头询价；订金单列 接受询价
                      - listitem [ref=f15e79]: Kigurumi Sensei居住美国的日本制作者，提供原创素体与 MuniMuni 素体改妆；当前暂停定制。 地区美国 类型全定制 / 半定制 价格USD 580 起（暂停定制） 暂停定制
                      - listitem [ref=f15e80]: 冉月剧团 Umoon现有编年资料关联的头壳制作者，近期成品记录已核实，营业与接单条件待补。 地区中国大陆 类型全定制 价格未公开可核实报价 接单待核实
