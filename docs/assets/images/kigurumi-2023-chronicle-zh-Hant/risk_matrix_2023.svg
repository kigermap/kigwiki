<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7f9"/>
      <stop offset="55%" stop-color="#f5fbff"/>
      <stop offset="100%" stop-color="#f8fff5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.14"/>
    </filter>
    <style>
      .title { font-family: 'Noto Sans CJK TC','Microsoft JhengHei',Arial,sans-serif; font-size: 34px; font-weight: 800; fill: #263238; }
      .sub { font-family: 'Noto Sans CJK TC','Microsoft JhengHei',Arial,sans-serif; font-size: 18px; fill: #52616b; }
      .label { font-family: 'Noto Sans CJK TC','Microsoft JhengHei',Arial,sans-serif; font-size: 18px; font-weight: 700; fill: #263238; }
      .small { font-family: 'Noto Sans CJK TC','Microsoft JhengHei',Arial,sans-serif; font-size: 14px; fill: #455a64; }
      .tiny { font-family: 'Noto Sans CJK TC','Microsoft JhengHei',Arial,sans-serif; font-size: 12px; fill: #607d8b; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <text x="56" y="62" class="title">2023 年風險治理矩陣</text>
  <text x="56" y="94" class="sub">這一年最值得記錄的負面內容不是八卦，而是規則如何開始寫清楚。</text>
  <rect x="70" y="145" width="495" height="118" rx="22" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="70" y="145" width="16" height="118" rx="8" fill="#ef9a9a"/>
  <text x="104" y="180" class="label">熱中症 / 脫水</text>
  <text x="104" y="209" class="small">WCS2023 提醒酷暑、補水、休息；規則中已提到可能造成脫水的著ぐるみ。</text>
  <text x="104" y="233" class="small"></text>
  <text x="510" y="245" class="tiny" text-anchor="end">戶外大型活動</text>
  <rect x="610" y="145" width="495" height="118" rx="22" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="610" y="145" width="16" height="118" rx="8" fill="#ffcc80"/>
  <text x="644" y="180" class="label">未經同意拍攝</text>
  <text x="644" y="209" class="small">著ぐFesta 將“橫撮り”直接定義為應避免的行為，強調先取得被攝者同意。</text>
  <text x="644" y="233" class="small"></text>
  <text x="1050" y="245" class="tiny" text-anchor="end">攝影邊界</text>
  <rect x="70" y="300" width="495" height="118" rx="22" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="70" y="300" width="16" height="118" rx="8" fill="#ffe082"/>
  <text x="104" y="335" class="label">身體接觸</text>
  <text x="104" y="364" class="small">著ぐFesta 禁止擁抱，理由是面具狀態下不易說話、難以拒絕。</text>
  <text x="104" y="388" class="small"></text>
  <text x="510" y="400" class="tiny" text-anchor="end">同意表達</text>
  <rect x="610" y="300" width="495" height="118" rx="22" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="610" y="300" width="16" height="118" rx="8" fill="#80cbc4"/>
  <text x="644" y="335" class="label">摘面與身份邊界</text>
  <text x="644" y="364" class="small">除更衣室、cloak 等區域外不得摘面，避免破壞隱私與角色邊界。</text>
  <text x="644" y="388" class="small"></text>
  <text x="1050" y="400" class="tiny" text-anchor="end">空間管理</text>
  <rect x="70" y="455" width="495" height="118" rx="22" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="70" y="455" width="16" height="118" rx="8" fill="#90caf9"/>
  <text x="104" y="490" class="label">水域與特殊場景</text>
  <text x="104" y="519" class="small">DW SP2 的泳池主題提示水域拍攝需要更高安全意識；本篇不推斷具體事故。</text>
  <text x="104" y="543" class="small"></text>
  <text x="510" y="555" class="tiny" text-anchor="end">主題活動風險</text>
  <rect x="610" y="455" width="495" height="118" rx="22" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="610" y="455" width="16" height="118" rx="8" fill="#ce93d8"/>
  <text x="644" y="490" class="label">夜間通宵</text>
  <text x="644" y="519" class="small">Night 線帶來避開白天人流的好處，也帶來疲勞、交通和後半夜注意力下降。</text>
  <text x="644" y="543" class="small"></text>
  <text x="1050" y="555" class="tiny" text-anchor="end">體力管理</text>
</svg>
