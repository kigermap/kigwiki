  <text x="76" y="572" class="small">Советы по чтению: DW9, SP1 и другие подсказки социальных сетей используются только для позиционирования во времени; масштаб и характер должны быть основаны на официальном сайте Doll Weekend, официальной информации TwiPla, FGO/WCS/Aniplex.</text>
