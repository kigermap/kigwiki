<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7f9"/>
      <stop offset="55%" stop-color="#f5fbff"/>
      <stop offset="100%" stop-color="#f8fff5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.14"/>
    </filter>
    <style>
      .title { font-family: 'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif; font-size: 34px; font-weight: 800; fill: #263238; }
      .sub { font-family: 'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif; font-size: 18px; fill: #52616b; }
      .label { font-family: 'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif; font-size: 18px; font-weight: 700; fill: #263238; }
      .small { font-family: 'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif; font-size: 14px; fill: #455a64; }
      .tiny { font-family: 'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif; font-size: 12px; fill: #607d8b; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <text x="56" y="62" class="title">日本线下活动节奏：着ぐFesta 的规则化轨迹</text>
  <text x="56" y="94" class="sub">2023 年公开资料显示，着ぐFesta 从“先办起来”逐步走向摄影、社交与身体边界规则。</text>
  <rect x="90" y="170" width="220" height="310" rx="28" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="200" cy="170" r="34" fill="#ffab91" stroke="#fff" stroke-width="5"/>
  <text x="200" y="180" text-anchor="middle" class="label">1</text>
  <text x="200" y="230" text-anchor="middle" class="label" font-size="17">4月8日 常规回</text>
  <text x="118" y="280" class="small"><tspan x="118" dy="0">• 300人大厅</tspan><tspan x="118" dy="30">• 面具展示与试戴</tspan><tspan x="118" dy="30">• 公开参与者 60 人</tspan></text>
<path d="M310,320 L360,320" stroke="#90a4ae" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="360" y="170" width="220" height="310" rx="28" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="470" cy="170" r="34" fill="#80cbc4" stroke="#fff" stroke-width="5"/>
  <text x="470" y="180" text-anchor="middle" class="label">2</text>
  <text x="470" y="230" text-anchor="middle" class="label" font-size="17">8月26日 3rd</text>
  <text x="388" y="280" class="small"><tspan x="388" dy="0">• 新人友好叙事</tspan><tspan x="388" dy="30">• dealer / 免费衣物</tspan><tspan x="388" dy="30">• 背景布升级</tspan></text>
<path d="M580,320 L630,320" stroke="#90a4ae" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="630" y="170" width="220" height="310" rx="28" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="740" cy="170" r="34" fill="#ce93d8" stroke="#fff" stroke-width="5"/>
  <text x="740" y="180" text-anchor="middle" class="label">3</text>
  <text x="740" y="230" text-anchor="middle" class="label" font-size="17">11月4日 Night</text>
  <text x="658" y="280" class="small"><tspan x="658" dy="0">• 完全预约制</tspan><tspan x="658" dy="30">• 21:30–7:30</tspan><tspan x="658" dy="30">• studio 通宵摄影</tspan></text>
<path d="M850,320 L900,320" stroke="#90a4ae" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="900" y="170" width="220" height="310" rx="28" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="1010" cy="170" r="34" fill="#ffe082" stroke="#fff" stroke-width="5"/>
  <text x="1010" y="180" text-anchor="middle" class="label">4</text>
  <text x="1010" y="230" text-anchor="middle" class="label" font-size="17">12月9日 4th</text>
  <text x="928" y="280" class="small"><tspan x="928" dy="0">• 横撮り禁止</tspan><tspan x="928" dy="30">• 拥抱禁止</tspan><tspan x="928" dy="30">• 摄影讲习与 dealer</tspan></text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#90a4ae"/></marker></defs>
  <rect x="80" y="535" width="1040" height="70" rx="22" fill="#e8f5e9"/>
  <text x="105" y="566" class="small">关键变化：2023 年的规则不是抽象口号，而是直接回应面具状态下“难以说话、难以拒绝、容易被侧拍、摘面会破坏边界”的具体问题。</text>
  <text x="105" y="592" class="tiny">这条线是 2024 年 5th/6th 与 Night2nd 的前置，不重复 2024 后续活动。</text>
</svg>
