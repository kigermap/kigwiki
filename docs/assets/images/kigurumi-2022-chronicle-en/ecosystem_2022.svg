<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
<title id="title">2022 Kigurumi ecosystem</title>
<desc id="desc">Four distinct but related forms of kigurumi activity documented in 2022.</desc>
<style>
  .bg { fill: #fffaf3; }
  .title { font: 700 34px Arial,sans-serif; fill: #2b2118; }
  .subtitle { font: 400 17px Arial,sans-serif; fill: #64564a; }
  .label { font: 700 18px Arial,sans-serif; fill: #2b2118; }
  .small { font: 400 14px Arial,sans-serif; fill: #4c4037; }
  .card { fill: #ffffff; stroke: #d8c4aa; stroke-width: 2; rx: 16; }
  .soft { fill: #f3e1c8; stroke: #cba982; stroke-width: 2; rx: 16; }
  .line { stroke: #b48a60; stroke-width: 4; stroke-linecap: round; }
</style>
<rect class="bg" width="100%" height="100%"/>
<text x="50" y="60" class="title">2022 Kigurumi ecosystem</text>
<text x="50" y="92" class="subtitle">Official, specialist, Chinese-language, and public-event records followed different paths</text>
<rect x="70" y="135" width="250" height="110" class="soft"/><text x="95" y="175" class="label">Official IP greetings</text><text x="95" y="205" class="small">FGO at AnimeJapan</text><text x="95" y="227" class="small">FGO Fes. physical return</text>
<rect x="345" y="135" width="250" height="110" class="card"/><text x="370" y="175" class="label">Specialist events</text><text x="370" y="205" class="small">19th KigWasshoi!</text><text x="370" y="227" class="small">First KiguFesta</text>
<rect x="620" y="135" width="250" height="110" class="soft"/><text x="645" y="175" class="label">Doll Weekend</text><text x="645" y="205" class="small">DW5 through DW8</text><text x="645" y="227" class="small">Themes, exhibitors, reunion</text>
<rect x="895" y="135" width="250" height="110" class="card"/><text x="920" y="175" class="label">Public-event rules</text><text x="920" y="205" class="small">World Cosplay Summit</text><text x="920" y="227" class="small">Space, heat, COVID, consent</text>
<line x1="195" y1="245" x2="195" y2="330" class="line"/><line x1="470" y1="245" x2="470" y2="330" class="line"/><line x1="745" y1="245" x2="745" y2="330" class="line"/><line x1="1020" y1="245" x2="1020" y2="330" class="line"/>
<rect x="125" y="330" width="950" height="150" class="card"/>
<text x="160" y="372" class="label">Shared operational questions</text>
<text x="160" y="405" class="small">Identity checks behind full-face presentation; non-verbal consent; overheating and dehydration; permission to</text>
<text x="160" y="430" class="small">photograph and publish; ordinary visitors; transport and changing routes; and overlapping terminology.</text>
</svg>
