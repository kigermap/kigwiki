<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">Three models of Japanese offline events in 2022</title>
<desc id="desc">A comparison of a specialist hotel event, a low-barrier studio event, and a public convention.</desc>
<style>
  .bg { fill: #fffaf3; }
  .title { font: 700 34px Arial,sans-serif; fill: #2b2118; }
  .subtitle { font: 400 17px Arial,sans-serif; fill: #64564a; }
  .label { font: 700 18px Arial,sans-serif; fill: #2b2118; }
  .small { font: 400 14px Arial,sans-serif; fill: #4c4037; }
  .tiny { font: 700 12px Arial,sans-serif; fill: #6a5a4c; }
  .card { fill: #ffffff; stroke: #d8c4aa; stroke-width: 2; rx: 16; }
  .soft { fill: #f3e1c8; stroke: #cba982; stroke-width: 2; rx: 16; }
</style>
<rect class="bg" width="100%" height="100%"/>
<text x="50" y="60" class="title">Three models of Japanese offline events</text>
<text x="50" y="92" class="subtitle">Specialist production, newcomer access, and public-event governance coexisted in 2022</text>
<rect x="70" y="145" width="330" height="280" class="card"/>
<text x="105" y="190" class="label">19th KigWasshoi!</text>
<text x="105" y="225" class="small">Hotel, hall, pool, and chapel</text>
<text x="105" y="250" class="small">Stage, dealers, photo services</text>
<text x="105" y="275" class="small">Contact and photo passes</text>
<text x="105" y="300" class="small">Lodging and night settings</text>
<text x="105" y="335" class="tiny">MODEL: SPECIALIST PRODUCTION</text>
<rect x="435" y="145" width="330" height="280" class="soft"/>
<text x="470" y="190" class="label">First KiguFesta</text>
<text x="470" y="225" class="small">Small Arakawa venue</text>
<text x="470" y="250" class="small">24 public participants</text>
<text x="470" y="275" class="small">Two backdrops; free interaction</text>
<text x="470" y="300" class="small">Run first, then gather feedback</text>
<text x="470" y="335" class="tiny">MODEL: NEWCOMER ACCESS</text>
<rect x="800" y="145" width="330" height="280" class="card"/>
<text x="835" y="190" class="label">WCS 2022</text>
<text x="835" y="225" class="small">20th anniversary; stage return</text>
<text x="835" y="250" class="small">Shared space with visitors</text>
<text x="835" y="275" class="small">Heat, COVID, and photo consent</text>
<text x="835" y="300" class="small">Staff could stop risky clothing</text>
<text x="835" y="335" class="tiny">MODEL: PUBLIC GOVERNANCE</text>
</svg>
