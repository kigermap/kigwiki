<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc">
<title id="title">De-duplicating the 2022 through 2025 record</title>
<desc id="desc">A diagram showing the distinct annual focus retained for each year from 2022 to 2025.</desc>
<style>
  .bg { fill: #fffaf3; }
  .title { font: 700 34px Arial,sans-serif; fill: #2b2118; }
  .subtitle { font: 400 17px Arial,sans-serif; fill: #64564a; }
  .label { font: 700 18px Arial,sans-serif; fill: #2b2118; }
  .small { font: 400 14px Arial,sans-serif; fill: #4c4037; }
  .tiny { font: 400 12px Arial,sans-serif; fill: #6a5a4c; }
  .card { fill: #ffffff; stroke: #d8c4aa; stroke-width: 2; rx: 16; }
  .soft { fill: #f3e1c8; stroke: #cba982; stroke-width: 2; rx: 16; }
  .line { stroke: #b48a60; stroke-width: 4; stroke-linecap: round; }
</style>
<rect class="bg" width="100%" height="100%"/>
<text x="50" y="60" class="title">A de-duplicated 2022 to 2025 record</text>
<text x="50" y="92" class="subtitle">The 2022 volume keeps early states instead of repeating mature forms documented later</text>
<rect x="70" y="145" width="250" height="180" class="soft"/><text x="100" y="190" class="label">2022</text><text x="100" y="225" class="small">Offline reconnection</text><text x="100" y="250" class="small">COVID and heat rules</text><text x="100" y="275" class="small">DW5 through DW8</text>
<rect x="345" y="145" width="250" height="180" class="card"/><text x="375" y="190" class="label">2023</text><text x="375" y="225" class="small">Multiple KiguFesta events</text><text x="375" y="250" class="small">DW9 and DW10</text><text x="375" y="275" class="small">Pre-international growth</text>
<rect x="620" y="145" width="250" height="180" class="soft"/><text x="650" y="190" class="label">2024</text><text x="650" y="225" class="small">Knowledge production</text><text x="650" y="250" class="small">Doll Weekend 11</text><text x="650" y="275" class="small">Further rule detail</text>
<rect x="895" y="145" width="250" height="180" class="card"/><text x="925" y="190" class="label">2025</text><text x="925" y="225" class="small">Doll Weekend 12 scale</text><text x="925" y="250" class="small">Full-face recognition</text><text x="925" y="275" class="small">Cross-border pressure</text>
<line x1="320" y1="235" x2="345" y2="235" class="line"/><line x1="595" y1="235" x2="620" y2="235" class="line"/><line x1="870" y1="235" x2="895" y2="235" class="line"/>
<text x="105" y="390" class="small">Editorial rule: retain each series' 2022 form, rules, and scale; leave later mature versions to their own annual volumes.</text>
</svg>
