<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img">

<style>
  .bg { fill: #fffaf3; }
  .title { font: 700 34px 'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif; fill: #2b2118; }
  .subtitle { font: 400 17px 'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif; fill: #64564a; }
  .label { font: 700 18px 'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif; fill: #2b2118; }
  .small { font: 400 14px 'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif; fill: #4c4037; }
  .tiny { font: 400 12px 'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif; fill: #6a5a4c; }
  .card { fill: #ffffff; stroke: #d8c4aa; stroke-width: 2; rx: 16; }
  .soft { fill: #f3e1c8; stroke: #cba982; stroke-width: 2; rx: 16; }
  .accent { fill: #c66b43; }
  .accent2 { fill: #5a8a8a; }
  .accent3 { fill: #7a5c9b; }
  .line { stroke: #b48a60; stroke-width: 4; stroke-linecap: round; }
</style>

<rect class="bg" width="100%" height="100%"/>

<text x="50" y="60" class="title">2022 → 2025 的非重复关系</text>
<text x="50" y="92" class="subtitle">本篇只写 2022 的前置状态，不重复后续年份已详写的成熟版本</text>
<rect x="70" y="145" width="250" height="180" class="soft"/><text x="100" y="190" class="label">2022</text><text x="100" y="225" class="small">线下重启</text><text x="100" y="250" class="small">COVID/热中症规则</text><text x="100" y="275" class="small">DW5—DW8</text>
<rect x="345" y="145" width="250" height="180" class="card"/><text x="375" y="190" class="label">2023</text><text x="375" y="225" class="small">着ぐFesta 多回</text><text x="375" y="250" class="small">DW9—DW10</text><text x="375" y="275" class="small">国际化前夜</text>
<rect x="620" y="145" width="250" height="180" class="soft"/><text x="650" y="190" class="label">2024</text><text x="650" y="225" class="small">知识生产</text><text x="650" y="250" class="small">DW11</text><text x="650" y="275" class="small">规则继续细化</text>
<rect x="895" y="145" width="250" height="180" class="card"/><text x="925" y="190" class="label">2025</text><text x="925" y="225" class="small">DW12 千人级</text><text x="925" y="250" class="small">WCS 遮面承认</text><text x="925" y="275" class="small">跨境产业压力</text>
<line x1="320" y1="235" x2="345" y2="235" class="line"/><line x1="595" y1="235" x2="620" y2="235" class="line"/><line x1="870" y1="235" x2="895" y2="235" class="line"/>
<text x="105" y="390" class="small">写法原则：同一系列若后续年份更成熟，本篇不重复成熟版，只保留 2022 年的原始形态、当年规则和当年规模。</text>

</svg>