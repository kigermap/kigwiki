<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img">

<style>
  .bg { fill: #fffaf3; }
  .title { font: 700 34px 'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif; fill: #2b2118; }
  .subtitle { font: 400 17px 'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif; fill: #64564a; }
  .label { font: 700 18px 'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif; fill: #2b2118; }
  .small { font: 400 14px 'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif; fill: #4c4037; }
  .tiny { font: 400 12px 'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif; fill: #6a5a4c; }
  .card { fill: #ffffff; stroke: #d8c4aa; stroke-width: 2; rx: 16; }
  .soft { fill: #f3e1c8; stroke: #cba982; stroke-width: 2; rx: 16; }
  .accent { fill: #c66b43; }
  .accent2 { fill: #5a8a8a; }
  .accent3 { fill: #7a5c9b; }
  .line { stroke: #b48a60; stroke-width: 4; stroke-linecap: round; }
</style>

<rect class="bg" width="100%" height="100%"/>

<text x="50" y="60" class="title">2022 年 Kigurumi 编年史时间轴</text>
<text x="50" y="92" class="subtitle">疫情后线下重启、官方 IP 回归、中文娃圈早期扩展与规则化起点</text>
<line x1="80" y1="210" x2="1120" y2="210" class="line"/>
<circle cx="170" cy="210" r="14" class="accent"/><text x="130" y="250" class="label">3月</text><text x="95" y="276" class="small">FGO × AnimeJapan</text><text x="94" y="296" class="tiny">greeting stage 计划</text>
<circle cx="320" cy="210" r="14" class="accent2"/><text x="280" y="170" class="label">4月</text><text x="235" y="145" class="small">第19回キグルミwasshoi!</text><text x="252" y="125" class="tiny">酒店・泳池・舞台・dealer</text>
<circle cx="470" cy="210" r="14" class="accent3"/><text x="430" y="250" class="label">6月</text><text x="383" y="276" class="small">Doll Weekend 5</text><text x="382" y="296" class="tiny">黑白女仆派对 / 首次主题</text>
<circle cx="610" cy="210" r="14" class="accent3"/><text x="570" y="170" class="label">7月</text><text x="530" y="145" class="small">DW6 + FGO Fes.</text><text x="508" y="125" class="tiny">海边度假 / 线下周年回归</text>
<circle cx="765" cy="210" r="14" class="accent2"/><text x="725" y="250" class="label">8月</text><text x="660" y="276" class="small">WCS2022 + 着ぐFesta 首回</text><text x="660" y="296" class="tiny">公共规则 / 热中症 / 低门槛交流</text>
<circle cx="935" cy="210" r="14" class="accent3"/><text x="895" y="170" class="label">下半年</text><text x="858" y="145" class="small">Doll Weekend 7</text><text x="822" y="125" class="tiny">首批展商加入 / 150+ 参与者</text>
<circle cx="1085" cy="210" r="14" class="accent3"/><text x="1045" y="250" class="label">年末</text><text x="1010" y="276" class="small">Doll Weekend 8</text><text x="1000" y="296" class="tiny">疫后重逢 / 海边与烟花</text>
<rect x="62" y="350" width="1076" height="150" class="card"/>
<text x="95" y="392" class="label">年度定位</text>
<text x="95" y="425" class="small">2022 不是规模最大的年份，而是“线下重新接上”的年份：活动主办方重新学习如何管理口罩、体温、补水、摄影同意、触碰边界、</text>
<text x="95" y="450" class="small">更衣动线与公共空间。它为 2023—2025 的活动扩张、规则细化和产业化提供了底层经验。</text>

</svg>