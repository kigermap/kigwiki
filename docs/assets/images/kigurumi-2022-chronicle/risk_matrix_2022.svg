<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img">

<style>
  .bg { fill: #fffaf3; }
  .title { font: 700 34px 'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif; fill: #2b2118; }
  .subtitle { font: 400 17px 'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif; fill: #64564a; }
  .label { font: 700 18px 'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif; fill: #2b2118; }
  .small { font: 400 14px 'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif; fill: #4c4037; }
  .tiny { font: 400 12px 'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif; fill: #6a5a4c; }
  .card { fill: #ffffff; stroke: #d8c4aa; stroke-width: 2; rx: 16; }
  .soft { fill: #f3e1c8; stroke: #cba982; stroke-width: 2; rx: 16; }
  .accent { fill: #c66b43; }
  .accent2 { fill: #5a8a8a; }
  .accent3 { fill: #7a5c9b; }
  .line { stroke: #b48a60; stroke-width: 4; stroke-linecap: round; }
</style>

<rect class="bg" width="100%" height="100%"/>

<text x="50" y="60" class="title">2022 年风险治理矩阵</text>
<text x="50" y="92" class="subtitle">这一年最重要的“负面史”不是某个丑闻，而是风险被活动规则公开写出来</text>
<rect x="80" y="130" width="320" height="110" class="card"/><text x="110" y="172" class="label">COVID 与体温检查</text><text x="110" y="205" class="small">WCS：口罩、体温、消毒、换装室禁聊</text>
<rect x="440" y="130" width="320" height="110" class="soft"/><text x="470" y="172" class="label">热中症与脱水</text><text x="470" y="205" class="small">补水、休息、冷却用品；过热服装可制止</text>
<rect x="800" y="130" width="320" height="110" class="card"/><text x="830" y="172" class="label">摄影同意</text><text x="830" y="205" class="small">不得偷拍、低角度、长时间占位；上传需许可</text>
<rect x="80" y="275" width="320" height="110" class="soft"/><text x="110" y="317" class="label">触碰边界</text><text x="110" y="350" class="small">wasshoi：通行证颜色表达接触/拍摄可否</text>
<rect x="440" y="275" width="320" height="110" class="card"/><text x="470" y="317" class="label">水域与场地</text><text x="470" y="350" class="small">泳池区禁入水、禁无人机、器材需稳定</text>
<rect x="800" y="275" width="320" height="110" class="soft"/><text x="830" y="317" class="label">传闻与匿名场</text><text x="830" y="350" class="small">不列人名；只记录社群治理压力</text>

</svg>