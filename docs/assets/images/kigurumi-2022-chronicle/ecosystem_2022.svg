<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img">

<style>
  .bg { fill: #fffaf3; }
  .title { font: 700 34px 'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif; fill: #2b2118; }
  .subtitle { font: 400 17px 'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif; fill: #64564a; }
  .label { font: 700 18px 'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif; fill: #2b2118; }
  .small { font: 400 14px 'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif; fill: #4c4037; }
  .tiny { font: 400 12px 'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif; fill: #6a5a4c; }
  .card { fill: #ffffff; stroke: #d8c4aa; stroke-width: 2; rx: 16; }
  .soft { fill: #f3e1c8; stroke: #cba982; stroke-width: 2; rx: 16; }
  .accent { fill: #c66b43; }
  .accent2 { fill: #5a8a8a; }
  .accent3 { fill: #7a5c9b; }
  .line { stroke: #b48a60; stroke-width: 4; stroke-linecap: round; }
</style>

<rect class="bg" width="100%" height="100%"/>

<text x="50" y="60" class="title">2022 年生态分层图</text>
<text x="50" y="92" class="subtitle">同一年中的 kigurumi 并不是单一路线，而是官方、社群、中文娃圈与规则治理并行</text>
<rect x="70" y="135" width="250" height="110" class="soft"/><text x="95" y="175" class="label">官方 IP greeting</text><text x="95" y="205" class="small">FGO AnimeJapan</text><text x="95" y="227" class="small">FGO Fes. 线下回归</text>
<rect x="345" y="135" width="250" height="110" class="card"/><text x="370" y="175" class="label">专门活动</text><text x="370" y="205" class="small">キグルミwasshoi! 19</text><text x="370" y="227" class="small">着ぐFesta 首回</text>
<rect x="620" y="135" width="250" height="110" class="soft"/><text x="645" y="175" class="label">中文 Doll Weekend</text><text x="645" y="205" class="small">DW5—DW8</text><text x="645" y="227" class="small">主题化・展商・烟花</text>
<rect x="895" y="135" width="250" height="110" class="card"/><text x="920" y="175" class="label">主流大会规则</text><text x="920" y="205" class="small">WCS2022</text><text x="920" y="227" class="small">公共空间・热中症・COVID</text>
<line x1="195" y1="245" x2="195" y2="330" class="line"/><line x1="470" y1="245" x2="470" y2="330" class="line"/><line x1="745" y1="245" x2="745" y2="330" class="line"/><line x1="1020" y1="245" x2="1020" y2="330" class="line"/>
<rect x="125" y="330" width="950" height="150" class="card"/>
<text x="160" y="372" class="label">共同底层问题</text>
<text x="160" y="405" class="small">遮面后的身份确认、无法说话时的同意表达、长时间佩戴的过热和脱水、摄影上传许可、公共会场里的普通观众、</text>
<text x="160" y="430" class="small">运输与更衣动线、以及“官方 mascot / animegao / doller / 全身 cosplay”之间的语义混用。</text>

</svg>