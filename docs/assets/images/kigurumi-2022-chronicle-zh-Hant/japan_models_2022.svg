<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img">

<style>
  .bg { fill: #fffaf3; }
  .title { font: 700 34px 'Noto Sans CJK TC','Microsoft JhengHei',Arial,sans-serif; fill: #2b2118; }
  .subtitle { font: 400 17px 'Noto Sans CJK TC','Microsoft JhengHei',Arial,sans-serif; fill: #64564a; }
  .label { font: 700 18px 'Noto Sans CJK TC','Microsoft JhengHei',Arial,sans-serif; fill: #2b2118; }
  .small { font: 400 14px 'Noto Sans CJK TC','Microsoft JhengHei',Arial,sans-serif; fill: #4c4037; }
  .tiny { font: 400 12px 'Noto Sans CJK TC','Microsoft JhengHei',Arial,sans-serif; fill: #6a5a4c; }
  .card { fill: #ffffff; stroke: #d8c4aa; stroke-width: 2; rx: 16; }
  .soft { fill: #f3e1c8; stroke: #cba982; stroke-width: 2; rx: 16; }
  .accent { fill: #c66b43; }
  .accent2 { fill: #5a8a8a; }
  .accent3 { fill: #7a5c9b; }
  .line { stroke: #b48a60; stroke-width: 4; stroke-linecap: round; }
</style>

<rect class="bg" width="100%" height="100%"/>

<text x="50" y="60" class="title">日本線下重啟的三種模型</text>
<text x="50" y="92" class="subtitle">2022 年的日本線既有大型專門酒店活動，也有低門檻交流會，還有主流大會的公共規則治理</text>
<rect x="70" y="145" width="330" height="280" class="card"/>
<text x="105" y="190" class="label">キグルミwasshoi! 19</text>
<text x="105" y="225" class="small">酒店・大廳・泳池・教堂</text>
<text x="105" y="250" class="small">stage、dealer、攝影服務</text>
<text x="105" y="275" class="small">接觸/攝影可否通行證</text>
<text x="105" y="300" class="small">住宿樓層與夜間場景</text>
<text x="105" y="335" class="tiny">關鍵詞：專門活動的綜合化</text>
<rect x="435" y="145" width="330" height="280" class="soft"/>
<text x="470" y="190" class="label">著ぐFesta 首回</text>
<text x="470" y="225" class="small">荒川區小ホール</text>
<text x="470" y="250" class="small">24 名公開參與者</text>
<text x="470" y="275" class="small">白黑背景 / 自由交流</text>
<text x="470" y="300" class="small">“先辦起來再聽反饋”</text>
<text x="470" y="335" class="tiny">關鍵詞：低門檻和新人入口</text>
<rect x="800" y="145" width="330" height="280" class="card"/>
<text x="835" y="190" class="label">WCS2022</text>
<text x="835" y="225" class="small">20 週年 / 現實舞臺迴歸</text>
<text x="835" y="250" class="small">公共空間與普通遊客共用</text>
<text x="835" y="275" class="small">熱中症、COVID、攝影同意</text>
<text x="835" y="300" class="small">過熱服裝可被工作人員制止</text>
<text x="835" y="335" class="tiny">關鍵詞：主流大會治理</text>

</svg>