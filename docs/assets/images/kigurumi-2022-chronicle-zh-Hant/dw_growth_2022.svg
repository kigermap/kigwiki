<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img">

<style>
  .bg { fill: #fffaf3; }
  .title { font: 700 34px 'Noto Sans CJK TC','Microsoft JhengHei',Arial,sans-serif; fill: #2b2118; }
  .subtitle { font: 400 17px 'Noto Sans CJK TC','Microsoft JhengHei',Arial,sans-serif; fill: #64564a; }
  .label { font: 700 18px 'Noto Sans CJK TC','Microsoft JhengHei',Arial,sans-serif; fill: #2b2118; }
  .small { font: 400 14px 'Noto Sans CJK TC','Microsoft JhengHei',Arial,sans-serif; fill: #4c4037; }
  .tiny { font: 400 12px 'Noto Sans CJK TC','Microsoft JhengHei',Arial,sans-serif; fill: #6a5a4c; }
  .card { fill: #ffffff; stroke: #d8c4aa; stroke-width: 2; rx: 16; }
  .soft { fill: #f3e1c8; stroke: #cba982; stroke-width: 2; rx: 16; }
  .accent { fill: #c66b43; }
  .accent2 { fill: #5a8a8a; }
  .accent3 { fill: #7a5c9b; }
  .line { stroke: #b48a60; stroke-width: 4; stroke-linecap: round; }
</style>

<rect class="bg" width="100%" height="100%"/>

<text x="50" y="60" class="title">Doll Weekend 2022 成長階梯</text>
<text x="50" y="92" class="subtitle">2022 年中文“娃/Kig”線從主題活動、度假場景走向展商參與與疫後重聚</text>
<rect x="90" y="140" width="220" height="260" class="card"/><text x="125" y="182" class="label">DW5</text><text x="125" y="215" class="small">黑白協奏</text><text x="125" y="240" class="small">珠海</text><text x="125" y="265" class="small">首次主題活動</text><text x="125" y="290" class="small">黑白女僕派對</text>
<rect x="345" y="115" width="220" height="285" class="soft"/><text x="380" y="157" class="label">DW6</text><text x="380" y="190" class="small">濱海假期</text><text x="380" y="215" class="small">深圳</text><text x="380" y="240" class="small">颱風後海邊別墅</text><text x="380" y="265" class="small">整日角色沉浸</text><text x="380" y="290" class="small">與社交體驗</text>
<rect x="600" y="90" width="220" height="310" class="card"/><text x="635" y="132" class="label">DW7</text><text x="635" y="165" class="small">聯結新生</text><text x="635" y="190" class="small">廣州</text><text x="635" y="215" class="small">首次展商夥伴加入</text><text x="635" y="240" class="small">Hidolls 等</text><text x="635" y="265" class="small">超過 150 名參與者</text>
<rect x="855" y="65" width="250" height="335" class="soft"/><text x="890" y="107" class="label">DW8</text><text x="890" y="140" class="small">冬日暖聚</text><text x="890" y="165" class="small">惠州</text><text x="890" y="190" class="small">走出疫情陰霾後的</text><text x="890" y="215" class="small">首次重逢</text><text x="890" y="240" class="small">海邊、沙灘與煙花</text>
<path d="M310 275 C340 250, 345 240, 345 220" fill="none" stroke="#b48a60" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M565 250 C590 220, 595 205, 600 190" fill="none" stroke="#b48a60" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M820 220 C845 190, 850 170, 855 150" fill="none" stroke="#b48a60" stroke-width="4" marker-end="url(#arrow)"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#b48a60"/></marker></defs>

</svg>