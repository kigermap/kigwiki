<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img">

<style>
  .bg { fill: #fffaf3; }
  .title { font: 700 34px 'Noto Sans CJK TC','Microsoft JhengHei',Arial,sans-serif; fill: #2b2118; }
  .subtitle { font: 400 17px 'Noto Sans CJK TC','Microsoft JhengHei',Arial,sans-serif; fill: #64564a; }
  .label { font: 700 18px 'Noto Sans CJK TC','Microsoft JhengHei',Arial,sans-serif; fill: #2b2118; }
  .small { font: 400 14px 'Noto Sans CJK TC','Microsoft JhengHei',Arial,sans-serif; fill: #4c4037; }
  .tiny { font: 400 12px 'Noto Sans CJK TC','Microsoft JhengHei',Arial,sans-serif; fill: #6a5a4c; }
  .card { fill: #ffffff; stroke: #d8c4aa; stroke-width: 2; rx: 16; }
  .soft { fill: #f3e1c8; stroke: #cba982; stroke-width: 2; rx: 16; }
  .accent { fill: #c66b43; }
  .accent2 { fill: #5a8a8a; }
  .accent3 { fill: #7a5c9b; }
  .line { stroke: #b48a60; stroke-width: 4; stroke-linecap: round; }
</style>

<rect class="bg" width="100%" height="100%"/>

<text x="50" y="60" class="title">2022 年風險治理矩陣</text>
<text x="50" y="92" class="subtitle">這一年最重要的“負面史”不是某個醜聞，而是風險被活動規則公開寫出來</text>
<rect x="80" y="130" width="320" height="110" class="card"/><text x="110" y="172" class="label">COVID 與體溫檢查</text><text x="110" y="205" class="small">WCS：口罩、體溫、消毒、換裝室禁聊</text>
<rect x="440" y="130" width="320" height="110" class="soft"/><text x="470" y="172" class="label">熱中症與脫水</text><text x="470" y="205" class="small">補水、休息、冷卻用品；過熱服裝可制止</text>
<rect x="800" y="130" width="320" height="110" class="card"/><text x="830" y="172" class="label">攝影同意</text><text x="830" y="205" class="small">不得偷拍、低角度、長時間佔位；上傳需許可</text>
<rect x="80" y="275" width="320" height="110" class="soft"/><text x="110" y="317" class="label">觸碰邊界</text><text x="110" y="350" class="small">wasshoi：通行證顏色表達接觸/拍攝可否</text>
<rect x="440" y="275" width="320" height="110" class="card"/><text x="470" y="317" class="label">水域與場地</text><text x="470" y="350" class="small">泳池區禁入水、禁無人機、器材需穩定</text>
<rect x="800" y="275" width="320" height="110" class="soft"/><text x="830" y="317" class="label">傳聞與匿名場</text><text x="830" y="350" class="small">不列人名；只記錄社群治理壓力</text>

</svg>