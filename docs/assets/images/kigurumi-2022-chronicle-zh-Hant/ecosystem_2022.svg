<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img">

<style>
  .bg { fill: #fffaf3; }
  .title { font: 700 34px 'Noto Sans CJK TC','Microsoft JhengHei',Arial,sans-serif; fill: #2b2118; }
  .subtitle { font: 400 17px 'Noto Sans CJK TC','Microsoft JhengHei',Arial,sans-serif; fill: #64564a; }
  .label { font: 700 18px 'Noto Sans CJK TC','Microsoft JhengHei',Arial,sans-serif; fill: #2b2118; }
  .small { font: 400 14px 'Noto Sans CJK TC','Microsoft JhengHei',Arial,sans-serif; fill: #4c4037; }
  .tiny { font: 400 12px 'Noto Sans CJK TC','Microsoft JhengHei',Arial,sans-serif; fill: #6a5a4c; }
  .card { fill: #ffffff; stroke: #d8c4aa; stroke-width: 2; rx: 16; }
  .soft { fill: #f3e1c8; stroke: #cba982; stroke-width: 2; rx: 16; }
  .accent { fill: #c66b43; }
  .accent2 { fill: #5a8a8a; }
  .accent3 { fill: #7a5c9b; }
  .line { stroke: #b48a60; stroke-width: 4; stroke-linecap: round; }
</style>

<rect class="bg" width="100%" height="100%"/>

<text x="50" y="60" class="title">2022 年生態分層圖</text>
<text x="50" y="92" class="subtitle">同一年中的 kigurumi 並不是單一路線，而是官方、社群、中文娃圈與規則治理並行</text>
<rect x="70" y="135" width="250" height="110" class="soft"/><text x="95" y="175" class="label">官方 IP greeting</text><text x="95" y="205" class="small">FGO AnimeJapan</text><text x="95" y="227" class="small">FGO Fes. 線下回歸</text>
<rect x="345" y="135" width="250" height="110" class="card"/><text x="370" y="175" class="label">專門活動</text><text x="370" y="205" class="small">キグルミwasshoi! 19</text><text x="370" y="227" class="small">著ぐFesta 首回</text>
<rect x="620" y="135" width="250" height="110" class="soft"/><text x="645" y="175" class="label">中文 Doll Weekend</text><text x="645" y="205" class="small">DW5—DW8</text><text x="645" y="227" class="small">主題化・展商・煙花</text>
<rect x="895" y="135" width="250" height="110" class="card"/><text x="920" y="175" class="label">主流大會規則</text><text x="920" y="205" class="small">WCS2022</text><text x="920" y="227" class="small">公共空間・熱中症・COVID</text>
<line x1="195" y1="245" x2="195" y2="330" class="line"/><line x1="470" y1="245" x2="470" y2="330" class="line"/><line x1="745" y1="245" x2="745" y2="330" class="line"/><line x1="1020" y1="245" x2="1020" y2="330" class="line"/>
<rect x="125" y="330" width="950" height="150" class="card"/>
<text x="160" y="372" class="label">共同底層問題</text>
<text x="160" y="405" class="small">遮面後的身份確認、無法說話時的同意表達、長時間佩戴的過熱和脫水、攝影上傳許可、公共會場裡的普通觀眾、</text>
<text x="160" y="430" class="small">運輸與更衣動線、以及“官方 mascot / animegao / doller / 全身 cosplay”之間的語義混用。</text>

</svg>