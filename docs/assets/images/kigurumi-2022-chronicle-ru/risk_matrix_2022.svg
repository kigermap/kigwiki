<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img">

<style>
  .bg {fill: #fffaf3; }
  .title { шрифт: 700 34px «Noto Sans», «Arial», Arial, без засечек; заливка: #2b2118; }
  .subtitle { шрифт: 400 17 пикселей «Noto Sans», «Arial», Arial, без засечек; заливка: #64564a; }
  .label { шрифт: 700 18 пикселей «Noto Sans», «Arial», Arial, без засечек; заливка: #2b2118; }
  .small { шрифт: 400 14 пикселей «Noto Sans», «Arial», Arial, без засечек; заливка: #4c4037; }
  .tiny { шрифт: 400 12 пикселей «Noto Sans», «Arial», Arial, без засечек; заливка: #6a5a4c; }
  .card {fill: #ffffff; штрих: #d8c4aa; ширина штриха: 2; прием: 16; }
  .soft {fill: #f3e1c8; штрих: #cba982; ширина штриха: 2; прием: 16; }
  .accent {fill: #c66b43; }
  .accent2 { fill: #5a8a8a; }
  .accent3 { fill: #7a5c9b; }
  .line {stroke: #b48a60; ширина штриха: 4; штрих-линейная крышка: круглая; }
</style>

<rect class="bg" width="100%" height="100%"/>

<text x="50" y="60" class="title">Матрица управления рисками 2022 года</text>
<text x="50" y="92" class="subtitle">Самая главная «негативная история» этого года — не какой-то скандал, а риск быть публично прописанным в правилах мероприятия.</text>
<rect x="80" y="130" width="320" height="110" class="card"/><text x="110" y="172" class="label">COVID и проверка температуры</text><text x="110" y="205" class="small">WCS: маски, температура тела, дезинфекция, в раздевалке запрещено общение.</text>
<rect x="440" y="130" width="320" height="110" class="soft"/><text x="470" y="172" class="label">тепловой удар и обезвоживание</text><text x="470" y="205" class="small">Вода, отдых и охлаждение; перегретую одежду могут запретить</text>
<rect x="800" y="130" width="320" height="110" class="card"/><text x="830" y="172" class="label">Согласие на фотографию</text><text x="830" y="205" class="small">Никакие скрытые выстрелы, низкие ракурсы или длительное пребывание в помещении не допускаются; для загрузки требуется разрешение</text>
<rect x="80" y="275" width="320" height="110" class="soft"/><text x="110" y="317" class="label">касаясь границы</text><text x="110" y="350" class="small">вассой: Цвет пропуска указывает, возможен ли контакт/фотографирование.</text>
<rect x="440" y="275" width="320" height="110" class="card"/><text x="470" y="317" class="label">Воды и грунты</text><text x="470" y="350" class="small">Вход в воду и использование дронов в зоне бассейна запрещены, оборудование должно быть устойчивым.</text>
<rect x="800" y="275" width="320" height="110" class="soft"/><text x="830" y="317" class="label">Слухи и анонимные поля</text><text x="830" y="350" class="small">Имена не указаны; зафиксировано только давление со стороны руководства сообщества</text>

</svg>