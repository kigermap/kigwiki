<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img">

<style>
  .bg {fill: #fffaf3; }
  .title { шрифт: 700 34px «Noto Sans», «Arial», Arial, без засечек; заливка: #2b2118; }
  .subtitle { шрифт: 400 17 пикселей «Noto Sans», «Arial», Arial, без засечек; заливка: #64564a; }
  .label { шрифт: 700 18 пикселей «Noto Sans», «Arial», Arial, без засечек; заливка: #2b2118; }
  .small { шрифт: 400 14 пикселей «Noto Sans», «Arial», Arial, без засечек; заливка: #4c4037; }
  .tiny { шрифт: 400 12 пикселей «Noto Sans», «Arial», Arial, без засечек; заливка: #6a5a4c; }
  .card {fill: #ffffff; штрих: #d8c4aa; ширина штриха: 2; прием: 16; }
  .soft {fill: #f3e1c8; штрих: #cba982; ширина штриха: 2; прием: 16; }
  .accent {fill: #c66b43; }
  .accent2 { fill: #5a8a8a; }
  .accent3 { fill: #7a5c9b; }
  .line {stroke: #b48a60; ширина штриха: 4; штрих-линейная крышка: круглая; }
</style>

<rect class="bg" width="100%" height="100%"/>

<text x="50" y="60" class="title">Три модели офлайн-перезапуска Японии</text>
<text x="50" y="92" class="subtitle">«Japan Line» в 2022 году будет включать в себя крупномасштабные специализированные гостиничные мероприятия, встречи по обмену информацией с низким порогом и управление общественными правилами на основных конференциях.</text>
<rect x="70" y="145" width="330" height="280" class="card"/>
<text x="105" y="190" class="label">キグルミwasshoi! 19</text>
<text x="105" y="225" class="small">Отель, вестибюль, бассейн, церковь</text>
<text x="105" y="250" class="small">stage, dealer, фотоуслуги</text>
<text x="105" y="275" class="small">Есть ли пропуск для контакта/фотографирования?</text>
<text x="105" y="300" class="small">Этажи размещения и ночные сцены</text>
<text x="105" y="335" class="tiny">Ключевые слова: Интеграция специализированной деятельности.</text>
<rect x="435" y="145" width="330" height="280" class="soft"/>
<text x="470" y="190" class="label">着ぐFesta первый выпуск</text>
<text x="470" y="225" class="small">小ホール, приход Аракава</text>
<text x="470" y="250" class="small">24 общественных участника</text>
<text x="470" y="275" class="small">Белый и черный фон/свободное общение</text>
<text x="470" y="300" class="small">«Сначала сделайте это, а потом слушайте отзывы»</text>
<text x="470" y="335" class="tiny">Ключевые слова: низкий порог и вход для новичков.</text>
<rect x="800" y="145" width="330" height="280" class="card"/>
<text x="835" y="190" class="label">WCS 2022</text>
<text x="835" y="225" class="small">20 лет / Возвращение на сцену реальности</text>
<text x="835" y="250" class="small">Общественные места используются обычными посетителями</text>
<text x="835" y="275" class="small">тепловой удар, COVID, согласие на фотографирование</text>
<text x="835" y="300" class="small">Перегрев одежды может быть остановлен персоналом.</text>
<text x="835" y="335" class="tiny">Ключевые слова: основное управление конференциями</text>

</svg>