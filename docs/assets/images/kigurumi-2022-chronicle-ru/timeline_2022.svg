<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img">

<style>
  .bg {fill: #fffaf3; }
  .title { шрифт: 700 34px «Noto Sans», «Arial», Arial, без засечек; заливка: #2b2118; }
  .subtitle { шрифт: 400 17 пикселей «Noto Sans», «Arial», Arial, без засечек; заливка: #64564a; }
  .label { шрифт: 700 18 пикселей «Noto Sans», «Arial», Arial, без засечек; заливка: #2b2118; }
  .small { шрифт: 400 14 пикселей «Noto Sans», «Arial», Arial, без засечек; заливка: #4c4037; }
  .tiny { шрифт: 400 12 пикселей «Noto Sans», «Arial», Arial, без засечек; заливка: #6a5a4c; }
  .card {fill: #ffffff; штрих: #d8c4aa; ширина штриха: 2; прием: 16; }
  .soft {fill: #f3e1c8; штрих: #cba982; ширина штриха: 2; прием: 16; }
  .accent {fill: #c66b43; }
  .accent2 { fill: #5a8a8a; }
  .accent3 { fill: #7a5c9b; }
  .line {stroke: #b48a60; ширина штриха: 4; штрих-линейная крышка: круглая; }
</style>

<rect class="bg" width="100%" height="100%"/>

<text x="50" y="60" class="title">Хронология хроник Kigurumi 2022 г.</text>
<text x="50" y="92" class="subtitle">Офлайн-перезапуск после эпидемии, возвращение официального IP, раннее расширение и отправная точка регуляризации китайского 娃/Kig круга</text>
<line x1="80" y1="210" x2="1120" y2="210" class="line"/>
<circle cx="170" cy="210" r="14" class="accent"/><text x="130" y="250" class="label">Маршировать</text><text x="95" y="276" class="small">FGO × AnimeJapan</text><text x="94" y="296" class="tiny">greeting stage план</text>
<circle cx="320" cy="210" r="14" class="accent2"/><text x="280" y="170" class="label">апрель</text><text x="235" y="145" class="small">Глава 19.</text><text x="252" y="125" class="tiny">Отель・Бассейн・Сцена・dealer</text>
<circle cx="470" cy="210" r="14" class="accent3"/><text x="430" y="250" class="label">Июнь</text><text x="383" y="276" class="small">Doll Weekend 5</text><text x="382" y="296" class="tiny">Черно-белая вечеринка горничных / тема первого раза</text>
<circle cx="610" cy="210" r="14" class="accent3"/><text x="570" y="170" class="label">Июль</text><text x="530" y="145" class="small">DW6 + FGO Fes.</text><text x="508" y="125" class="tiny">Отдых на море / возвращение в офлайн-юбилей</text>
<circle cx="765" cy="210" r="14" class="accent2"/><text x="725" y="250" class="label">Август</text><text x="660" y="276" class="small">WCS 2022 + 着ぐFesta первая серия</text><text x="660" y="296" class="tiny">Публичные правила / тепловой удар / Низкопороговое общение</text>
<circle cx="935" cy="210" r="14" class="accent3"/><text x="895" y="170" class="label">вторая половина</text><text x="858" y="145" class="small">Doll Weekend 7</text><text x="822" y="125" class="tiny">Присоединилась первая партия экспонентов / 150+ участников</text>
<circle cx="1085" cy="210" r="14" class="accent3"/><text x="1045" y="250" class="label">Конец года</text><text x="1010" y="276" class="small">Doll Weekend 8</text><text x="1000" y="296" class="tiny">Воссоединение после эпидемии / Пляж и фейерверки</text>
<rect x="62" y="350" width="1076" height="150" class="card"/>
<text x="95" y="392" class="label">Ежегодное позиционирование</text>
<text x="95" y="425" class="small">2022 год — не год крупнейших масштабов, а год «офлайн-воссоединения»: организаторы мероприятий заново учатся управлять масками, температурой тела, увлажнением, согласием на фотографирование, прикосновением к границам,</text>
<text x="95" y="450" class="small">Изменение потока и общественного пространства. Он предоставляет базовый опыт расширения деятельности, совершенствования правил и индустриализации в 2023-2025 годах.</text>

</svg>