  <circle cx="650" cy="310" r="20" fill="#b2dfdb" stroke="#ffffff" stroke-width="5" filter="url(#shadow)"/>
  <line x1="650" y1="310" x2="650" y2="430" stroke="#90a4ae" stroke-width="2" stroke-dasharray="5 5"/>
  <rect x="578" y="430" rx="18" ry="18" width="144" height="92" fill="#ffffff" filter="url(#shadow)"/>
