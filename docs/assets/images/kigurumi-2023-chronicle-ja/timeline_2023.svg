  <text x="650" y="506" text-anchor="middle" class="tiny">完全復活と熱中症ルール</text>
  <circle cx="790" cy="310" r="20" fill="#f8bbd0" stroke="#ffffff" stroke-width="5" filter="url(#shadow)"/>
  <line x1="790" y1="310" x2="790" y2="190" stroke="#90a4ae" stroke-width="2" stroke-dasharray="5 5"/>
  <rect x="718" y="135" rx="18" ry="18" width="144" height="92" fill="#ffffff" filter="url(#shadow)"/>
