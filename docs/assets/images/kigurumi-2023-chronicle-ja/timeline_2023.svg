  <circle cx="1060" cy="310" r="20" fill="#ffecb3" stroke="#ffffff" stroke-width="5" filter="url(#shadow)"/>
  <line x1="1060" y1="310" x2="1060" y2="190" stroke="#90a4ae" stroke-width="2" stroke-dasharray="5 5"/>
  <rect x="988" y="135" rx="18" ry="18" width="144" height="92" fill="#ffffff" filter="url(#shadow)"/>
