  <rect x="56" y="545" rx="16" width="1088" height="42" fill="#ffffff" opacity="0.82"/>
  <text x="76" y="572" class="small">読書のヒント: DW9、SP1、およびその他のソーシャル メディアのヒントは、時間の位置を特定するためにのみ使用されます。規模と性質は Doll Weekend 公式ウェブサイト、TwiPla、FGO / WCS / Aniplex 公式情報に基づく必要があります。</text>
