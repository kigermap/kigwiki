<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7f9"/>
      <stop offset="55%" stop-color="#f5fbff"/>
      <stop offset="100%" stop-color="#f8fff5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.14"/>
    </filter>
    <style>
      .title { font-family: 'Noto Sans CJK JP','Hiragino Sans','Yu Gothic',Arial,sans-serif;フォントサイズ: 34px;フォントの太さ: 800;塗りつぶし: #263238; }
      .sub { font-family: 'Noto Sans CJK JP','Hiragino Sans','Yu Gothic',Arial,sans-serif;フォントサイズ: 18px;塗りつぶし: #52616b; }
      .label { font-family: 'Noto Sans CJK JP','Hiragino Sans','Yu Gothic',Arial,sans-serif;フォントサイズ: 18px;フォントの太さ: 700;塗りつぶし: #263238; }
      .small { font-family: 'Noto Sans CJK JP','Hiragino Sans','Yu Gothic',Arial,sans-serif;フォントサイズ: 14px;塗りつぶし: #455a64; }
      .tiny { font-family: 'Noto Sans CJK JP','Hiragino Sans','Yu Gothic',Arial,sans-serif;フォントサイズ: 12px;塗りつぶし: #607d8b; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <text x="56" y="62" class="title">日本のオフライン活動のリズム: 着ぐFesta の規則化された軌跡</text>
  <text x="56" y="94" class="sub">2023 年の公開情報によると、着ぐFesta は「入門」から写真撮影、社会的交流、物理的な境界ルールに徐々に移行してきました。</text>
  <rect x="90" y="170" width="220" height="310" rx="28" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="200" cy="170" r="34" fill="#ffab91" stroke="#fff" stroke-width="5"/>
  <text x="200" y="180" text-anchor="middle" class="label">1</text>
  <text x="200" y="230" text-anchor="middle" class="label" font-size="17">4月8日 定期返信</text>
  <text x="118" y="280" class="small"><tspan x="118" dy="0">• 300人収容のホール</tspan><tspan x="118" dy="30">• マスクの展示とフィッティング</tspan><tspan x="118" dy="30">• 一般参加者60名</tspan></text>
<path d="M310,320 L360,320" stroke="#90a4ae" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="360" y="170" width="220" height="310" rx="28" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="470" cy="170" r="34" fill="#80cbc4" stroke="#fff" stroke-width="5"/>
  <text x="470" y="180" text-anchor="middle" class="label">2</text>
  <text x="470" y="230" text-anchor="middle" class="label" font-size="17">8月26日 第3回</text>
  <text x="388" y="280" class="small"><tspan x="388" dy="0">• 初心者向けの説明</tspan><tspan x="388" dy="30">• dealer / 無料の衣類</tspan><tspan x="388" dy="30">• 背景布のアップグレード</tspan></text>
<path d="M580,320 L630,320" stroke="#90a4ae" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="630" y="170" width="220" height="310" rx="28" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="740" cy="170" r="34" fill="#ce93d8" stroke="#fff" stroke-width="5"/>
  <text x="740" y="180" text-anchor="middle" class="label">3</text>
  <text x="740" y="230" text-anchor="middle" class="label" font-size="17">11月4日の夜</text>
  <text x="658" y="280" class="small"><tspan x="658" dy="0">• 完全予約制</tspan><tspan x="658" dy="30">• 21:30～7:30</tspan><tspan x="658" dy="30">• スタジオでの夜間撮影</tspan></text>
<path d="M850,320 L900,320" stroke="#90a4ae" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="900" y="170" width="220" height="310" rx="28" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="1010" cy="170" r="34" fill="#ffe082" stroke="#fff" stroke-width="5"/>
  <text x="1010" y="180" text-anchor="middle" class="label">4</text>
  <text x="1010" y="230" text-anchor="middle" class="label" font-size="17">12月9日 4日</text>
  <text x="928" y="280" class="small"><tspan x="928" dy="0">• 横撮り 禁止</tspan><tspan x="928" dy="30">• 禁止を受け入れる</tspan><tspan x="928" dy="30">• dealer を使用した写真チュートリアル</tspan></text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#90a4ae"/></marker></defs>
  <rect x="80" y="535" width="1040" height="70" rx="22" fill="#e8f5e9"/>
  <text x="105" y="566" class="small">主な変更点： 2023年のルールは抽象的なスローガンではなく、マスクの下の「話しにくい、断りにくい、プロフィールにされやすい、マスクを外すと境界線が破壊される」という具体的な問題への直接的な対応となっている。</text>
  <text x="105" y="592" class="tiny">このラインは 2024 年の 5th/6th と Night2nd の前兆であり、2024 年のフォローアップを繰り返すものではありません。</text>
</svg>
