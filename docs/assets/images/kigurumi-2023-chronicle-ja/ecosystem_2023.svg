<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7f9"/>
      <stop offset="55%" stop-color="#f5fbff"/>
      <stop offset="100%" stop-color="#f8fff5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.14"/>
    </filter>
    <style>
      .title { font-family: 'Noto Sans CJK JP','Hiragino Sans','Yu Gothic',Arial,sans-serif;フォントサイズ: 34px;フォントの太さ: 800;塗りつぶし: #263238; }
      .sub { font-family: 'Noto Sans CJK JP','Hiragino Sans','Yu Gothic',Arial,sans-serif;フォントサイズ: 18px;塗りつぶし: #52616b; }
      .label { font-family: 'Noto Sans CJK JP','Hiragino Sans','Yu Gothic',Arial,sans-serif;フォントサイズ: 18px;フォントの太さ: 700;塗りつぶし: #263238; }
      .small { font-family: 'Noto Sans CJK JP','Hiragino Sans','Yu Gothic',Arial,sans-serif;フォントサイズ: 14px;塗りつぶし: #455a64; }
      .tiny { font-family: 'Noto Sans CJK JP','Hiragino Sans','Yu Gothic',Arial,sans-serif;フォントサイズ: 12px;塗りつぶし: #607d8b; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <text x="56" y="62" class="title">2023 年の生態学的階層化: 回復、実験、国際化</text>
  <text x="56" y="94" class="sub">2024/2025 年の大規模な拡大とは異なり、2023 年はオフライン活動が再びつながる年となるでしょう。</text>
  <rect x="70" y="150" width="300" height="160" rx="26" fill="#fff3e0" filter="url(#shadow)"/>
  <text x="94" y="192" class="label">公式IPの具体化</text>
  <text x="94" y="226" class="small"><tspan x="94" dy="0">FGO / hololive / Aniplex</tspan><tspan x="94" dy="24">ブース挨拶、mini stage、周年記念イベント</tspan></text>
  <rect x="94" y="262" rx="16" width="130" height="30" fill="#ffffff" opacity="0.82"/>
  <text x="159" y="282" class="tiny" text-anchor="middle" font-weight="700">役割の可視性</text>
  <rect x="450" y="150" width="300" height="160" rx="26" fill="#e3f2fd" filter="url(#shadow)"/>
  <text x="474" y="192" class="label">日本のファン活動</text>
  <text x="474" y="226" class="small"><tspan x="474" dy="0">着ぐFesta 定期帰り、3日、夜、4日</tspan><tspan x="474" dy="24">初心者向け、撮影ルール、dealer</tspan></text>
  <rect x="474" y="262" rx="16" width="130" height="30" fill="#ffffff" opacity="0.82"/>
  <text x="539" y="282" class="tiny" text-anchor="middle" font-weight="700">ルールのプロトタイプ</text>
  <rect x="830" y="150" width="300" height="160" rx="26" fill="#f1f8e9" filter="url(#shadow)"/>
  <text x="854" y="192" class="label">チャイニーズベイビー/Kigサークル</text>
  <text x="854" y="226" class="small"><tspan x="854" dy="0">DW9ステージ、SP会場探索、DW10 400+</tspan><tspan x="854" dy="24">海外選手も台頭</tspan></text>
  <rect x="854" y="262" rx="16" width="130" height="30" fill="#ffffff" opacity="0.82"/>
  <text x="919" y="282" class="tiny" text-anchor="middle" font-weight="700">国際化前夜</text>
  <rect x="250" y="400" width="300" height="160" rx="26" fill="#f3e5f5" filter="url(#shadow)"/>
  <text x="274" y="442" class="label">大規模な総合展示会</text>
  <text x="274" y="476" class="small"><tspan x="274" dy="0">WCS2023 完全復活</tspan><tspan x="274" dy="24">33の国・地域代表</tspan></text>
  <rect x="274" y="512" rx="16" width="130" height="30" fill="#ffffff" opacity="0.82"/>
  <text x="339" y="532" class="tiny" text-anchor="middle" font-weight="700">公共空間の管理</text>
  <rect x="650" y="400" width="300" height="160" rx="26" fill="#e0f7fa" filter="url(#shadow)"/>
  <text x="674" y="442" class="label">リスクガバナンス</text>
  <text x="674" y="476" class="small"><tspan x="674" dy="0">熱中症、同意のない撮影、境界線の受け入れ、顔の削除範囲</tspan><tspan x="674" dy="24">経験からルールへ</tspan></text>
  <rect x="674" y="512" rx="16" width="130" height="30" fill="#ffffff" opacity="0.82"/>
  <text x="739" y="532" class="tiny" text-anchor="middle" font-weight="700">セキュリティと同意</text>
<path d="M370,230 C410,230 410,230 450,230" stroke="#90a4ae" stroke-width="3" fill="none" stroke-dasharray="8 8"/>
<path d="M750,230 C790,230 790,230 830,230" stroke="#90a4ae" stroke-width="3" fill="none" stroke-dasharray="8 8"/>
<path d="M600,310 C640,310 360,400 400,400" stroke="#90a4ae" stroke-width="3" fill="none" stroke-dasharray="8 8"/>
<path d="M780,310 C820,310 760,400 800,400" stroke="#90a4ae" stroke-width="3" fill="none" stroke-dasharray="8 8"/>
<path d="M550,480 C590,480 610,480 650,480" stroke="#90a4ae" stroke-width="3" fill="none" stroke-dasharray="8 8"/>
</svg>
