<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img">

<style>
  .bg { 塗りつぶし: #fffaf3; }
  .title { font: 700 34px 'Noto Sans CJK JP','Hiragino Sans','Yu Gothic',Arial,sans-serif;塗りつぶし: #2b2118; }
  .subtitle { font: 400 17px 'Noto Sans CJK JP','Hiragino Sans','Yu Gothic',Arial,sans-serif;塗りつぶし: #64564a; }
  .label { font: 700 18px 'Noto Sans CJK JP','Hiragino Sans','Yu Gothic',Arial,sans-serif;塗りつぶし: #2b2118; }
  .small { font: 400 14px 'Noto Sans CJK JP','Hiragino Sans','Yu Gothic',Arial,sans-serif;塗りつぶし: #4c4037; }
  .tiny { font: 400 12px 'Noto Sans CJK JP','Hiragino Sans','Yu Gothic',Arial,sans-serif;塗りつぶし: #6a5a4c; }
  .card { 塗りつぶし: #ffffff;ストローク: #d8c4aa;ストローク幅: 2; rx: 16; }
  .soft { 塗りつぶし: #f3e1c8;ストローク: #cba982;ストローク幅: 2; rx: 16; }
  .accent { 塗りつぶし: #c66b43; }
  .accent2 { 塗りつぶし: #5a8a8a; }
  .accent3 { 塗りつぶし: #7a5c9b; }
  .line { ストローク: #b48a60;ストローク幅: 4;ストロークラインキャップ: 丸; }
</style>

<rect class="bg" width="100%" height="100%"/>

<text x="50" y="60" class="title">Doll Weekend 2022 年の成長のはしご</text>
<text x="50" y="92" class="subtitle">2022年の中国語圏の「娃/Kig」ラインは、テーマ活動や休暇のシーンから、出展者の参加や流行後の再会へと移行します</text>
<rect x="90" y="140" width="220" height="260" class="card"/><text x="125" y="182" class="label">DW5</text><text x="125" y="215" class="small">黒と白の協奏曲</text><text x="125" y="240" class="small">珠海</text><text x="125" y="265" class="small">初のテーマイベント</text><text x="125" y="290" class="small">黒と白のメイド パーティー</text>
<rect x="345" y="115" width="220" height="285" class="soft"/><text x="380" y="157" class="label">DW6</text><text x="380" y="190" class="small">海岸沿いの休日</text><text x="380" y="215" class="small">深セン</text><text x="380" y="240" class="small">台風後のビーチヴィラ</text><text x="380" y="265" class="small">一日中役割に没頭</text><text x="380" y="290" class="small">そして社会経験</text>
<rect x="600" y="90" width="220" height="310" class="card"/><text x="635" y="132" class="label">DW7</text><text x="635" y="165" class="small">新入生をつなぐ</text><text x="635" y="190" class="small">広州</text><text x="635" y="215" class="small">出展パートナーが初めて参加</text><text x="635" y="240" class="small">Hidolls 他</text><text x="635" y="265" class="small">150名以上の参加者</text>
<rect x="855" y="65" width="250" height="335" class="soft"/><text x="890" y="107" class="label">DW8</text><text x="890" y="140" class="small">冬の暖かさ</text><text x="890" y="165" class="small">恵州</text><text x="890" y="190" class="small">疫病の霞から抜け出した後</text><text x="890" y="215" class="small">初めての再会</text><text x="890" y="240" class="small">海辺、ビーチ、花火</text>
<path d="M310 275 C340 250, 345 240, 345 220" fill="none" stroke="#b48a60" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M565 250 C590 220, 595 205, 600 190" fill="none" stroke="#b48a60" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M820 220 C845 190, 850 170, 855 150" fill="none" stroke="#b48a60" stroke-width="4" marker-end="url(#arrow)"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#b48a60"/></marker></defs>

</svg>