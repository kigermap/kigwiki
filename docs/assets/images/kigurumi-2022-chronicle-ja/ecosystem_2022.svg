<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img">

<style>
  .bg { 塗りつぶし: #fffaf3; }
  .title { font: 700 34px 'Noto Sans CJK JP','Hiragino Sans','Yu Gothic',Arial,sans-serif;塗りつぶし: #2b2118; }
  .subtitle { font: 400 17px 'Noto Sans CJK JP','Hiragino Sans','Yu Gothic',Arial,sans-serif;塗りつぶし: #64564a; }
  .label { font: 700 18px 'Noto Sans CJK JP','Hiragino Sans','Yu Gothic',Arial,sans-serif;塗りつぶし: #2b2118; }
  .small { font: 400 14px 'Noto Sans CJK JP','Hiragino Sans','Yu Gothic',Arial,sans-serif;塗りつぶし: #4c4037; }
  .tiny { font: 400 12px 'Noto Sans CJK JP','Hiragino Sans','Yu Gothic',Arial,sans-serif;塗りつぶし: #6a5a4c; }
  .card { 塗りつぶし: #ffffff;ストローク: #d8c4aa;ストローク幅: 2; rx: 16; }
  .soft { 塗りつぶし: #f3e1c8;ストローク: #cba982;ストローク幅: 2; rx: 16; }
  .accent { 塗りつぶし: #c66b43; }
  .accent2 { 塗りつぶし: #5a8a8a; }
  .accent3 { 塗りつぶし: #7a5c9b; }
  .line { ストローク: #b48a60;ストローク幅: 4;ストロークラインキャップ: 丸; }
</style>

<rect class="bg" width="100%" height="100%"/>

<text x="50" y="60" class="title">2022 年生態階層マップ</text>
<text x="50" y="92" class="subtitle">同じ年のkigurumiは単一ルートではなく、公式、コミュニティ、中国語圏の娃/Kig 圏、ルールガバナンスが並行して行われます。</text>
<rect x="70" y="135" width="250" height="110" class="soft"/><text x="95" y="175" class="label">公式 IP greeting</text><text x="95" y="205" class="small">FGO AnimeJapan</text><text x="95" y="227" class="small">FGO Fes. はオフラインに戻ります</text>
<rect x="345" y="135" width="250" height="110" class="card"/><text x="370" y="175" class="label">専門的な活動</text><text x="370" y="205" class="small">キグルミwasshoi! 19</text><text x="370" y="227" class="small">着ぐFesta 最初の回</text>
<rect x="620" y="135" width="250" height="110" class="soft"/><text x="645" y="175" class="label">中国語 Doll Weekend</text><text x="645" y="205" class="small">DW5 — DW8</text><text x="645" y="227" class="small">テーマ、出展者、花火</text>
<rect x="895" y="135" width="250" height="110" class="card"/><text x="920" y="175" class="label">主流大会のルール</text><text x="920" y="205" class="small">WCS2022</text><text x="920" y="227" class="small">公共空間・熱中症・COVID</text>
<line x1="195" y1="245" x2="195" y2="330" class="line"/><line x1="470" y1="245" x2="470" y2="330" class="line"/><line x1="745" y1="245" x2="745" y2="330" class="line"/><line x1="1020" y1="245" x2="1020" y2="330" class="line"/>
<rect x="125" y="330" width="950" height="150" class="card"/>
<text x="160" y="372" class="label">一般的な根本的な問題</text>
<text x="160" y="405" class="small">顔を覆った上での本人確認、話すことができない場合の同意表明、長時間の着用による熱中症や脱水症状、写真アップロードの許可、公共の場での一般観客、</text>
<text x="160" y="430" class="small">移動と着替えの動作と「公式マスコット / animegao / doller / 全身コスプレ」の意味的融合。</text>

</svg>