<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img">

<style>
  .bg { 塗りつぶし: #fffaf3; }
  .title { font: 700 34px 'Noto Sans CJK JP','Hiragino Sans','Yu Gothic',Arial,sans-serif;塗りつぶし: #2b2118; }
  .subtitle { font: 400 17px 'Noto Sans CJK JP','Hiragino Sans','Yu Gothic',Arial,sans-serif;塗りつぶし: #64564a; }
  .label { font: 700 18px 'Noto Sans CJK JP','Hiragino Sans','Yu Gothic',Arial,sans-serif;塗りつぶし: #2b2118; }
  .small { font: 400 14px 'Noto Sans CJK JP','Hiragino Sans','Yu Gothic',Arial,sans-serif;塗りつぶし: #4c4037; }
  .tiny { font: 400 12px 'Noto Sans CJK JP','Hiragino Sans','Yu Gothic',Arial,sans-serif;塗りつぶし: #6a5a4c; }
  .card { 塗りつぶし: #ffffff;ストローク: #d8c4aa;ストローク幅: 2; rx: 16; }
  .soft { 塗りつぶし: #f3e1c8;ストローク: #cba982;ストローク幅: 2; rx: 16; }
  .accent { 塗りつぶし: #c66b43; }
  .accent2 { 塗りつぶし: #5a8a8a; }
  .accent3 { 塗りつぶし: #7a5c9b; }
  .line { ストローク: #b48a60;ストローク幅: 4;ストロークラインキャップ: 丸; }
</style>

<rect class="bg" width="100%" height="100%"/>

<text x="50" y="60" class="title">日本のオフライン再始動に向けた3つのモデル</text>
<text x="50" y="92" class="subtitle">2022年のジャパンラインには、大規模な専門ホテルイベント、敷居の低い交流会、主流会議の公共ルールガバナンスが含まれる</text>
<rect x="70" y="145" width="330" height="280" class="card"/>
<text x="105" y="190" class="label">キグルミwasshoi! 19</text>
<text x="105" y="225" class="small">ホテル、ロビー、プール、教会</text>
<text x="105" y="250" class="small">stage、dealer、写真撮影サービス</text>
<text x="105" y="275" class="small">コンタクト/写真撮影のpassはありますか?</text>
<text x="105" y="300" class="small">宿泊フロアと夜景</text>
<text x="105" y="335" class="tiny">キーワード: 専門的な活動の統合</text>
<rect x="435" y="145" width="330" height="280" class="soft"/>
<text x="470" y="190" class="label">着ぐFesta 最初の回</text>
<text x="470" y="225" class="small">荒川区小ホール</text>
<text x="470" y="250" class="small">一般参加者24名</text>
<text x="470" y="275" class="small">白黒背景・フリーコミュニケーション</text>
<text x="470" y="300" class="small">「まずやってみて、それからフィードバックを聞く」</text>
<text x="470" y="335" class="tiny">キーワード：敷居の低さ、新規参入者向け</text>
<rect x="800" y="145" width="330" height="280" class="card"/>
<text x="835" y="190" class="label">WCS2022</text>
<text x="835" y="225" class="small">20周年/現実舞台への帰還</text>
<text x="835" y="250" class="small">公共空間は一般の訪問者と共有されます</text>
<text x="835" y="275" class="small">熱中症、COVID、撮影承諾</text>
<text x="835" y="300" class="small">衣服の過熱をスタッフが停止できる</text>
<text x="835" y="335" class="tiny">キーワード: 主流大会のガバナンス</text>

</svg>