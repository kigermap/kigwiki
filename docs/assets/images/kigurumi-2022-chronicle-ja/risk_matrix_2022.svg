<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img">

<style>
  .bg { 塗りつぶし: #fffaf3; }
  .title { font: 700 34px 'Noto Sans CJK JP','Hiragino Sans','Yu Gothic',Arial,sans-serif;塗りつぶし: #2b2118; }
  .subtitle { font: 400 17px 'Noto Sans CJK JP','Hiragino Sans','Yu Gothic',Arial,sans-serif;塗りつぶし: #64564a; }
  .label { font: 700 18px 'Noto Sans CJK JP','Hiragino Sans','Yu Gothic',Arial,sans-serif;塗りつぶし: #2b2118; }
  .small { font: 400 14px 'Noto Sans CJK JP','Hiragino Sans','Yu Gothic',Arial,sans-serif;塗りつぶし: #4c4037; }
  .tiny { font: 400 12px 'Noto Sans CJK JP','Hiragino Sans','Yu Gothic',Arial,sans-serif;塗りつぶし: #6a5a4c; }
  .card { 塗りつぶし: #ffffff;ストローク: #d8c4aa;ストローク幅: 2; rx: 16; }
  .soft { 塗りつぶし: #f3e1c8;ストローク: #cba982;ストローク幅: 2; rx: 16; }
  .accent { 塗りつぶし: #c66b43; }
  .accent2 { 塗りつぶし: #5a8a8a; }
  .accent3 { 塗りつぶし: #7a5c9b; }
  .line { ストローク: #b48a60;ストローク幅: 4;ストロークラインキャップ: 丸; }
</style>

<rect class="bg" width="100%" height="100%"/>

<text x="50" y="60" class="title">2022 年のリスク ガバナンス マトリックス</text>
<text x="50" y="92" class="subtitle">今年最も重要な「負の歴史」は、ある不祥事ではなく、大会規定に公に書かれるリスクだ。</text>
<rect x="80" y="130" width="320" height="110" class="card"/><text x="110" y="172" class="label">COVID と温度チェック</text><text x="110" y="205" class="small">WCS：マスク、体温、消毒、楽屋内での雑談禁止</text>
<rect x="440" y="130" width="320" height="110" class="soft"/><text x="470" y="172" class="label">熱中症と脱水症状</text><text x="470" y="205" class="small">水分補給、休憩、冷却用品。衣服の過熱を防ぐことができます</text>
<rect x="800" y="130" width="320" height="110" class="card"/><text x="830" y="172" class="label">写真撮影の同意</text><text x="830" y="205" class="small">盗撮、ローアングル、または長時間の占有は許可されません。アップロードには許可が必要です</text>
<rect x="80" y="275" width="320" height="110" class="soft"/><text x="110" y="317" class="label">境界線に触れる</text><text x="110" y="350" class="small">わっしょい：passの色で接触・撮影可能かどうかがわかる</text>
<rect x="440" y="275" width="320" height="110" class="card"/><text x="470" y="317" class="label">水と敷地</text><text x="470" y="350" class="small">スイミングプールエリアへの水の侵入とドローンの使用は禁止されており、機器は安定している必要があります</text>
<rect x="800" y="275" width="320" height="110" class="soft"/><text x="830" y="317" class="label">噂と匿名フィールド</text><text x="830" y="350" class="small">名前はリストされていません。コミュニティのガバナンス圧力のみが記録される</text>

</svg>