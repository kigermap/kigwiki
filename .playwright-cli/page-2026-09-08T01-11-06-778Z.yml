            - paragraph [ref=f4e267]:
              - text: Bilibili 公開中繼資料把《一個 kigurumi 大頭的列印過程～》標為 9 月 2 日 00:44 發布，發布者為「一個人在江邊」，時長 52 秒；簡介寫明「創想 K1 Max 製作」，標籤包含
              - code [ref=f4e268]: 手工
              - text: 、
              - code [ref=f4e269]: DIY
              - text: 、
              - code [ref=f4e270]: kigurumi
              - text: 與
              - code [ref=f4e271]: kig
              - text: 。
              - superscript [ref=f4e272]:
                - link "1" [ref=f4e273] [cursor=pointer]:
                  - /url: "#fn:bili-sep2"
              - text: 這些欄位足以把它歸入工坊 / 手工線索，並確認影片展示列印過程。公開欄位未說明耗材、壁厚、分件、後處理、模型授權或完整製作鏈，因此本站不把短片擴寫為教學、參數建議或工坊檔案。
            - paragraph [ref=f4e274]:
              - text: 同一接口把《五層也太緊了，必須得緩一緩【kigurumi】》標為 9 月 2 日 00:55 發布，發布者為 Naganohara_Mio_，時長 44 秒，標籤包含
              - code [ref=f4e275]: 生活記錄
              - text: 、
              - code [ref=f4e276]: Cosplay
              - text: 與
              - code [ref=f4e277]: kigurumi
              - text: ；簡介只有連字號。
              - superscript [ref=f4e278]:
                - link "1" [ref=f4e279] [cursor=pointer]:
                  - /url: "#fn:bili-sep2"
              - text: 這可作當月穿戴日常與舒適度提醒，但標題不足以確定五層分別是什麼、緊繃程度、環境溫度或生理影響。本頁只保留發布者個人體驗，不產生醫學結論或統一穿戴上限。
