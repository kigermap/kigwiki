              - text: 這足以確認一段以北京溫榆河露營外拍為主題的公開影片。影片簡介為空，無法確認外拍實際日期、參與人數、召集方、許可或路線，因此不寫成正式活動通告或規模統計。
            - paragraph [ref=f4e302]:
              - text: 《第一次變娃出勤喵》於 9 月 4 日 20:04 發布，時長 2 分 38 秒，標籤包含
              - code [ref=f4e303]: MAIMAI
              - text: 與
              - code [ref=f4e304]: kig
              - text: ，簡介為連字號。
              - superscript [ref=f4e305]:
                - link "3" [ref=f4e306] [cursor=pointer]:
                  - /url: "#fn:bili-sep3-5"
              - text: 本頁僅把它作為一名發布者自述的首次出勤紀錄，保留「新人經驗與街機娛樂相遇」這一最低限度資訊，不推斷地點、協助者、穿戴時長或所有新人的共同路徑。
            - heading [level=3] [ref=f4e307]:
              - text: 9 月 5 日：膠衣製作進度與頭殼工坊署名
              - link "¶" [ref=f4e308] [cursor=pointer]:
                - /url: "#9-5"
            - paragraph [ref=f4e309]:
              - text: 《膠衣主體做好啦》於 9 月 5 日 18:41 發布，發布者為 Maddie62，時長 1 分 30 秒；簡介寫「今天繼續做個腳套」，標籤包含
              - code [ref=f4e310]: DIY
              - text: 、
              - code [ref=f4e311]: kigurumi
              - text: 、
              - code [ref=f4e312]: 膠衣
              - text: 與
              - code [ref=f4e313]: kig
              - text: 。
              - superscript [ref=f4e314]:
                - link "3" [ref=f4e315] [cursor=pointer]:
                  - /url: "#fn:bili-sep3-5"
              - text: 這些欄位支持「主體完成、腳套繼續製作」的階段性紀錄，但未提供膠料、厚度、黏接、密封、活動餘量或測試結果，故不擴寫成製作教學。
            - paragraph [ref=f4e316]:
              - text: 同日 20:28 發布的《這是貓啊！？？？【kigurumi】》在簡介中明確寫「頭殼：星塵 kigurumi 工坊」，標籤包含
              - code [ref=f4e317]: kigurumi
              - text: 與
              - code [ref=f4e318]: kig
              - text: 。
              - superscript [ref=f4e319]:
                - link "3" [ref=f4e320] [cursor=pointer]:
                  - /url: "#fn:bili-sep3-5"
              - text: 這可以建立公開影片中的作品歸屬，但短片不提供型號、委託流程、價格、交期或性能資訊，本站不據此產生產品評測或工坊百科。
            - heading [level=3] [ref=f4e321]:
              - text: 9 月 6 日：反光塗層測試與南京高層外拍
              - link "¶" [ref=f4e322] [cursor=pointer]:
                - /url: "#9-6"
            - paragraph [ref=f4e323]:
              - text: Bilibili 公開中繼資料把《[kigurumi]全身反光塗層測試》標為 9 月 6 日 19:39 發布，發布者為「奇數米飯」，時長 19 秒，標籤包含
              - code [ref=f4e324]: 服飾
              - text: 、
              - code [ref=f4e325]: 外景
              - text: 、
              - code [ref=f4e326]: kigurumi
              - text: 與
              - code [ref=f4e327]: dollmask
              - text: 。簡介寫「就是機體溫度有點高」，並以圖示列出攝影
              - code [ref=f4e328]: "@泡芙芙"
              - text: 、面具
              - code [ref=f4e329]: "@DOLL UP"
              - text: 和服裝
              - code [ref=f4e330]: "@海苔喵嗚"
              - text: 。
              - superscript [ref=f4e331]:
                - link "4" [ref=f4e332] [cursor=pointer]:
                  - /url: "#fn:bili-sep6"
              - text: 這些欄位足以確認一次公開的全身反光塗層外景測試與協作署名，也保留發布者的熱感回饋；但沒有塗層材料、反射率、光照、氣溫、穿戴時長或測溫結果，因此不能比較材料性能，也不能建立一般安全結論。
            - paragraph [ref=f4e333]:
              - text: 同日 22:54，出雲夏希CHANNEL 發布《娃娃在南京之巔》，時長 2 分 22 秒；簡介明確寫明在紫峰大廈 62 層與 45 層露台拍攝，標籤包含
              - code [ref=f4e334]: 南京
              - text: 、
              - code [ref=f4e335]: 紫峰大廈
              - text: 、
              - code [ref=f4e336]: cosplay
              - text: 與
              - code [ref=f4e337]: kigurumi
              - text: 。
              - superscript [ref=f4e338]:
                - link "4" [ref=f4e339] [cursor=pointer]:
                  - /url: "#fn:bili-sep6"
              - text: 這為 9 月新增一條地點明確的城市高層外拍紀錄，並顯示正式活動之外的 kigurumi 影像也進入觀景層與露台等商業公共場景。發布時間不能代替實際拍攝日期，公開影片也沒有說明場地方許可、路線、穿戴時長或參與人數，故不寫成正式聚會或場地使用指南。
            - heading [level=3] [ref=f4e340]:
              - text: 9 月 7 日：頭殼視野、深圳外拍、部件故障與硬質假髮過程
              - link "¶" [ref=f4e341] [cursor=pointer]:
                - /url: "#9-7"
            - paragraph [ref=f4e342]:
              - text: Hidden_is_Fun 於 02:09 發布一段 33 秒《太鼓達人》紀錄，簡介以「根本看不見一點」描述頭殼下的視野，標籤包含
              - code [ref=f4e343]: kigurumi
              - text: 、
              - code [ref=f4e344]: 音樂遊戲
              - text: 與
              - code [ref=f4e345]: 太鼓達人
              - text: 。同日 22:56，萌物の心發布 4 分 40 秒的《嘗試變娃打絕區零》，簡介稱此前玩
              - code [ref=f4e346]: Overwatch
              - text: 時因視野太差無法進行 PVP，在《絕區零》中也不易看清紅黃出招提示，需要依靠經驗應對。
              - superscript [ref=f4e347]:
                - link "5" [ref=f4e348] [cursor=pointer]:
                  - /url: "#fn:bili-sep7"
              - text: 兩段紀錄來自不同發布者和遊戲，可作為「頭殼視野會影響螢幕資訊讀取」的個人經驗線索；但沒有頭殼視窗尺寸、視野角量測、顯示設定或對照測試，因此不能得出所有頭殼、玩家或遊戲類型的共同結論。
            - paragraph [ref=f4e349]:
              - text: 11:48 發布的 29 秒影片在簡介中明確寫「9 月 6 日拍攝於深圳次元小鎮」，並署名同場的天宮心角色；標籤包含
              - code [ref=f4e350]: kigurumi
              - text: 與
              - code [ref=f4e351]: Cosplay
              - text: 。
              - superscript [ref=f4e352]:
                - link "5" [ref=f4e353] [cursor=pointer]:
                  - /url: "#fn:bili-sep7"
              - text: 這段資料同時提供實際拍攝日和地點，比只有發布時間的外拍紀錄更完整，但仍未說明場地方許可、參與人數、路線或活動組織者，故只作為城市外拍與協作紀錄，不建立正式活動條目。
            - paragraph [ref=f4e354]:
              - text: 13:33，Neo雪待發布《在電玩區自拍的乳膠小羊》，簡介稱裙內電池盒已經外露，後來在夜場跳舞時斷裂，標籤包含
              - code [ref=f4e355]: DW14
              - text: 、
              - code [ref=f4e356]: 膠衣
              - text: 、
              - code [ref=f4e357]: kigurumi
              - text: 與
              - code [ref=f4e358]: 舞萌
              - text: 。
              - superscript [ref=f4e359]:
                - link "5" [ref=f4e360] [cursor=pointer]:
                  - /url: "#fn:bili-sep7"
              - text: 這是一次具體的穿戴部件故障自述，可提醒活動影像之外還有固定、拉扯與維護問題；但沒有電池用途、安裝方式、受力位置、維修結果或主辦方報告，不能寫成 DW14 事故統計或普遍產品缺陷。
            - paragraph [ref=f4e361]:
              - text: 23:53，是點點__發布 1 分 13 秒的《kigurumi新人第一次做硬質假髮的一些過程》，標籤包含
              - code [ref=f4e362]: 手工
              - text: 、
              - code [ref=f4e363]: 製作
              - text: 、
              - code [ref=f4e364]: 新人
              - text: 、
              - code [ref=f4e365]: 假髮
              - text: 與
              - code [ref=f4e366]: kigurumi
              - text: 。
              - superscript [ref=f4e367]:
                - link "5" [ref=f4e368] [cursor=pointer]:
                  - /url: "#fn:bili-sep7"
              - text: 標題和標籤足以確認這是新人視角的硬質假髮過程展示，簡介僅為連字號，不能據此補寫基材、膠黏劑、分片、固定方式、耗時或耐用性；因此保留為工坊 / 手工線索，不改寫成教學。
            - heading [level=2] [ref=f4e369]:
              - text: 已過濾的重複與弱訊號
              - link "¶" [ref=f4e370] [cursor=pointer]:
                - /url: "#_2"
            - list [ref=f4e371]:
              - listitem [ref=f4e372]: 9 月 2 日新增的 DW14 鏡頭簽與看板娘互動短片仍屬 8 月已整理的同一活動回顧，沒有新增規則、節目單或主辦方閉幕統計，故不建立重複事件。
              - listitem [ref=f4e373]:
                - text: 9 月 3 日一段「變娃第一步，穿上皮膚」影片的公開欄位只有服飾、穿搭與
                - code [ref=f4e374]: zentai
                - text: 等標籤，且標記為專享內容；目前證據不能確認完整 kigurumi 角色語境或穿戴流程，故不提升為獨立條目。
              - listitem [ref=f4e375]: 9 月 4—5 日出現的喝水玩笑、生日紀錄、虛構婚禮、無說明「新頭」與純站姿短片，只能證明個人內容發布，不能支持安全規範、正式活動、工坊檔案或產業趨勢，故不單列。
              - listitem [ref=f4e376]: 9 月 6 日新增的 DW14 回顧、T 台片段與 360 度逛展影片仍指向 8 月已整理的同一活動，沒有新增主辦方規則或閉幕統計；其中標題裡的「1000 隻」等問句沒有主辦方口徑支持，不作為人數資料。
              - listitem [ref=f4e377]: 同日的生日聚會、純造型展示、工坊成品短片和「頭殼內部會怎樣」等標題型內容缺少過程參數或可核驗結論，不單獨提升為活動、工坊或安全條目。
              - listitem [ref=f4e378]: 9 月 7—8 日出現的 DW14 首次參與感想、小遊戲、舞萌與夜場片段，以及紫峰大廈的後續視角，仍屬已記錄活動或拍攝的回顧。除電池盒故障自述外，它們沒有新增主辦方統計、規則或場景，因此不重複建立事件。
              - listitem [ref=f4e379]: 「老頭殼爆改新頭殼」、頭殼介紹、眨眼展示與一般造型影片的公開欄位沒有材料、結構、控制方式或測試資料；長沙夜間同行紀錄只到城市與協作署名，均不足以建立工坊檔案、技術結論或正式活動。
              - listitem [ref=f4e380]: 只有造型展示、單圖或無上下文鏡頭互動的短片不自動進入月度頁；出現製作參數、活動事實或可核驗討論時再更新。
              - listitem [ref=f4e381]: Niconico 在截止窗內沒有直接相關新增；YouTube 結果只有日常造型、DW14 鏡頭簽重複內容和尚未開播的預約直播。Bluesky 與 Reddit 本次網路不可達，因此不以舊內容、預約頁或不可存取結果填充國際條目。
