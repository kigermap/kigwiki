            - paragraph [ref=f4e417]: 十三條去重紀錄涵蓋製作過程、工坊歸屬、個人穿戴、新人出勤、個人複盤、工藝測試、三地外拍、部件維護與遊戲視野經驗。現有月度摘要足以承載，不建立獨立工坊、安全、人物或活動板塊。若後續出現正式活動頁、可重現參數、材料與授權說明、具有量測方法的穿戴研究或可核驗的社群調查，將更新原來源鏈而非複製條目。
