            - paragraph [ref=f3e425]: Тринадцать записей после удаления повторов охватывают изготовление, атрибуцию мастерской, личное ношение, первый выход, ретроспективу, испытание процесса, съемку в трех городах, обслуживание деталей и обзор в играх. Ежемесячной подборки достаточно; отдельные разделы мастерской, безопасности, людей или событий не создаются. Официальная страница события, воспроизводимые параметры, сведения о материалах и лицензии, исследование ношения с методом измерения или проверяемый опрос смогут обновить исходную цепочку без повторов.
