              - text: Это подтверждает публичный ролик о лагерной фотосъемке у реки Вэньюй. Пустое описание не устанавливает фактическую дату съемки, число участников, инициатора, разрешения или маршрут, поэтому запись не представлена как официальное объявление или статистика масштаба.
            - paragraph [ref=f3e307]:
              - text: «Первый выход в kigurumi» опубликован 4 сентября в 20:04, длится 2 минуты 38 секунд и имеет теги
              - code [ref=f3e308]: MAIMAI
              - text: и
