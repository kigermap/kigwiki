            - paragraph [ref=f3e314]:
              - text: Ролик Maddie62 «Основная часть латексного костюма готова» опубликован 5 сентября в 18:41 и длится 1 минуту 30 секунд. В описании сказано о продолжении работы над накладками для стоп, а теги включают
              - code [ref=f3e315]: DIY
              - text: ","
              - code [ref=f3e316]: kigurumi
              - text: ","
              - code [ref=f3e317]: латексный костюм
              - text: и
              - code [ref=f3e318]: kig
              - text: .
              - superscript [ref=f3e319]:
                - link "3" [ref=f3e320] [cursor=pointer]:
                  - /url: "#fn:bili-sep3-5"
              - text: Эти поля подтверждают стадию изготовления, но не раскрывают состав, толщину, склейку, герметизацию, свободу движений или испытания, поэтому ролик не превращается в руководство.
            - paragraph [ref=f3e321]:
              - text: В описании опубликованного в тот же день в 20:28 ролика «Это кот?! [kigurumi]» показанная голова прямо приписана мастерской 星尘 kigurumi 工坊, а теги включают
              - code [ref=f3e322]: kigurumi
              - text: и
              - code [ref=f3e323]: kig
              - text: .
              - superscript [ref=f3e324]:
                - link "3" [ref=f3e325] [cursor=pointer]:
                  - /url: "#fn:bili-sep3-5"
              - text: Публичная атрибуция подтверждается, но ролик не сообщает модель, порядок заказа, цену, срок изготовления или характеристики. Он не считается обзором продукта или полным профилем мастерской.
            - heading [level=3] [ref=f3e326]:
              - text: "6 сентября: испытание светоотражающего покрытия и высотная съемка в Нанкине"
              - link "¶" [ref=f3e327] [cursor=pointer]:
                - /url: "#6"
            - paragraph [ref=f3e328]:
              - text: Публичные метаданные Bilibili датируют «[kigurumi] Испытание полнотелого светоотражающего покрытия» 6 сентября, 19:39, называют автором 奇数米饭, указывают длительность 19 секунд и теги
              - code [ref=f3e329]: одежда
              - text: ","
              - code [ref=f3e330]: съемка на природе
              - text: ","
              - code [ref=f3e331]: kigurumi
              - text: и
              - code [ref=f3e332]: dollmask
              - text: . В описании сказано, что «температура тела немного высокая», а значками отмечены фотограф
              - code [ref=f3e333]: "@泡芙芙"
              - text: ", маска"
              - code [ref=f3e334]: "@DOLL UP"
              - text: и одежда
              - code [ref=f3e335]: "@海苔喵呜"
              - text: .
              - superscript [ref=f3e336]:
                - link "4" [ref=f3e337] [cursor=pointer]:
                  - /url: "#fn:bili-sep6"
              - text: Эти поля подтверждают публичное испытание на природе, атрибуцию совместной работы и личное ощущение тепла. Материал покрытия, отражательная способность, освещение, температура воздуха, длительность ношения и результат измерения не указаны, поэтому ролик не позволяет сравнивать материалы или формулировать общий вывод о безопасности.
            - paragraph [ref=f3e338]:
              - text: В 22:54 того же дня 出云夏希CHANNEL опубликовал 2-минутный 22-секундный ролик «Кукла на вершине Нанкина». Описание прямо называет местами съемки 62-й этаж и террасу 45-го этажа башни Zifeng, а теги включают
              - code [ref=f3e339]: Нанкин
              - text: ","
              - code [ref=f3e340]: башню Zifeng
              - text: ","
              - code [ref=f3e341]: cosplay
              - text: и
              - code [ref=f3e342]: kigurumi
              - text: .
              - superscript [ref=f3e343]:
                - link "4" [ref=f3e344] [cursor=pointer]:
                  - /url: "#fn:bili-sep6"
              - text: Это добавляет в сентябрь точно локализованную городскую высотную съемку и показывает присутствие образов kigurumi на смотровом этаже и террасе вне официального события. Время публикации не определяет дату съемки; разрешение площадки, маршрут, длительность ношения и число участников не сообщаются, поэтому запись не представлена как официальная встреча или руководство по использованию площадки.
            - heading [level=3] [ref=f3e345]:
              - text: "7 сентября: обзор из головы, съемка в Шэньчжэне, отказ детали и жесткий парик"
              - link "¶" [ref=f3e346] [cursor=pointer]:
                - /url: "#7"
            - paragraph [ref=f3e347]:
              - text: В 02:09 Hidden_is_Fun опубликовал 33-секундную запись
              - emphasis [ref=f3e348]: Taiko no Tatsujin
              - text: ", где описание говорит, что в голове практически ничего не видно; теги включают"
              - code [ref=f3e349]: kigurumi
              - text: ","
              - code [ref=f3e350]: музыкальную игру
              - text: и
              - code [ref=f3e351]: Taiko no Tatsujin
              - text: . В 22:56 萌物の心 опубликовал 4-минутный 40-секундный ролик «尝试变娃打绝区零». В описании сказано, что ограниченный обзор ранее делал PVP в
              - code [ref=f3e352]: Overwatch
              - text: непрактичным, а в
              - emphasis [ref=f3e353]: Zenless Zone Zero
              - text: мешал различать красные и желтые сигналы атак, поэтому приходилось полагаться на опыт.
              - superscript [ref=f3e354]:
                - link "5" [ref=f3e355] [cursor=pointer]:
                  - /url: "#fn:bili-sep7"
              - text: Два независимых самоотчета дают материал о влиянии обзора из головы на чтение экранной информации. Размер окна, измеренный угол обзора, настройки дисплея и контрольный тест не приведены, поэтому результат нельзя распространять на все головы, игроков и виды игр.
            - paragraph [ref=f3e356]:
              - text: Описание 29-секундного ролика, опубликованного в 11:48, прямо говорит, что он «снят 6 сентября в Shenzhen Ciyuan Town», и отмечает присутствовавшего персонажа 天宫心; теги включают
              - code [ref=f3e357]: kigurumi
              - text: и
              - code [ref=f3e358]: Cosplay
              - text: .
              - superscript [ref=f3e359]:
                - link "5" [ref=f3e360] [cursor=pointer]:
                  - /url: "#fn:bili-sep7"
              - text: Фактическая дата съемки и названное место делают запись полнее съемок, известных только по времени публикации. Разрешение площадки, число участников, маршрут и организатор не указаны, поэтому это запись о городской съемке и совместной работе, а не официальное событие.
            - paragraph [ref=f3e361]:
              - text: В 13:33 Neo雪待 опубликовал «在电玩区自拍的乳胶小羊». В описании сказано, что батарейный блок под юбкой уже был виден, а затем сломался во время танца в ночной программе; теги включают
              - code [ref=f3e362]: DW14
              - text: ","
              - code [ref=f3e363]: латексный костюм
              - text: ","
              - code [ref=f3e364]: kigurumi
              - text: и
              - code [ref=f3e365]: MAIMAI
              - text: .
              - superscript [ref=f3e366]:
                - link "5" [ref=f3e367] [cursor=pointer]:
                  - /url: "#fn:bili-sep7"
              - text: Это конкретный личный отчет об отказе носимой детали и напоминание о креплении, нагрузке и обслуживании за пределами красивых кадров события. Назначение батареи, способ крепления, точка нагрузки, ремонт и отчет организатора отсутствуют, поэтому запись не становится статистикой происшествий DW14 или заявлением об общем дефекте продукта.
            - paragraph [ref=f3e368]:
              - text: В 23:53 是點點__ опубликовал 1-минутный 13-секундный ролик «kigurumi新人第一次做硬质假发的一些过程» с тегами
              - code [ref=f3e369]: ручная работа
              - text: ","
              - code [ref=f3e370]: изготовление
              - text: ","
              - code [ref=f3e371]: новичок
              - text: ","
              - code [ref=f3e372]: парик
              - text: и
              - code [ref=f3e373]: kigurumi
              - text: .
              - superscript [ref=f3e374]:
                - link "5" [ref=f3e375] [cursor=pointer]:
                  - /url: "#fn:bili-sep7"
              - text: Заголовок и теги подтверждают демонстрацию процесса изготовления жесткого парика с точки зрения новичка. Описание состоит из дефиса, поэтому нельзя дополнить данные об основе, клее, секциях, креплении, времени работы или долговечности; материал остается мастерским сигналом, а не руководством.
            - heading [level=2] [ref=f3e376]:
              - text: Отфильтрованные повторы и слабые сигналы
              - link "¶" [ref=f3e377] [cursor=pointer]:
                - /url: "#_2"
            - list [ref=f3e378]:
              - listitem [ref=f3e379]: Опубликованные 2 сентября фрагменты с подписью в объектив и взаимодействием с маскотом DW14 относятся к тому же августовскому событию и не добавляют правило, программу или итоговую статистику организатора, поэтому не становятся новыми событиями.
              - listitem [ref=f3e380]:
                - text: У ролика от 3 сентября «Первый шаг
                - code [ref=f3e381]: 变娃
                - text: ": надеть кожу» публичные теги ограничены одеждой, стилем и"
                - code [ref=f3e382]: zentai
                - text: ", а сам материал отмечен как эксклюзивный. Доступные данные не подтверждают полный контекст персонажа kigurumi или процесс надевания, поэтому отдельная запись не создаётся."
              - listitem [ref=f3e383]: Шутка о питье, запись дня рождения, вымышленная свадьба, необъясненная «новая голова» и ролики только с позированием от 4–5 сентября подтверждают личные публикации, но не правило безопасности, официальное событие, профиль мастерской или отраслевую тенденцию, поэтому отдельно не записываются.
              - listitem [ref=f3e384]: Ретроспективы DW14, фрагмент подиума и 360-градусная прогулка по событию от 6 сентября относятся к тому же августовскому событию. Они не добавляют правило или итоговую статистику организатора; вопросительные формулировки вроде «1000 кукол» не считаются данными о посещаемости без подтверждения организатора.
              - listitem [ref=f3e385]: Опубликованные в тот же день материалы о дне рождения, только образах, готовых работах мастерской и вопросе «что внутри головы после нескольких часов» не содержат параметров процесса или проверяемых выводов, поэтому не становятся отдельными событиями, профилями мастерских или записями о безопасности.
              - listitem [ref=f3e386]: Реакции впервые посетивших DW14, мини-игры, музыкальные игры и фрагменты ночной программы от 7–8 сентября, а также дополнительные ракурсы съемки в башне Zifeng относятся к уже записанному событию или съемке. Кроме отчета о батарейном блоке, они не добавляют статистику организатора, правило или новую сцену и не становятся повторными событиями.
              - listitem [ref=f3e387]: Публичные поля роликов о «переделке старой головы в новую», обзоре головы, демонстрации моргания и обычных образах не содержат материалов, структуры, способа управления или испытаний. Ночная съемка в Чанше подтверждает только город и авторство совместной работы, чего недостаточно для профиля мастерской, технического вывода или официального события.
              - listitem [ref=f3e388]: Ролики только с образом, одиночные изображения и взаимодействия с камерой без контекста не входят автоматически. Процессные параметры, факты события или проверяемая дискуссия смогут продолжить исходную цепочку.
              - listitem [ref=f3e389]: Niconico не дал прямо связанного добавления в пределах срока. Результаты YouTube ограничились повседневными образами, повтором подписи в объектив на DW14 и запланированными трансляциями, которые еще не начались. Bluesky и Reddit были недоступны по сети, поэтому старые материалы, страницы ожидания и недоступные результаты не использованы для заполнения международного раздела.
