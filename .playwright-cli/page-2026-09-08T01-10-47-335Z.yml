            - heading [level=3] [ref=f3e268]:
              - text: "2 сентября: печать головы и опыт многослойного ношения"
              - link "¶" [ref=f3e269] [cursor=pointer]:
                - /url: "#2"
            - paragraph [ref=f3e270]:
              - text: Публичные метаданные Bilibili датируют «Процесс печати большой головы kigurumi» 2 сентября, 00:44, называют автором 一个人在江边 и указывают длительность 52 секунды. В описании сказано об изготовлении на Creality K1 Max, а теги включают
              - code [ref=f3e271]: ручную работу
              - text: ","
              - code [ref=f3e272]: DIY
              - text: ","
              - code [ref=f3e273]: kigurumi
              - text: и
              - code [ref=f3e274]: kig
              - text: .
              - superscript [ref=f3e275]:
                - link "1" [ref=f3e276] [cursor=pointer]:
                  - /url: "#fn:bili-sep2"
              - text: Это позволяет отнести запись к мастерской и подтвердить, что ролик показывает печать. Поля не раскрывают пластик, толщину стенок, разбиение, постобработку, разрешение модели или полную производственную цепочку, поэтому ролик не превращается в учебник, совет по настройкам или профиль мастерской.
            - paragraph [ref=f3e277]:
              - text: Тот же интерфейс датирует «Пять слоев слишком тесные, пришлось передохнуть [kigurumi]» 2 сентября, 00:55, называет автором Naganohara_Mio_ и указывает 44 секунды. Теги включают
              - code [ref=f3e278]: запись жизни
              - text: ","
              - code [ref=f3e279]: Cosplay
              - text: и
              - code [ref=f3e280]: kigurumi
              - text: ", а описание состоит из дефиса."
              - superscript [ref=f3e281]:
                - link "1" [ref=f3e282] [cursor=pointer]:
                  - /url: "#fn:bili-sep2"
              - text: Запись остается сигналом повседневности и личного комфорта. По заголовку нельзя определить состав пяти слоев, степень сжатия, температуру среды или физиологическое влияние; медицинский вывод и универсальный предел слоев не создаются.
            - heading [level=3] [ref=f3e283]:
              - text: "2 сентября, 22:50: личная ретроспектива более чем года в"
              - code [ref=f3e284]: 变娃
              - link "¶" [ref=f3e285] [cursor=pointer]:
                - /url: "#2-2250"
            - paragraph [ref=f3e286]:
              - text: Публичные метаданные Bilibili датируют «Как неудачная фигурка превратилась в изящную куклу — итоги более года в
              - code [ref=f3e287]: 变娃
              - text: » 2 сентября, 22:50, называют автором 停定の钟 и указывают длительность 4 минуты 47 секунд. Теги включают
              - code [ref=f3e288]: итоги
              - text: ","
              - code [ref=f3e289]: 变娃
              - text: ","
              - code [ref=f3e290]: обобщение опыта
              - text: ","
              - code [ref=f3e291]: kigurumi
              - text: и
              - code [ref=f3e292]: Моя история Kigurumi
              - text: .
              - superscript [ref=f3e293]:
                - link "2" [ref=f3e294] [cursor=pointer]:
                  - /url: "#fn:bili-retrospective"
              - text: Эти поля подтверждают годовую ретроспективу, ограниченную опытом одного участника, и позволяют отнести её к повседневности, заметкам и опыту участия.
            - paragraph [ref=f3e295]: Публичное описание состоит только из дефиса. Контраст «до и после» — собственная характеристика автора; он сам по себе не определяет использованные маски, мастерские, материалы или этапы обучения и не представляет типичный путь сообщества. Подборка фиксирует появление личной публичной ретроспективы, но не переписывает её как учебник, обзор продукта или статистику тенденций.
            - heading [level=3] [ref=f3e296]:
              - text: "3–4 сентября: лагерная фотосъемка в Пекине и первый выход"
              - link "¶" [ref=f3e297] [cursor=pointer]:
