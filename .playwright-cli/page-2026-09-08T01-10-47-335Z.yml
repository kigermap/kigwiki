              - superscript [ref=f3e310]:
                - link "3" [ref=f3e311] [cursor=pointer]:
                  - /url: "#fn:bili-sep3-5"
              - text: Подборка фиксирует только личный первый выход по словам автора и минимальный факт пересечения опыта новичка с аркадной ритм-игрой. Место, помощник, длительность ношения и универсальный путь новичка не выводятся.
            - heading [level=3] [ref=f3e312]:
              - text: "5 сентября: работа над латексным костюмом и атрибуция головы"
