            - paragraph [ref=f1e270]:
              - text: Bilibili's public metadata dates “A kigurumi big-head printing process” to September 2 at 00:44, names 一个人在江边 as publisher, and gives a duration of 52 seconds. The description says it was made with a Creality K1 Max, while tags include
              - code [ref=f1e271]: handmade
              - text: ","
              - code [ref=f1e272]: DIY
              - text: ","
              - code [ref=f1e273]: kigurumi
              - text: ", and"
              - code [ref=f1e274]: kig
              - text: .
              - superscript [ref=f1e275]:
                - link "1" [ref=f1e276] [cursor=pointer]:
                  - /url: "#fn:bili-sep2"
              - text: These fields support classification as a workshop / craft lead and establish that the public video shows printing. They do not identify filament, wall thickness, part layout, post-processing, model permission, or the complete production chain, so this archive does not turn the clip into a tutorial, parameter recommendation, or workshop profile.
            - paragraph [ref=f1e277]:
              - text: The same public interface dates “Five layers were too tight; I had to slow down [kigurumi]” to September 2 at 00:55, names Naganohara_Mio_ as publisher, and gives a duration of 44 seconds. Tags include
              - code [ref=f1e278]: life record
              - text: ","
              - code [ref=f1e279]: Cosplay
              - text: ", and"
              - code [ref=f1e280]: kigurumi
              - text: ; the description is only a hyphen.
              - superscript [ref=f1e281]:
                - link "1" [ref=f1e282] [cursor=pointer]:
                  - /url: "#fn:bili-sep2"
              - text: It is retained as a monthly daily-life and comfort signal. The title cannot establish what the five layers were, degree of compression, ambient temperature, or physiological effect, so no medical conclusion or universal layer limit is inferred.
            - heading [level=3] [ref=f1e283]:
              - text: "September 2, 22:50: a personal retrospective on more than a year of doll transformation"
