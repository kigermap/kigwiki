                - link "4" [ref=f1e343] [cursor=pointer]:
                  - /url: "#fn:bili-sep6"
              - text: This adds a precisely located urban high-rise shoot to September and shows kigurumi imagery entering an observation level and terrace outside a formal event. Publication time does not establish the shoot date, and the public record does not state venue permission, route, wear duration, or attendance; it is therefore not presented as a formal gathering or venue-use guide.
            - heading [level=3] [ref=f1e344]:
              - text: "September 7: head visibility, a Shenzhen shoot, component failure, and a hard-wig process"
              - link "¶" [ref=f1e345] [cursor=pointer]:
                - /url: "#september-7-head-visibility-a-shenzhen-shoot-component-failure-and-a-hard-wig-process"
            - paragraph [ref=f1e346]:
              - text: At 02:09, Hidden_is_Fun published a 33-second
              - emphasis [ref=f1e347]: Taiko no Tatsujin
              - text: record whose description says visibility in the head was effectively absent; tags include
              - code [ref=f1e348]: kigurumi
              - text: ","
              - code [ref=f1e349]: rhythm game
              - text: ", and"
              - code [ref=f1e350]: Taiko no Tatsujin
              - text: . At 22:56, 萌物の心 published the 4-minute 40-second “Trying to play Zenless Zone Zero as a doll.” Its description says limited vision had made
              - code [ref=f1e351]: Overwatch
              - text: PVP impractical and also made red and yellow attack cues in
              - emphasis [ref=f1e352]: Zenless Zone Zero
              - text: difficult to read, requiring reliance on experience.
              - superscript [ref=f1e353]:
                - link "5" [ref=f1e354] [cursor=pointer]:
                  - /url: "#fn:bili-sep7"
              - text: These independent self-reports support an individual-experience lead about head visibility affecting screen-information reading. Neither provides visor dimensions, measured field of view, display settings, or a control test, so they do not establish one result for all heads, players, or game types.
            - paragraph [ref=f1e355]:
              - text: A 29-second video published at 11:48 explicitly says in its description that it was “filmed September 6 at Shenzhen Ciyuan Town” and credits the Tian Gong Xin character present; tags include
              - code [ref=f1e356]: kigurumi
              - text: and
              - code [ref=f1e357]: Cosplay
              - text: .
              - superscript [ref=f1e358]:
                - link "5" [ref=f1e359] [cursor=pointer]:
                  - /url: "#fn:bili-sep7"
              - text: Because it gives an actual shoot date and named place, the record is more complete than a photoshoot identified only by publication time. It still does not establish venue permission, attendance, route, or organizer, so it remains an urban-photography and collaboration record rather than a formal event.
            - paragraph [ref=f1e360]:
              - text: At 13:33, Neo雪待 published “Latex lamb taking a selfie in the arcade area.” The description says a battery box inside the skirt was already exposed and later broke while dancing at the night program; tags include
              - code [ref=f1e361]: DW14
              - text: ","
              - code [ref=f1e362]: latex suit
              - text: ","
              - code [ref=f1e363]: kigurumi
              - text: ", and"
              - code [ref=f1e364]: MAIMAI
              - text: .
              - superscript [ref=f1e365]:
                - link "5" [ref=f1e366] [cursor=pointer]:
                  - /url: "#fn:bili-sep7"
              - text: This is a specific personal report of a wearable-component failure and preserves a maintenance issue beyond the event imagery. It does not identify the battery's purpose, mounting method, load point, repair, or an organizer report, so it is not presented as a DW14 incident statistic or general product defect.
            - paragraph [ref=f1e367]:
              - text: At 23:53, 是點點__ published the 1-minute 13-second “A kigurumi newcomer's first hard-wig making process,” tagged
              - code [ref=f1e368]: handmade
              - text: ","
              - code [ref=f1e369]: making
              - text: ","
              - code [ref=f1e370]: newcomer
              - text: ","
              - code [ref=f1e371]: wig
              - text: ", and"
              - code [ref=f1e372]: kigurumi
              - text: .
              - superscript [ref=f1e373]:
                - link "5" [ref=f1e374] [cursor=pointer]:
                  - /url: "#fn:bili-sep7"
              - text: The title and tags establish a newcomer-oriented process showcase. The description is only a hyphen, so substrate, adhesive, sections, attachment, build time, and durability remain unknown; the item stays a workshop / craft lead rather than becoming a tutorial.
            - heading [level=2] [ref=f1e375]:
              - text: Duplicates and weak signals filtered out
              - link "¶" [ref=f1e376] [cursor=pointer]:
                - /url: "#duplicates-and-weak-signals-filtered-out"
            - list [ref=f1e377]:
              - listitem [ref=f1e378]: DW14 lens-signing and mascot-interaction clips published on September 2 remain retrospective material from the same event already documented in August. They add no rule, program, or organizer closeout statistic and do not become duplicate events.
              - listitem [ref=f1e379]:
                - text: A September 3 video titled “First step in
                - code [ref=f1e380]: 变娃
                - text: ": put on the skin” has public tags only for clothing, styling, and"
                - code [ref=f1e381]: zentai
                - text: ", and is marked exclusive. The available evidence does not establish a complete kigurumi character context or dressing process, so it is not promoted to an entry."
              - listitem [ref=f1e382]: Drinking jokes, a birthday record, a fictional wedding, an unexplained “new head,” and styling-only clips published September 4–5 establish personal uploads but not a safety rule, formal event, workshop profile, or industry trend, so they are not separate entries.
              - listitem [ref=f1e383]: DW14 retrospectives, a runway fragment, and a 360-degree event tour published September 6 still point to the same August event already documented. They add no organizer rule or closeout statistic; question-style claims such as “1,000 dolls” are not treated as attendance data without organizer support.
              - listitem [ref=f1e384]: Same-day birthday-gathering, styling-only, maker-showcase, and “what is inside the head after hours” title-only clips lack process parameters or verifiable conclusions, so they are not promoted to event, workshop, or safety entries.
              - listitem [ref=f1e385]: September 7–8 brought more DW14 first-attendee reactions, games, rhythm-game footage, and night-program clips, plus follow-up views from the Zifeng Tower shoot. Except for the battery-box maintenance report, they add no organizer statistic, rule, or new scene and do not become duplicate events.
              - listitem [ref=f1e386]: Public fields for an “old head transformed into a new head,” a head explainer, a blinking display, and ordinary styling videos provide no material, structure, control method, or test data. A Changsha night-shoot record establishes only a city and collaboration credits, so none supports a workshop profile, technical conclusion, or formal event.
              - listitem [ref=f1e387]: Styling-only clips, single-image posts, and context-free camera interactions do not automatically enter the digest. A later release with process parameters, event facts, or verifiable discussion can extend its source chain.
              - listitem [ref=f1e388]: Niconico returned no directly relevant addition in the cutoff window. YouTube results were limited to daily styling, a duplicate DW14 lens-signing clip, and scheduled streams that had not begun. Bluesky and Reddit were unreachable in this run, so old material, appointment pages, and inaccessible results were not used to fill an international entry.
            - heading [level=2] [ref=f1e389]:
              - text: Domain and section decisions
              - link "¶" [ref=f1e390] [cursor=pointer]:
                - /url: "#domain-and-section-decisions"
            - table [ref=f1e393]:
              - rowgroup [ref=f1e394]:
                - row [ref=f1e395]:
                  - columnheader "Domain" [ref=f1e396]
                  - columnheader "Assessment at September 8" [ref=f1e397]
                  - columnheader "Treatment" [ref=f1e398]
              - rowgroup [ref=f1e399]:
                - row [ref=f1e400]:
                  - cell "Chronicle" [ref=f1e401]
                  - cell "Precisely located Beijing, Nanjing, and Shenzhen shoots; only the Shenzhen record states a shoot date, and none establishes formal-event scale" [ref=f1e402]
                  - cell "Keep them as monthly leads rather than separate chronicle events" [ref=f1e403]
                - row [ref=f1e404]:
                  - cell "Daily life / discussion" [ref=f1e405]
                  - cell "Layered wear, a personal retrospective, a first outing, urban photography, and gaming visibility" [ref=f1e406]
                  - cell "Record the scope of public self-reports without a group conclusion" [ref=f1e407]
                - row [ref=f1e408]:
                  - cell "Workshop / craft" [ref=f1e409]
                  - cell "3D printing, latex body and foot-cover progress, head-maker attribution, reflective-coating testing, a hard-wig process, and a battery-box failure" [ref=f1e410]
                  - cell "Record process, attribution, test, and failure boundaries without undisclosed parameters" [ref=f1e411]
                - row [ref=f1e412]:
                  - cell "Reference / education" [ref=f1e413]
                  - cell "Process clips, attribution, a personal retrospective, and gaming experience are not a complete tutorial, review, or community trend" [ref=f1e414]
                  - cell "Preserve that evidence boundary" [ref=f1e415]
                - row [ref=f1e416]:
                  - cell "Etiquette / safety" [ref=f1e417]
                  - cell "Layer tightness, reflective-coating heat, battery-box breakage, and head visibility are individual signals without measurement or protocol" [ref=f1e418]
                  - cell "Do not create a new safety standard" [ref=f1e419]
                - row [ref=f1e420]:
                  - cell "Academic" [ref=f1e421]
                  - cell "No directly relevant September publication verified" [ref=f1e422]
                  - cell "Omit" [ref=f1e423]
            - paragraph [ref=f1e424]: The thirteen deduplicated records cover making, maker attribution, individual wearing, a newcomer outing, a personal retrospective, process testing, three-city photography, component maintenance, and gaming visibility. The monthly digest is sufficient; no separate workshop, safety, person, or event section is warranted. A formal event page, reproducible parameters, materials and license details, wearing research with a measurement method, or a verifiable community survey can later update the source chain without duplication.
