              - superscript [ref=f1e292]:
                - link "2" [ref=f1e293] [cursor=pointer]:
                  - /url: "#fn:bili-retrospective"
              - text: These fields establish a year-scale retrospective bounded to one participant and support classification under daily life, discussion, and participation experience.
            - paragraph [ref=f1e294]: The public description is only a hyphen. The before-and-after framing is the publisher's own characterization; it cannot by itself identify masks, makers, materials, or learning steps, and it does not represent a typical community pathway. This digest records the appearance of a personal public retrospective without rewriting it as a making tutorial, product review, or trend statistic.
