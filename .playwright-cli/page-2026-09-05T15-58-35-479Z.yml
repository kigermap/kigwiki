              - link "¶" [ref=f1e398] [cursor=pointer]:
                - /url: "#2022-kigurumi"
            - blockquote [ref=f1e399]:
              - paragraph [ref=f1e400]:
                - text: 编写口径：本篇承接《2025 年 Kigurumi 编年史》《2024 年 Kigurumi 编年史》《2023 年 Kigurumi 编年史》的结构，但
                - strong [ref=f1e401]: 不重复 2023、2024、2025 已经详写过的活动版本、规则更新和产业扩张
                - text: 。同一系列活动若 2022 年已经出现前置版本、独立规则、早期规模、恢复线下或首次变化，则记录其 2022 年状态；若只是后续年份已写过的成熟形态，本篇只在“去重说明”中点到为止。
            - paragraph [ref=f1e402]:
              - img "2022 年时间轴" [ref=f1e403]
            - separator [ref=f1e404]
            - heading [level=2] [ref=f1e405]:
              - text: 0. 资料边界、去重原则与可信度说明
              - link "¶" [ref=f1e406] [cursor=pointer]:
                - /url: "#0"
            - paragraph [ref=f1e407]:
              - text: 这份 2022 年编年史中的
              - strong [ref=f1e408]: kigurumi
              - text: 继续采用前几篇的广义口径：包括 animegao kigurumi / 美少女着ぐるみ / 面具型角色扮演、doller、中文“娃 / Kig / Kiger”线下活动、官方 IP 吉祥物式着ぐるみ greeting，以及大型 cosplay 活动中涉及全头套、遮面、公共空间、热中症、摄影同意和接触边界的规则文本。2025 篇已经详细解释术语，本篇不重复长篇定义，只在必要处区分“官方 mascot greeting”“爱好者 kigurumi 专门活动”“中文 Doll Weekend 娃/Kig 活动”“主流 cosplay 大会规则”四类资料。
            - paragraph [ref=f1e409]: 2022 年资料比 2023—2025 更分散，且很多中文与日文活动页面并不总是完整列出精确日期。因此，本篇采用以下可信度原则：官方活动页、主办方页面、展会规则页和媒体现场报道优先；Bilibili、X/Twitter、YouTube 等社交平台用于辅助判断活动时间、影像传播和现场气氛；匿名论坛、私域群聊、截图传闻不作为事实依据，不列具体人名，不复述未经核实指控。
            - paragraph [ref=f1e410]: 2026 年 9 月 5 日复核时，FGO、Inside Games、キグルミwasshoi!、着ぐFesta 与 Doll Weekend 的引用页面仍可公开访问。Doll Weekend 现行活动页依然没有给出 DW5—DW8 的确切举办日；本次新增的 Bilibili 元数据只能建立公开视频发布日与“活动已经结束”的时间上界，不能替代主办方尚未公开的活动日期。
            - paragraph [ref=f1e411]: 本篇与 2023—2025 篇的去重规则如下：
            - table [ref=f1e414]:
              - rowgroup [ref=f1e415]:
                - row [ref=f1e416]:
                  - columnheader "去重类型" [ref=f1e417]
                  - columnheader "2022 篇处理方式" [ref=f1e418]
              - rowgroup [ref=f1e419]:
                - row [ref=f1e420]:
                  - cell "同一系列活动在 2023—2025 继续举办" [ref=f1e421]
                  - cell "只写 2022 的首回、前置版、早期规则与当年规模，不重复后续成熟版本" [ref=f1e422]
                - row [ref=f1e423]:
                  - cell "2025 已解释的 kigurumi / animegao / doller 术语" [ref=f1e424]
                  - cell "仅保留必要口径，不重复术语长文" [ref=f1e425]
                - row [ref=f1e426]:
                  - cell "FGO、hololive、Aniplex 等官方 greeting 后续年继续存在" [ref=f1e427]
