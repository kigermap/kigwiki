            - heading [level=3] [ref=f2e265]:
              - text: 9月2日：頭部プリント工程と重ね着体験
              - link "¶" [ref=f2e266] [cursor=pointer]:
                - /url: "#92"
            - paragraph [ref=f2e267]:
              - text: Bilibili の公開メタデータは「kigurumi 大頭のプリント工程」を9月2日00:44公開、投稿者を「一个人在江边」、長さを52秒とする。説明は Creality K1 Max での制作を記し、タグには
              - code [ref=f2e268]: 手工
              - text: 、
              - code [ref=f2e269]: DIY
              - text: 、
              - code [ref=f2e270]: kigurumi
              - text: 、
              - code [ref=f2e271]: kig
              - text: がある。
              - superscript [ref=f2e272]:
                - link "1" [ref=f2e273] [cursor=pointer]:
                  - /url: "#fn:bili-sep2"
              - text: 工房 / 手作りの手掛かりとして分類し、公開動画がプリント工程を示すことは確認できる。一方、フィラメント、肉厚、分割、後処理、モデル許諾、全製作工程は説明されないため、チュートリアル、推奨設定、工房プロフィールにはしない。
            - paragraph [ref=f2e274]:
              - text: 同じ公開インターフェースは「5層はきつすぎ、少し休む必要がある【kigurumi】」を9月2日00:55公開、投稿者を Naganohara_Mio_、長さを44秒とする。タグは
              - code [ref=f2e275]: 生活记录
              - text: 、
              - code [ref=f2e276]: Cosplay
              - text: 、
              - code [ref=f2e277]: kigurumi
              - text: を含み、説明はハイフンだけである。
              - superscript [ref=f2e278]:
                - link "1" [ref=f2e279] [cursor=pointer]:
                  - /url: "#fn:bili-sep2"
              - text: 月内の日常と快適性の手掛かりとして残すが、5層の内訳、圧迫程度、周囲温度、生理的影響は確認できない。医学的結論や一律の層数上限は作らない。
            - heading [level=3] [ref=f2e280]:
              - text: 9月2日 22:50：1年以上の「変娃」経験を振り返る個人記録
              - link "¶" [ref=f2e281] [cursor=pointer]:
                - /url: "#92-22501"
            - paragraph [ref=f2e282]:
              - text: Bilibili の公開メタデータは「邪神フィギュアがどのように精緻な人形になったか—1年以上の変娃歴の振り返り」を9月2日22:50公開、投稿者を「停定の钟」、長さを4分47秒とする。タグには
              - code [ref=f2e283]: 总结盘点
              - text: 、
              - code [ref=f2e284]: 变娃
              - text: 、
              - code [ref=f2e285]: 经验总结
              - text: 、
              - code [ref=f2e286]: kigurumi
              - text: 、
              - code [ref=f2e287]: 我与Kigurumi的故事
              - text: がある。
              - superscript [ref=f2e288]:
                - link "2" [ref=f2e289] [cursor=pointer]:
                  - /url: "#fn:bili-retrospective"
              - text: これらの項目から、個人の経験に範囲を限った年単位の回顧であることを確認でき、日常、雑談、参加経験の手掛かりとして分類できる。
            - paragraph [ref=f2e290]: 公開説明はハイフンだけである。題名の前後比較は投稿者自身の表現であり、使用した面、工房、材料、学習手順を単独で証明せず、社群一般の成長経路も示さない。本ページは「個人の公開回顧が現れた」ことだけを記録し、製作チュートリアル、製品評価、傾向統計には書き換えない。
            - heading [level=3] [ref=f2e291]:
              - text: 9月3〜4日：北京のキャンプ撮影と初出勤記録
              - link "¶" [ref=f2e292] [cursor=pointer]:
                - /url: "#934"
            - paragraph [ref=f2e293]:
              - text: Bilibili の公開メタデータは「娃聚時刻：北京温榆河キャンプ撮影」を9月3日19:00公開、投稿者を「停定の钟」、長さを3分2秒とする。タグは
              - code [ref=f2e294]: 生活记录
              - text: 、
              - code [ref=f2e295]: cosplay
              - text: 、
              - code [ref=f2e296]: 变娃
              - text: 、
              - code [ref=f2e297]: 露营
              - text: 、
              - code [ref=f2e298]: kigurumi
              - text: 、
              - code [ref=f2e299]: kig
              - text: を含む。
              - superscript [ref=f2e300]:
                - link "3" [ref=f2e301] [cursor=pointer]:
                  - /url: "#fn:bili-sep3-5"
              - text: これにより北京・温榆河のキャンプ撮影を主題とする公開動画は確認できる。説明欄は空で、実際の撮影日、参加人数、招集者、許可、経路は確認できないため、正式なイベント告知や規模統計にはしない。
            - paragraph [ref=f2e302]:
              - text: 「初めての変娃出勤」は9月4日20:04公開、長さ2分38秒で、タグに
              - code [ref=f2e303]: MAIMAI
              - text: と
              - code [ref=f2e304]: kig
              - text: があり、説明はハイフンだけである。
              - superscript [ref=f2e305]:
                - link "3" [ref=f2e306] [cursor=pointer]:
                  - /url: "#fn:bili-sep3-5"
              - text: 投稿者自身が初出勤と位置づけた個人記録と、初心者経験がアーケード音楽ゲームに接したという最低限の情報だけを残す。場所、補助者、着用時間、一般的な初心者経路は推定しない。
            - heading [level=3] [ref=f2e307]:
              - text: 9月5日：ラバースーツ制作進捗と頭部工房の帰属
              - link "¶" [ref=f2e308] [cursor=pointer]:
                - /url: "#95"
            - paragraph [ref=f2e309]:
              - text: Maddie62 の「ラバースーツ本体が完成」は9月5日18:41公開、長さ1分30秒である。説明は当日に足カバー制作を続けるとし、タグは
              - code [ref=f2e310]: DIY
              - text: 、
              - code [ref=f2e311]: kigurumi
              - text: 、
              - code [ref=f2e312]: 胶衣
              - text: 、
              - code [ref=f2e313]: kig
              - text: を含む。
              - superscript [ref=f2e314]:
                - link "3" [ref=f2e315] [cursor=pointer]:
                  - /url: "#fn:bili-sep3-5"
              - text: 本体完成と足カバー制作中という段階は確認できるが、ゴム材、厚さ、接着、密封、可動余裕、試験結果は示されないため、チュートリアルにはしない。
            - paragraph [ref=f2e316]:
              - text: 同日20:28の「これは猫なのか？！【kigurumi】」は、説明欄で展示された頭部を「星尘 kigurumi 工坊」作と明記し、タグに
              - code [ref=f2e317]: kigurumi
              - text: と
              - code [ref=f2e318]: kig
              - text: を含む。
              - superscript [ref=f2e319]:
                - link "3" [ref=f2e320] [cursor=pointer]:
                  - /url: "#fn:bili-sep3-5"
              - text: 公開された作品帰属は確認できるが、型式、依頼手順、価格、納期、性能情報はないため、製品レビューや工房プロフィールにはしない。
            - heading [level=3] [ref=f2e321]:
              - text: 9月6日：反射コーティング試験と南京の高層撮影
              - link "¶" [ref=f2e322] [cursor=pointer]:
                - /url: "#96"
            - paragraph [ref=f2e323]:
              - text: Bilibili の公開メタデータは「[kigurumi]全身反光涂层测试」を9月6日19:39公開、投稿者を「奇数米饭」、長さを19秒とし、タグに
              - code [ref=f2e324]: 服飾
              - text: 、
              - code [ref=f2e325]: 屋外撮影
              - text: 、
              - code [ref=f2e326]: kigurumi
              - text: 、
              - code [ref=f2e327]: dollmask
              - text: を含む。説明は「機体温度が少し高い」と述べ、アイコン付きで撮影
              - code [ref=f2e328]: "@泡芙芙"
              - text: 、面
              - code [ref=f2e329]: "@DOLL UP"
              - text: 、衣装
              - code [ref=f2e330]: "@海苔喵呜"
              - text: を記す。
              - superscript [ref=f2e331]:
                - link "4" [ref=f2e332] [cursor=pointer]:
                  - /url: "#fn:bili-sep6"
              - text: これにより全身反射コーティングの公開屋外試験と共同制作の帰属、投稿者の熱感覚は確認できる。一方、コーティング材料、反射率、照明、気温、着用時間、測温値はなく、材料性能の比較や一般的な安全結論にはできない。
            - paragraph [ref=f2e333]:
              - text: 同日22:54、出云夏希CHANNEL は2分22秒の「娃娃在南京之巅」を公開した。説明は紫峰大厦の62階と45階テラスで撮影したと明記し、タグに
              - code [ref=f2e334]: 南京
              - text: 、
              - code [ref=f2e335]: 紫峰大厦
              - text: 、
              - code [ref=f2e336]: cosplay
              - text: 、
              - code [ref=f2e337]: kigurumi
              - text: がある。
              - superscript [ref=f2e338]:
                - link "4" [ref=f2e339] [cursor=pointer]:
                  - /url: "#fn:bili-sep6"
              - text: これは9月に場所の明確な都市高層撮影を加え、正式イベント以外の kigurumi 映像が展望階やテラスのような商業的公共空間にも入ることを示す。公開時刻は実際の撮影日を確定せず、施設許可、経路、着用時間、参加人数も説明されないため、正式な交流会や施設利用案内にはしない。
            - heading [level=3] [ref=f2e340]:
              - text: 9月7日：頭部の視界、深圳撮影、部品故障、硬質ウィッグ工程
              - link "¶" [ref=f2e341] [cursor=pointer]:
                - /url: "#97"
            - paragraph [ref=f2e342]:
              - text: Hidden_is_Fun は02:09、33秒の『太鼓の達人』記録を公開し、説明で頭部装着中の視界を「ほとんど見えない」と表現した。タグは
              - code [ref=f2e343]: kigurumi
              - text: 、
              - code [ref=f2e344]: 音楽ゲーム
              - text: 、
              - code [ref=f2e345]: 太鼓の達人
              - text: を含む。同日22:56、萌物の心は4分40秒の「尝试变娃打绝区零」を公開した。説明では、以前
              - code [ref=f2e346]: Overwatch
              - text: の PVP は視界が悪く困難で、『ゼンレスゾーンゼロ』でも赤と黄の攻撃表示が見えにくいため経験に頼ったとする。
              - superscript [ref=f2e347]:
                - link "5" [ref=f2e348] [cursor=pointer]:
                  - /url: "#fn:bili-sep7"
              - text: 異なる投稿者とゲームによる二つの自己申告は、頭部の視界が画面情報の読み取りに影響する個人経験の手掛かりになる。しかし、視窓寸法、視野角測定、画面設定、対照試験はなく、すべての頭部、プレイヤー、ゲームへ一般化できない。
            - paragraph [ref=f2e349]:
              - text: 11:48公開の29秒動画は、説明に「9月6日に深圳次元小镇で撮影」と明記し、同場の天宫心キャラクターを記名する。タグは
              - code [ref=f2e350]: kigurumi
              - text: と
              - code [ref=f2e351]: Cosplay
              - text: を含む。
              - superscript [ref=f2e352]:
                - link "5" [ref=f2e353] [cursor=pointer]:
                  - /url: "#fn:bili-sep7"
              - text: 実際の撮影日と場所があり、公開日しか分からない外景記録より情報は多い。一方、施設許可、参加人数、経路、主催者は示されず、都市撮影と共同制作の記録に留め、正式イベントにはしない。
            - paragraph [ref=f2e354]:
              - text: 13:33、Neo雪待 は「在电玩区自拍的乳胶小羊」を公開した。説明は、スカート内の電池ボックスが露出し、後に夜のダンス中に破損したと述べ、タグは
              - code [ref=f2e355]: DW14
              - text: 、
              - code [ref=f2e356]: 胶衣
              - text: 、
              - code [ref=f2e357]: kigurumi
              - text: 、
              - code [ref=f2e358]: 舞萌
              - text: を含む。
              - superscript [ref=f2e359]:
                - link "5" [ref=f2e360] [cursor=pointer]:
                  - /url: "#fn:bili-sep7"
              - text: これは着用部品の具体的な個人故障報告であり、イベント映像の背後に固定、引っ張り、保守の問題があることを示す。ただし、電池の用途、固定方法、荷重点、修理結果、主催者報告はなく、DW14 の事故統計や一般的な製品欠陥にはしない。
            - paragraph [ref=f2e361]:
              - text: 23:53、是點點__ は1分13秒の「kigurumi新人第一次做硬质假发的一些过程」を公開し、タグは
              - code [ref=f2e362]: 手工
              - text: 、
              - code [ref=f2e363]: 制作
              - text: 、
              - code [ref=f2e364]: 新人
              - text: 、
              - code [ref=f2e365]: 假发
              - text: 、
              - code [ref=f2e366]: kigurumi
              - text: を含む。
              - superscript [ref=f2e367]:
                - link "5" [ref=f2e368] [cursor=pointer]:
                  - /url: "#fn:bili-sep7"
              - text: 題名とタグは初心者視点の硬質ウィッグ工程展示を確認できるが、説明はハイフンだけである。基材、接着剤、分割、固定法、所要時間、耐久性は補えないため、工房 / 手作りの手掛かりに留め、チュートリアルにはしない。
            - heading [level=2] [ref=f2e369]:
              - text: 除外した重複と弱いシグナル
              - link "¶" [ref=f2e370] [cursor=pointer]:
                - /url: "#_2"
            - list [ref=f2e371]:
              - listitem [ref=f2e372]: 9月2日に公開された DW14 のレンズサインと看板娘交流の短片は8月に整理済みの同一イベント回顧であり、規則、番組表、主催者閉幕統計を追加しないため重複イベントにしない。
              - listitem [ref=f2e373]:
                - text: 9月3日の「変娃の第一歩、皮膚を着る」という動画は、公開タグが服飾、着こなし、
                - code [ref=f2e374]: zentai
                - text: などに限られ、専用コンテンツとも表示される。完全な kigurumi キャラクター文脈や着用工程を確認できないため、独立項目にしない。
              - listitem [ref=f2e375]: 9月4〜5日の飲水を題材にした冗談、誕生日記録、架空の結婚式、説明のない「新しい頭部」、造形だけの短片は個人投稿を示すにとどまり、安全規則、正式イベント、工房資料、業界傾向を支えないため単独項目にしない。
              - listitem [ref=f2e376]: 9月6日の DW14 回顧、ランウェイ断片、360度会場動画は、8月に整理済みの同じイベントを指す。主催者の規則や閉幕統計は加わらず、「1000体」など疑問形の標題は主催者の裏付けがないため参加数として扱わない。
              - listitem [ref=f2e377]: 同日の誕生日会、造形のみ、工房完成品、「長時間後の頭部内部」など標題中心の短片は、工程設定や検証可能な結論がなく、イベント、工房、安全の独立項目にはしない。
              - listitem [ref=f2e378]: 9月7〜8日の DW14 初参加感想、ミニゲーム、音楽ゲーム、夜企画の断片、および紫峰大厦撮影の別視点は、既収録の活動または撮影の回顧である。電池ボックスの保守報告を除き、主催者統計、規則、新しい場面を加えないため、重複イベントにはしない。
              - listitem [ref=f2e379]: 「旧頭部を新頭部に改造」、頭部解説、瞬き展示、通常の造形動画の公開欄には、材料、構造、制御法、試験データがない。长沙の夜間同行記録も都市名と共同制作の記名までであり、工房プロフィール、技術的結論、正式イベントには不足する。
              - listitem [ref=f2e380]: 造形展示だけの短片、単一画像、文脈のないカメラ交流は自動収録しない。工程設定、イベント事実、検証可能な議論が出た時点で元の出典系列を更新する。
              - listitem [ref=f2e381]: Niconico には締切範囲の直接関連追加がなかった。YouTube の結果は日常造形、DW14 の重複レンズサイン、未開始の予約配信に限られた。Bluesky と Reddit は今回接続できなかったため、旧資料、予約ページ、アクセス不能な結果で国際項目を補わない。
            - heading [level=2] [ref=f2e382]:
              - text: 分野と区分の判断
              - link "¶" [ref=f2e383] [cursor=pointer]:
                - /url: "#_3"
            - table [ref=f2e386]:
              - rowgroup [ref=f2e387]:
                - row [ref=f2e388]:
                  - columnheader "分野" [ref=f2e389]
                  - columnheader "9月8日時点の判断" [ref=f2e390]
                  - columnheader "処理" [ref=f2e391]
              - rowgroup [ref=f2e392]:
                - row [ref=f2e393]:
                  - cell "編年史" [ref=f2e394]
                  - cell "北京、南京、深圳の場所が明確な撮影。深圳だけ撮影日があり、いずれも正式イベントの規模は不明" [ref=f2e395]
                  - cell "月次手掛かりとして残し、独立編年事件にしない" [ref=f2e396]
                - row [ref=f2e397]:
                  - cell "日常 / 雑談" [ref=f2e398]
                  - cell "多層着用、個人回顧、初出勤、都市撮影、ゲーム時の視界" [ref=f2e399]
                  - cell "公開された自己申告の範囲だけ収録" [ref=f2e400]
                - row [ref=f2e401]:
                  - cell "工房 / 手作り" [ref=f2e402]
                  - cell "3Dプリント、ラバースーツと足カバー、頭部工房帰属、反射コーティング、硬質ウィッグ工程、電池ボックス故障" [ref=f2e403]
                  - cell "工程、帰属、試験、故障の境界を記録し、未公開設定を補わない" [ref=f2e404]
                - row [ref=f2e405]:
                  - cell "百科 / 科普" [ref=f2e406]
                  - cell "工程展示、工房帰属、個人回顧、ゲーム経験は完全なチュートリアル、レビュー、社群傾向ではない" [ref=f2e407]
                  - cell "証拠境界を記録" [ref=f2e408]
                - row [ref=f2e409]:
                  - cell "礼儀 / 安全" [ref=f2e410]
                  - cell "多層の締め付け、反射コーティングの熱感、電池ボックス破損、頭部視界はいずれも測定・規範のない個人シグナル" [ref=f2e411]
                  - cell "新しい安全基準を作らない" [ref=f2e412]
                - row [ref=f2e413]:
                  - cell "学術" [ref=f2e414]
                  - cell "9月の直接関連研究を確認できない" [ref=f2e415]
                  - cell "収録しない" [ref=f2e416]
            - paragraph [ref=f2e417]: 十三件の重複除去済み記録は、制作工程、工房帰属、個人着用、初心者出勤、個人回顧、工程試験、三都市の撮影、部品保守、ゲーム時の視界を含む。月次ダイジェストで十分であり、独立した工房、安全、人物、イベント区分は作らない。正式イベントページ、再現可能な設定、材料と許諾、測定法のある着用研究、または検証可能な社群調査が公開された場合、元の出典系列を重複なく更新する。
