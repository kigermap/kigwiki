            - generic [ref=e248]:
              - generic [ref=e249]:
                - paragraph [ref=e250]: Editorial Method
                - heading "以修志方法组织资料" [level=2] [ref=e251]
                - paragraph [ref=e252]: 资料馆的编辑原则是先立纲目，再收材料。每条内容都尽量说明时间、地点、参与者、来源、公开范围和不确定之处。对于尚未核实的线索，本站会标记为待考，不把猜测写成定论。
                - paragraph [ref=e253]: 当资料规模增长后，目录会继续扩展为活动谱系、工艺志、影像志、礼仪志、术语表和访谈索引。当前页面先提供稳定入口，让新读者理解项目，也让贡献者知道资料应放在哪里。
