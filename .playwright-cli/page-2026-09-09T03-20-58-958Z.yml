            - generic [ref=e229]:
              - paragraph [ref=e230]: Archive Mission
              - heading [level=2] [ref=e231]:
                - text: 为社群留下可查、可信、可延续的共同记忆
                - link "¶" [ref=e232] [cursor=pointer]:
                  - /url: "#_1"
              - paragraph [ref=e233]: Kigurumi 编年志不是临时资讯页，而是一座面向普通读者、创作者、活动参与者和研究整理者的公开资料馆。它记录的不只是“发生过什么”，也记录事件如何被见证、照片从何而来、服装与面具如何维护、人物在社群中承担何种角色，以及每一条资料能公开到什么程度。
              - paragraph [ref=e234]: 本站采用修志式结构：以时间线统摄全局，以志目分门别类，以人物传略补足经验，以地点条目呈现空间记忆，以来源目录说明证据链。读者可以从首页进入，也可以按年份、人物、地点或资料类型逐步查阅。
              - generic [ref=e235]:
                - generic [ref=e236]:
                  - strong [ref=e237]: 2010s
                  - generic [ref=e238]: 早期活动与资料萌芽
                - generic [ref=e239]:
