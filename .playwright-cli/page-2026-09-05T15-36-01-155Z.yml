              - text: 这些字段足以确认一条以个人经历为范围的年度式复盘，可归入日常、杂谈与参与经验线索。
            - paragraph [ref=e399]: 公开视频简介只有连字符。标题中的前后对比是发布者的自我描述，不能单独证明使用了哪些头壳、工坊、材料或学习步骤，也不能代表社群普遍成长路径。本页因此只记录“个人公开复盘出现”，不把它改写成制作教程、产品评价或趋势统计。
