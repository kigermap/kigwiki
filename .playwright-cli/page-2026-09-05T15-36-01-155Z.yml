            - paragraph [ref=e376]:
              - text: Bilibili 公共元数据把《一个 kigurumi 大头的打印过程～》标为 9 月 2 日 00:44 发布，发布者为“一个人在江边”，时长 52 秒；简介写明“创想 K1 Max 制作”，标签包含
              - code [ref=e377]: 手工
              - text: 、
              - code [ref=e378]: DIY
              - text: 、
              - code [ref=e379]: kigurumi
              - text: 与
              - code [ref=e380]: kig
              - text: 。
              - superscript [ref=e381]:
                - link "1" [ref=e382] [cursor=pointer]:
                  - /url: "#fn:bili-sep2"
              - text: 标题、简介和标签足以把它归入工坊 / 手工线索，并确认公开视频展示的是打印过程。公开字段没有说明耗材、壁厚、分件、后处理、模型许可或完整制作链，因此本站不把短片扩写成教程、参数建议或工坊档案。
            - paragraph [ref=e383]:
              - text: 同一公开接口把《五层也太紧了，必须得缓一缓【kigurumi】》标为 9 月 2 日 00:55 发布，发布者为 Naganohara_Mio_，时长 44 秒，标签包含
              - code [ref=e384]: 生活记录
              - text: 、
              - code [ref=e385]: Cosplay
              - text: 与
              - code [ref=e386]: kigurumi
              - text: ；简介只有连字符。
              - superscript [ref=e387]:
                - link "1" [ref=e388] [cursor=pointer]:
                  - /url: "#fn:bili-sep2"
              - text: 这可以作为当月穿戴日常和舒适度提醒，但标题不足以确定五层分别是什么、紧绷程度、环境温度或生理影响。本页只保留发布者的个人体验，不生成医学结论或统一穿戴上限。
