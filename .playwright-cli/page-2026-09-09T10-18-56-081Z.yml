            - list [ref=f36e776]:
              - listitem [ref=f36e777]: 猫豆腐、虾饺工房、底层人员及抛瓦均有官方淘宝／闲鱼店名声明；平台 UID、库存及价格另行核实。底层人员与抛瓦分别建档。
