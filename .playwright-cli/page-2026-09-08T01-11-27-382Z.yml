              - text: 本页仅把它作为一名发布者自述的首次出勤记录，保留“新人经验与街机娱乐相遇”这一最低限度信息，不推断地点、协助者、穿戴时长或所有新人的共同路径。
            - heading [level=3] [ref=f5e307]:
              - text: 9 月 5 日：胶衣制作进度与头壳工坊署名
              - link "¶" [ref=f5e308] [cursor=pointer]:
                - /url: "#9-5"
            - paragraph [ref=f5e309]:
              - text: 《胶衣主体做好啦》于 9 月 5 日 18:41 发布，发布者为 Maddie62，时长 1 分 30 秒；简介写“今天继续做个脚套”，标签包含
              - code [ref=f5e310]: DIY
              - text: 、
              - code [ref=f5e311]: kigurumi
              - text: 、
              - code [ref=f5e312]: 胶衣
              - text: 与
              - code [ref=f5e313]: kig
              - text: 。
              - superscript [ref=f5e314]:
                - link "3" [ref=f5e315] [cursor=pointer]:
                  - /url: "#fn:bili-sep3-5"
              - text: 这些字段支持“主体完成、脚套继续制作”的阶段性记录，但未给出胶料、厚度、粘接、密封、活动余量或测试结果，故不扩写为制作教程。
            - paragraph [ref=f5e316]:
              - text: 同日 20:28 发布的《这是猫啊！？？？【kigurumi】》在简介中明确写“头壳：星尘 kigurumi 工坊”，标签包含
              - code [ref=f5e317]: kigurumi
              - text: 与
              - code [ref=f5e318]: kig
              - text: 。
              - superscript [ref=f5e319]:
                - link "3" [ref=f5e320] [cursor=pointer]:
                  - /url: "#fn:bili-sep3-5"
              - text: 这可以建立公开视频中的作品归属，但短片不提供型号、委托流程、价格、交期或性能信息，本站不据此生成产品评测或工坊百科。
            - heading [level=3] [ref=f5e321]:
              - text: 9 月 6 日：反光涂层测试与南京高层外拍
              - link "¶" [ref=f5e322] [cursor=pointer]:
                - /url: "#9-6"
            - paragraph [ref=f5e323]:
              - text: Bilibili 公共元数据把《[kigurumi]全身反光涂层测试》标为 9 月 6 日 19:39 发布，发布者为“奇数米饭”，时长 19 秒，标签包含
              - code [ref=f5e324]: 服饰
              - text: 、
              - code [ref=f5e325]: 外景
              - text: 、
              - code [ref=f5e326]: kigurumi
              - text: 与
              - code [ref=f5e327]: dollmask
              - text: 。简介写“就是机体温度有点高”，并以图标列出摄影
              - code [ref=f5e328]: "@泡芙芙"
              - text: 、面具
              - code [ref=f5e329]: "@DOLL UP"
              - text: 和服装
              - code [ref=f5e330]: "@海苔喵呜"
              - text: 。
              - superscript [ref=f5e331]:
                - link "4" [ref=f5e332] [cursor=pointer]:
                  - /url: "#fn:bili-sep6"
              - text: 这些字段足以确认一次公开的全身反光涂层外景测试和协作署名，也保留了发布者的热感反馈；但没有涂层材料、反射率、光照、气温、穿戴时长或测温结果，因此不能比较材料性能，也不能建立一般性的安全结论。
            - paragraph [ref=f5e333]:
              - text: 同日 22:54，出云夏希CHANNEL 发布《娃娃在南京之巅》，时长 2 分 22 秒；简介明确写明在紫峰大厦 62 层与 45 层露台拍摄，标签包含
              - code [ref=f5e334]: 南京
              - text: 、
              - code [ref=f5e335]: 紫峰大厦
              - text: 、
              - code [ref=f5e336]: cosplay
              - text: 与
              - code [ref=f5e337]: kigurumi
              - text: 。
              - superscript [ref=f5e338]:
                - link "4" [ref=f5e339] [cursor=pointer]:
                  - /url: "#fn:bili-sep6"
              - text: 这为 9 月新增了一条地点明确的城市高层外拍记录，并显示正式活动之外的 kigurumi 影像也进入观景层与露台等商业公共场景。发布时间不能代替实际拍摄日期，公开视频也没有说明场地方许可、路线、穿戴时长或参与人数，故本页不把它写成正式聚会或场地使用指南。
            - heading [level=3] [ref=f5e340]:
              - text: 9 月 7 日：头壳视野、深圳外拍、部件故障与硬质假发过程
              - link "¶" [ref=f5e341] [cursor=pointer]:
                - /url: "#9-7"
            - paragraph [ref=f5e342]:
              - text: Hidden_is_Fun 于 02:09 发布一段 33 秒《太鼓达人》记录，简介以“根本看不见一点”描述头壳下的视野，标签包含
              - code [ref=f5e343]: kigurumi
              - text: 、
              - code [ref=f5e344]: 音乐游戏
              - text: 与
              - code [ref=f5e345]: 太鼓达人
              - text: 。同日 22:56，萌物の心发布 4 分 40 秒的《尝试变娃打绝区零》，简介称此前玩
              - code [ref=f5e346]: Overwatch
              - text: 时因视野太差无法进行 PVP，在《绝区零》中也不易看清红黄出招提示，需要依靠经验应对。
              - superscript [ref=f5e347]:
                - link "5" [ref=f5e348] [cursor=pointer]:
                  - /url: "#fn:bili-sep7"
              - text: 两条记录来自不同发布者和游戏，可作为“头壳视野会影响屏幕信息读取”的个体体验线索；但没有头壳视窗尺寸、视野角测量、显示设置或对照测试，因此不能得出所有头壳、玩家或游戏类型的统一结论。
            - paragraph [ref=f5e349]:
              - text: 11:48 发布的 29 秒视频在简介中明确写“9 月 6 日拍摄于深圳次元小镇”，并署名同场的天宫心角色；标签包含
