              - text: 这是一次具体的穿戴部件故障自述，能提醒活动影像之外还存在固定、拉扯与维护问题；但没有电池用途、安装方式、受力位置、维修结果或主办方报告，不能写成 DW14 事故统计或普遍产品缺陷。
