              - listitem [ref=f5e376]: 9 月 6 日新增的 DW14 回顾、T 台片段和 360 度逛展视频仍指向 8 月已经整理的同一活动，没有新增主办方规则或闭幕统计；其中标题里的“1000 只”等问句没有主办方口径支持，不作为人数数据。
