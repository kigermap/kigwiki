              - superscript [ref=f5e352]:
                - link "5" [ref=f5e353] [cursor=pointer]:
                  - /url: "#fn:bili-sep7"
              - text: 这条资料同时给出实际拍摄日和地点，比只有发布时间的外拍记录更完整，但仍未说明场地方许可、参与人数、路线或活动组织者，故只作为城市外拍与协作记录，不建立正式活动条目。
            - paragraph [ref=f5e354]:
              - text: 13:33，Neo雪待发布《在电玩区自拍的乳胶小羊》，简介称裙内电池盒已经外露，后来在夜场跳舞时断裂，标签包含
